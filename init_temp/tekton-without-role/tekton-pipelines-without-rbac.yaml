# tekton 관련 설정 커스텀
---
# harbor의 ca인증서
# 변경시 tekton-ctr 재실행
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: tekton-pipelines
  name: config-registry-cert
  namespace: nd-cicd
data:
  # Registry's self-signed certificate
  cert: |
    {{harbor_ca|indent(4)}}

---
# tekton 기능 최적화 설정
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: tekton-pipelines
  name: feature-flags
  namespace: nd-cicd
data:
  await-sidecar-readiness: "false"
  coschedule: pipelineruns
  disable-affinity-assistant: "true"
  disable-creds-init: "false"
  enable-api-fields: beta
  enable-cel-in-whenexpression: "false"
  enable-param-enum: "false"
  enable-provenance-in-status: "true"
  enable-step-actions: "false"
  enable-tekton-oci-bundles: "false"
  enforce-nonfalsifiability: none
  keep-pod-on-cancel: "false"
  require-git-ssh-secret-known-hosts: "false"
  results-from: termination-message
  running-in-environment-with-injected-sidecars: "true"
  send-cloudevents-for-runs: "false"
  set-security-context: "false"
  trusted-resources-verification-no-match-policy: ignore
---
# tekton task pod 글로벌 설정 (파이프라인실행시 생성될 task 파드의 배치 노드)
  # dns 관련 설정 추가 가능
  # dns host alias 설정
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: default
    app.kubernetes.io/part-of: tekton-pipelines
  name: config-defaults
  namespace: nd-cicd
data:
  default-pod-template: |
    nodeSelector:
      kubernetes.io/hostname: {{node_selector}}
    securityContext:
      fsGroup: 65532
---
# gitea에 oauth애플리케이션 등록후 발행된 secret코드 (oauth2-proxy를 통해 gitea 인증 후 tekton 대시보드 접근 기능용)
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-gitea
  namespace: nd-cicd
  labels:
    app: tekton-dashboard-auth
type: Opaque
stringData:
  # [gitea] 사이트관리 > Admin Settings > Integrations
  # Application Name : tekton-dashboard-auth
  # Redirect URIs: https://tekton.{{nnd_domain_name}}/oauth2/callback
  client_id: {{oauth_client_id}}
  client_secret: {{oauth_client_secret}}
---
# oauth2-proxy 설정 정보 (oauth2-proxy를 통해 gitea 인증 후 tekton 대시보드 접근 기능용)
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-gitea
  namespace: nd-cicd
  labels:
    app: tekton-dashboard-auth
data:
  oauth2_proxy_gitea.cfg: |
    http_address="0.0.0.0:4180"
    cookie_secret="OQINaROshtE9TcZkNAm-5Zs2Pv3xaWytBmc5W7sPX7w=" # openssl rand -base64 32 | tr -- '+/' '-_'
    email_domains=["*"]
    cookie_secure="false"
    upstreams="{{tekton_domain}}"
    cookie_domains=[".{{nnd_domain_name}}"] # Required so cookie can be read on all subdomains.
    whitelist_domains=[".{{nnd_domain_name}}"] # Required to allow redirection back to original requested target.

    # client_id="< client_id as generated by Gitea >"
    # client_secret="< client_secret as generated by Gitea >"
    redirect_url="{{tekton_domain}}/oauth2/callback"

    provider="github"
    provider_display_name="Gitea"
    
    login_url="{{gitea_domain}}/login/oauth/authorize"
    
    redeem_url="http://gitea-service.nd-cicd.svc.cluster.local:3000/login/oauth/access_token"
    validate_url="http://gitea-service.nd-cicd.svc.cluster.local:3000/api/v1/user/emails"

    cookie_expire="0"
---
# oauth2-proxy 배포
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: nd-cicd
  labels:
    app: tekton-dashboard-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tekton-dashboard-auth
  template:
    metadata:
      labels:
        app: tekton-dashboard-auth
    spec:
      containers:
      - image: {{image_registry}}/nnd/oauth2-proxy:v7.6.0
        name: oauth2-proxy
        args:
        - --config=/etc/oauth2_proxy/oauth2_proxy_gitea.cfg
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-gitea
              key: client_id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-gitea
              key: client_secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          #runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 4180
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/oauth2_proxy
      nodeSelector:
        kubernetes.io/hostname: {{node_selector}}
      volumes:
      - name: config
        configMap:
          name: oauth2-proxy-gitea
          defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: nd-cicd
  labels:
    app: tekton-dashboard-auth
spec:
  ports:
  - name: http
    port: 4180
    protocol: TCP
    targetPort: 4180
  selector:
    app: tekton-dashboard-auth
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  name: ing-oauth2-proxy
  namespace: nd-cicd
  labels:
    app: tekton-dashboard-auth
spec:
  ingressClassName: nginx
  rules:
  - host: {{tekton_host_url}}
    http:
      paths:
      - backend:
          service:
            name: oauth2-proxy
            port:
              name: http
        path: /oauth2
        pathType: Prefix
  tls:
  - hosts:
    - {{tekton_host_url}}
    secretName: tekton-ssl
---
# tekton ingress에 oauht2관련 설정 추가
# subpath 형식과 prefix 형식은 구분되어서 작성되어야 함
# rewrite, path, host 정보가 변경됨
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/auth-url: http://oauth2-proxy.nd-cicd.svc.cluster.local:4180/oauth2/auth # oauth2
    nginx.ingress.kubernetes.io/auth-signin: https://$host/oauth2/sign_in?rd=$escaped_request_uri # oauth2
    #nginx.ingress.kubernetes.io/rewrite-target: /$2  # subpath 사용시 추가
  name: ing-tekton
  namespace: nd-cicd
spec:
  ingressClassName: nginx
  rules:
  - host: {{tekton_host_url}}
    http:
      paths:
      - backend:
          service:
            name: tekton-dashboard
            port:
              name: http
              # number: 9097
        path: /
        # pathType: Prefix
        pathType: ImplementationSpecific # oauth2
  tls:
    - hosts:
      - {{tekton_host_url}}
      secretName: tekton-ssl