apiVersion: tekton.dev/v1
kind: Task
metadata:
  annotations:
    tekton.dev/categories: Security
    tekton.dev/displayName: sonarqube scanner
    tekton.dev/pipelines.minVersion: 0.17.0
    tekton.dev/platforms: linux/amd64
    tekton.dev/tags: security
  labels:
    app.kubernetes.io/version: "0.4.1"
    hub.tekton.dev/catalog: tekton
  name: sonarqube-scanner
  namespace: tekton-catalog
spec:
  description: |-
    The following task can be used to perform static analysis on the source code provided the SonarQube server is hosted
    SonarQube is the leading tool for continuously inspecting the Code Quality and Security of your codebases, all while empowering development teams. Analyze over 25 popular programming languages including C#, VB.Net, JavaScript, TypeScript and C++. It detects bugs, vulnerabilities and code smells across project branches and pull requests.
  params:
  - default: ""
    name: CONTEXT_DIR
    type: string
  - default: ""
    description: SonarQube server URL
    name: SONAR_HOST_URL
    type: string
  - default: ""
    description: Project's unique key
    name: SONAR_PROJECT_KEY
    type: string
  - default: "1.0"
    description: 'Version of the project. Default: 1.0'
    name: PROJECT_VERSION
    type: string
  - default: .
    description: Comma-separated paths to directories containing main source files
    name: SOURCE_TO_SCAN
    type: string
  - default: ""
    description: The organization in sonarqube where the project exists
    name: SONAR_ORGANIZATION
    type: string
  - default: docker.io/sonarsource/sonar-scanner-cli:4.6@sha256:7a976330a8bad1beca6584c1c118e946e7a25fdc5b664d5c0a869a6577d81b4f
    description: The sonarqube scanner CLI image which will run the scan
    name: SONAR_SCANNER_IMAGE
    type: string
  - default: login
    description: Name of the file of the login within the sonarqube credentials workspace
    name: SONAR_LOGIN_KEY
    type: string
  - default: password
    description: Name of the file of the password within the sonarqube credentials
      workspace
    name: SONAR_PASSWORD_KEY
    type: string
  # for links
  - default: ""
    name: SONAR_LINKS_CI
    type: string
  - default: ""
    name: SONAR_LINKS_SCM
    type: string
  # for JAVA
  - default: ""
    name: SONAR_LANGUAGE
    type: string
  - default: ""
    name: SONAR_INCLUSIONS
    type: string
  - default: ""
    name: SONAR_EXCLUSIONS
    type: string
  - default: ""
    name: SONAR_JAVA_SOURCE
    type: string
  - default: ""
    name: SONAR_JAVA_BINARIES
    type: string
  - default: ""
    name: SONAR_JAVA_LIBRARIES
    type: string
  - default: ""
    name: SONAR_JUNIT_REPORTPATHS
    type: string
  - default: "main" 
    name: SONAR_BRANCH_NAME 
    type: string 
  - default: registry.access.redhat.com/ubi8/ubi-minimal:8.2
    name: SONAR_PROP_IMAGE
    type: string
  - default: "false"
    description: 'true 면 Quality Gate 결과를 기다려 FAILED 일 때 task 를 실패시킨다(빌드 차단). 기본 false: 결과는 SonarQube 화면에서 보고 빌드는 계속'
    name: SONAR_QUALITYGATE_WAIT
    type: string
  - default: "true"
    description: SonarQube 분석 전에 Semgrep 보안점검(행안부 보안약점)을 돌리고, 결과(SARIF)를 SonarQube 로 함께 올린다. 판정은 SonarQube 품질게이트가 한다. 끄려면 Task 의 이 기본값을 false 로 바꾼다
    name: SEMGREP_ENABLED
    type: string
  - default: rules
    description: 규칙 저장소 기준 규칙 디렉터리. SonarQube 의 규칙 키에 이 경로가 들어가므로 바꾸면 오탐 처리 이력이 끊긴다
    name: SEMGREP_RULES_PATH
    type: string
  - default: "900"
    name: SEMGREP_TIMEOUT_SEC
    type: string
  - default: "{{image_registry}}/nnd/tekton-cicd/semgrep-mois:v0.7.0@sha256:d761e3b329a6e8cb4e8fb2eb03b64d1146cfeaf982ea6000bb23aeedd9ae7944"
    description: Semgrep CE 1.180.0 + 행안부 규칙(security-rules v0.7.0, Java·Python·JS·TS)을 넣은 이미지 (security-rules 저장소의 Dockerfile 로 만든다, digest 로 고정)
    name: SEMGREP_IMAGE
    type: string
  volumes:
  - name: semgrep-out
    emptyDir: {}
  results:
  - name: semgrep-status
    description: Semgrep 보안점검 결과 — ok(스캔 성공), failed(스캔 실패 · 결과 없이 SonarQube 진행), disabled
  steps:
  # Semgrep 보안점검. 탐지가 있어도 실패하지 않고 SARIF 를 /semgrep-out 에 남긴다.
  # 스캔 자체가 실패하면(규칙 저장소·시간 초과·semgrep 오류) task 가 실패한다 — 점검이 빠진 채 넘어가지 않게.
  - computeResources: {}
    env:
    - name: RULES_ROOT
      value: /semgrep-rules
    - name: RULES_PATH
      value: $(params.SEMGREP_RULES_PATH)
    - name: SRC_ROOT
      value: $(workspaces.source.path)/$(params.CONTEXT_DIR)
    - name: TARGET_PATH
      value: "."
    - name: OUT_DIR
      value: /semgrep-out
    - name: TIMEOUT_SEC
      value: $(params.SEMGREP_TIMEOUT_SEC)
    # 판정은 SonarQube 품질게이트가 한다. 보고서(report.py)는 로그용이라 기준치를 모두 무제한(-1)으로 둔다
    - name: MAX_MOIS_BLOCK
      value: "-1"
    - name: MAX_MOIS_WARN
      value: "-1"
    - name: MAX_CVE_CRITICAL
      value: "-1"
    - name: MAX_CVE_HIGH
      value: "-1"
    - name: MAX_CVE_MEDIUM
      value: "-1"
    - name: CVE_REACHABLE_ONLY
      value: "false"
    - name: BASELINE_REF
      value: ""
    # 버전 확인·메트릭 전송 등 외부 호출을 끈다
    - name: SEMGREP_ENABLE_VERSION_CHECK
      value: "0"
    - name: SEMGREP_SEND_METRICS
      value: "off"
    # git-clone(비root)이 만든 저장소를 root 인 semgrep 컨테이너에서 읽기 위함 (dubious ownership)
    - name: GIT_CONFIG_COUNT
      value: "1"
    - name: GIT_CONFIG_KEY_0
      value: safe.directory
    - name: GIT_CONFIG_VALUE_0
      value: "*"
    - name: TZ
      value: Asia/Seoul
    image: $(params.SEMGREP_IMAGE)
    name: semgrep-scan
    volumeMounts:
    - name: semgrep-out
      mountPath: /semgrep-out
    workingDir: $(workspaces.source.path)/$(params.CONTEXT_DIR)
    script: |
      #!/usr/bin/env bash
      set -uo pipefail
      if [ "$(params.SEMGREP_ENABLED)" != "true" ]; then
        echo "[semgrep] SEMGREP_ENABLED=$(params.SEMGREP_ENABLED) — 건너뜀"
        echo -n disabled > "$(results.semgrep-status.path)"
        exit 0
      fi
      # Semgrep 은 검사만 한다. 이 단계의 어떤 실패도 빌드를 막지 않는다 (판정은 SonarQube 품질게이트).
      # 실패하면 아래에서 크게 알리고, SonarQube 로 넘길 결과 없이 다음 단계로 간다.
      (
      set -e
      fail() { echo "[semgrep] 실패: $*" >&2; exit 1; }
      # 1) 규칙은 이미지 안(/semgrep-rules)에 들어 있다 — 폐쇄망에서도 외부 접근 없이 점검한다
      echo "[semgrep] 규칙셋 $(cat "$RULES_ROOT/VERSION" 2>/dev/null || echo '버전 파일 없음') (이미지 $(params.SEMGREP_IMAGE))"
      [ -f "$RULES_ROOT/scripts/report.py" ] || fail "이미지에 규칙이 없음 — SEMGREP_IMAGE 가 security-rules 의 Dockerfile 로 만든 이미지인지 확인"

      # 2) 입력값·규칙 검사 → 스캔 (작업 디렉터리 = SonarQube 분석 기준 디렉터리. SARIF 의 파일 경로가 여기에 맞춰진다)
      python3 "$RULES_ROOT/scripts/report.py" preflight
      cd "$SRC_ROOT"
      args=(scan --config "$RULES_ROOT/$RULES_PATH" --metrics=off --disable-version-check
            --json -o "$OUT_DIR/semgrep.json" --sarif-output="$OUT_DIR/semgrep.raw.sarif")
      echo "+ timeout $TIMEOUT_SEC semgrep ${args[*]} ."
      rc=0
      timeout "$TIMEOUT_SEC" semgrep "${args[@]}" . || rc=$?
      case "$rc" in
        0)       ;;
        124|143) fail "${TIMEOUT_SEC}초 안에 끝나지 않음 (SEMGREP_TIMEOUT_SEC 확인)" ;;
        *)       fail "semgrep 종료코드 $rc (위 로그 참고)" ;;
      esac

      # 3) 로그 보고서 (판정 없음)
      mkdir -p "$OUT_DIR/results"
      RESULTS_DIR="$OUT_DIR/results" python3 "$RULES_ROOT/scripts/report.py" report \
        || echo "[semgrep] 보고서의 GATE 는 참고용이다 (파싱 오류가 있으면 FAIL 로 나온다). 판정은 SonarQube 가 한다"

      # 4) SonarQube 용 SARIF. semgrep 의 열 위치는 바이트, SonarQube 는 문자 기준이라
      #    한글이 있는 줄에서 가져오기가 실패한다 → 열 위치를 지우고 줄 번호만 남긴다
      python3 - "$OUT_DIR/semgrep.raw.sarif" "$OUT_DIR/semgrep.sarif" "$OUT_DIR/sonar-inclusions.txt" <<'PY'
      import json, sys
      sarif = json.load(open(sys.argv[1], encoding='utf-8'))
      n = 0
      for run in sarif.get('runs', []):
          for result in run.get('results', []):
              n += 1
              for loc in result.get('locations', []):
                  region = loc.get('physicalLocation', {}).get('region', {})
                  region.pop('startColumn', None)
                  region.pop('endColumn', None)
      json.dump(sarif, open(sys.argv[2], 'w', encoding='utf-8'), ensure_ascii=False)
      # 탐지된 파일 목록. sonar.inclusions 가 걸린 파이프라인에서 이 파일들이 분석 대상에서 빠지면
      # SonarQube 가 탐지를 프로젝트에 붙이고 파일·줄 위치를 잃는다 (MyBatis 매퍼 XML 등) → sonar-properties-create 가 덧붙인다
      files = sorted({loc['physicalLocation']['artifactLocation']['uri']
                      for run in sarif.get('runs', []) for result in run.get('results', [])
                      for loc in result.get('locations', [])
                      if loc.get('physicalLocation', {}).get('artifactLocation', {}).get('uri')})
      files = [f for f in files if ',' not in f and '\n' not in f]
      open(sys.argv[3], 'w', encoding='utf-8').write(','.join(files))
      print(f'[semgrep] SonarQube 로 넘길 탐지 {n}건 (파일 {len(files)}개) → {sys.argv[2]}')
      PY
      )
      rc=$?
      # 성공·실패를 TaskRun 결과(semgrep-status)로 남긴다 — 빌드는 막지 않지만 "실패"와 "0건"을 구분해 볼 수 있게
      if [ "$rc" = "0" ]; then echo -n ok > "$(results.semgrep-status.path)"; else echo -n failed > "$(results.semgrep-status.path)"; fi
      if [ "$rc" != "0" ]; then
        rm -f "$OUT_DIR/semgrep.sarif" "$OUT_DIR/sonar-inclusions.txt"
        echo "================================================================"
        echo "[semgrep] ★ 보안점검(Semgrep)을 끝내지 못했습니다 (종료코드 $rc, 위 로그 참고)."
        echo "[semgrep]   빌드는 계속 진행하지만 이번 SonarQube 분석에는 Semgrep 결과가 없습니다."
        echo "================================================================"
      fi
      exit 0
  - computeResources: {}
    env:
    - name: SONAR_HOST_URL
      value: $(params.SONAR_HOST_URL)
    - name: SONAR_PROJECT_KEY
      value: $(params.SONAR_PROJECT_KEY)
    - name: PROJECT_VERSION
      value: $(params.PROJECT_VERSION)
    - name: SOURCE_TO_SCAN
      value: $(params.SOURCE_TO_SCAN)
    - name: SONAR_ORGANIZATION
      value: $(params.SONAR_ORGANIZATION)
    # for links
    - name: SONAR_LINKS_CI
      value: $(params.SONAR_LINKS_CI)
    - name: SONAR_LINKS_SCM
      value: $(params.SONAR_LINKS_SCM)
    - name: SONAR_LANGUAGE
      value: $(params.SONAR_LANGUAGE)
    - name: SONAR_INCLUSIONS
      value: $(params.SONAR_INCLUSIONS)
    - name: SONAR_EXCLUSIONS
      value: $(params.SONAR_EXCLUSIONS)
    # for JAVA
    - name: SONAR_JAVA_SOURCE
      value: $(params.SONAR_JAVA_SOURCE)
    - name: SONAR_JAVA_BINARIES
      value: $(params.SONAR_JAVA_BINARIES)
    - name: SONAR_JAVA_LIBRARIES
      value: $(params.SONAR_JAVA_LIBRARIES)
    - name: SONAR_JUNIT_REPORTPATHS
      value: $(params.SONAR_JUNIT_REPORTPATHS)
    - name: SONAR_BRANCH_NAME 
      value: $(params.SONAR_BRANCH_NAME) 
    image: $(params.SONAR_PROP_IMAGE)
    name: sonar-properties-create
    volumeMounts:
    - name: semgrep-out
      mountPath: /semgrep-out
    script: |
      #!/usr/bin/env bash

      replaceValues() {
        filename=$1
        thekey=$2
        newvalue=$3

        if ! grep -R "^[#]*\s*${thekey}=.*" $filename >/dev/null; then
          echo "APPENDING because '${thekey}' not found"
          echo "" >>$filename
          echo "$thekey=$newvalue" >>$filename
        else
          echo "SETTING because '${thekey}' found already"
          sed -ir "s|^[#]*\s*${thekey}=.*|$thekey=$newvalue|" $filename
        fi
      }

      if [[ "$(workspaces.sonar-settings.bound)" == "true" ]]; then
        if [[ -f $(workspaces.sonar-settings.path)/sonar-project.properties ]]; then
          echo "using user provided sonar-project.properties file"
          cp -RL $(workspaces.sonar-settings.path)/sonar-project.properties $(workspaces.source.path)/$(params.CONTEXT_DIR)/sonar-project.properties
        fi
      fi

      if [[ -f $(workspaces.source.path)/$(params.CONTEXT_DIR)/sonar-project.properties ]]; then
        if [[ -n "${SONAR_HOST_URL}" ]]; then
          echo "replacing sonar host URL"
          replaceValues $(workspaces.source.path)/$(params.CONTEXT_DIR)/sonar-project.properties sonar.host.url "${SONAR_HOST_URL}"
        fi
        if [[ -n "${SONAR_PROJECT_KEY}" ]]; then
          echo "replacing sonar project key"
          replaceValues $(workspaces.source.path)/$(params.CONTEXT_DIR)/sonar-project.properties sonar.projectKey "${SONAR_PROJECT_KEY}"
        fi
        echo "Values in sonar-project.properties file replaced successfully..."
        pwd
        cat $(workspaces.source.path)/$(params.CONTEXT_DIR)/sonar-project.properties
        cat sonar-project.properties
      else
        echo "Creating sonar-project.properties file..."
        touch sonar-project.properties
        [[ -n "${SONAR_PROJECT_KEY}" ]] && {
          echo "sonar.projectKey=${SONAR_PROJECT_KEY}" >> sonar-project.properties
        } || {
          echo "missing property SONAR_PROJECT_KEY"
          exit 1
        }

        [[ -n "${SONAR_HOST_URL}" ]] && {
          echo "sonar.host.url=${SONAR_HOST_URL}" >> sonar-project.properties
        } || {
          echo "missing property SONAR_HOST_URL"
          exit 1
        }

        [[ -n "${PROJECT_VERSION}" ]] && {
          echo "sonar.projectVersion=${PROJECT_VERSION}" >> sonar-project.properties
        }

        [[ -n "${SONAR_ORGANIZATION}" ]] && {
          echo "sonar.organization=${SONAR_ORGANIZATION}" >> sonar-project.properties
        }

        # Semgrep 이 탐지한 파일(MyBatis 매퍼 XML, 분석 대상 폴더 밖 파일 등)을 SonarQube 분석 대상에 덧붙인다 — 빠지면 탐지가 파일·줄 위치를 잃는다.
        # Java 파일은 sonar.java.binaries 가 있을 때만 덧붙인다 (없으면 SonarQube Java 분석이 실패해 빌드가 멈춘다 — npm 파이프라인 등)
        SEMGREP_FILES_CSV=""
        if [[ -s /semgrep-out/sonar-inclusions.txt ]]; then
          SEMGREP_FILES_CSV="$(cat /semgrep-out/sonar-inclusions.txt)"
          if [[ -z "${SONAR_JAVA_BINARIES}" ]]; then
            SEMGREP_FILES_CSV="$(tr ',' '\n' <<< "${SEMGREP_FILES_CSV}" | grep -v '\.java$' | paste -sd, -)"
          fi
        fi
        EXTRA_SOURCES=""
        if [[ -n "${SEMGREP_FILES_CSV}" && "${SOURCE_TO_SCAN}" != "." && "${SOURCE_TO_SCAN}" != "./" ]]; then
          IFS=',' read -ra SEMGREP_FILES <<< "${SEMGREP_FILES_CSV}"
          for f in "${SEMGREP_FILES[@]}"; do
            case "$f" in "${SOURCE_TO_SCAN%/}"/*) ;; *) EXTRA_SOURCES="${EXTRA_SOURCES},${f}" ;; esac
          done
        fi
        echo "sonar.sources=${SOURCE_TO_SCAN}${EXTRA_SOURCES}" >> sonar-project.properties

        # for branch 
        [[ -n "${SONAR_BRANCH_NAME}" ]] && { 
          echo "sonar.branch.name=${SONAR_BRANCH_NAME}" >> sonar-project.properties 
        } 

        # for links
        [[ -n "${SONAR_LINKS_CI}" ]] && {
          echo "sonar.links.ci=${SONAR_LINKS_CI}" >> sonar-project.properties
        }
        [[ -n "${SONAR_LINKS_SCM}" ]] && {
          echo "sonar.links.scm=${SONAR_LINKS_SCM}" >> sonar-project.properties
          echo "sonar.scm.provider=git" >> sonar-project.properties
        }

        # for JAVA
        [[ -n "${SONAR_LANGUAGE}" ]] && {
          echo "sonar.language=${SONAR_LANGUAGE}" >> sonar-project.properties
        }
        [[ -n "${SONAR_INCLUSIONS}" ]] && {
          if [[ -n "${SEMGREP_FILES_CSV}" ]]; then
            echo "sonar.inclusions=${SONAR_INCLUSIONS},${SEMGREP_FILES_CSV}" >> sonar-project.properties
          else
            echo "sonar.inclusions=${SONAR_INCLUSIONS}" >> sonar-project.properties
          fi
        }
        [[ -n "${SONAR_EXCLUSIONS}" ]] && {
          echo "sonar.exclusions=${SONAR_EXCLUSIONS}" >> sonar-project.properties
        }
        [[ -n "${SONAR_JAVA_SOURCE}" ]] && {
          echo "sonar.java.source=${SONAR_JAVA_SOURCE}" >> sonar-project.properties
        }
        [[ -n "${SONAR_JAVA_BINARIES}" ]] && {
          echo "sonar.java.binaries=${SONAR_JAVA_BINARIES}" >> sonar-project.properties
        }
        [[ -n "${SONAR_JAVA_LIBRARIES}" ]] && {
          echo "sonar.java.libraries=${SONAR_JAVA_LIBRARIES}" >> sonar-project.properties
        }
        [[ -n "${SONAR_JUNIT_REPORTPATHS}" ]] && {
          echo "sonar.junit.reportPaths=${SONAR_JUNIT_REPORTPATHS}" >> sonar-project.properties
        }

        echo "---------------------------"
        cat $(workspaces.source.path)/$(params.CONTEXT_DIR)/sonar-project.properties
      fi

      if [[ "$(workspaces.sonar-credentials.bound)" == "true" ]]; then
        if [[ -f $(workspaces.sonar-credentials.path)/$(params.SONAR_PASSWORD_KEY) ]]; then
          SONAR_PASSWORD=`cat $(workspaces.sonar-credentials.path)/$(params.SONAR_PASSWORD_KEY)`
          replaceValues $(workspaces.source.path)/$(params.CONTEXT_DIR)/sonar-project.properties sonar.password "${SONAR_PASSWORD}"
        fi
        if [[ -f $(workspaces.sonar-credentials.path)/$(params.SONAR_LOGIN_KEY) ]]; then
          SONAR_LOGIN=`cat $(workspaces.sonar-credentials.path)/$(params.SONAR_LOGIN_KEY)`
          replaceValues $(workspaces.source.path)/$(params.CONTEXT_DIR)/sonar-project.properties sonar.token "${SONAR_LOGIN}"
        fi
      fi
    workingDir: $(workspaces.source.path)/$(params.CONTEXT_DIR)
  - computeResources: {}
    env:
    - name: TZ
      value: Asia/Seoul
    # command:
    # - sonar-scanner
    image: $(params.SONAR_SCANNER_IMAGE)
    name: sonar-scan
    volumeMounts:
    - name: semgrep-out
      mountPath: /semgrep-out
    workingDir: $(workspaces.source.path)/$(params.CONTEXT_DIR)
    script: |
      #!/usr/bin/env bash

      if [ "$(workspaces.ssl-ca-directory.bound)" = "true" ]; then
        for f in $(workspaces.ssl-ca-directory.path)/*
        do
          $JAVA_HOME/bin/keytool -importcert -file "${f}" -alias $(basename "${f}") -cacerts -storepass changeit -noprompt
        done
      fi

      # Semgrep 결과가 있으면 외부 이슈로 함께 올린다 (semgrep-scan step 이 만든 파일)
      SARIF_ARGS=()
      if [ -s /semgrep-out/semgrep.sarif ]; then
        SARIF_ARGS=(-Dsonar.sarifReportPaths=/semgrep-out/semgrep.sarif)
      fi

      sonar-scanner "${SARIF_ARGS[@]}" -Dsonar.qualitygate.wait=$(params.SONAR_QUALITYGATE_WAIT) -Dsonar.qualitygate.timeout=300
  workspaces:
  - description: Workspace containing the code which needs to be scanned by SonarQube
    name: source
  - name: ssl-ca-directory
    optional: true
  - description: Optional workspace where SonarQube properties can be mounted
    name: sonar-settings
    optional: true
  - description: |
      A workspace containing a login or password for use within sonarqube.
    name: sonar-credentials
    optional: true
  - description: Local repo (m2) workspace
    name: maven-local-repo
    optional: true
  - description: Semgrep 규칙 저장소 인증 (.git-credentials, .gitconfig — git-clone 과 같은 시크릿)
    name: basic-auth
    optional: true
