apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: build-python-library
  namespace: tekton-catalog
spec:
  description: |
    This Pipeline for python library build. (publish to nexus pypi-hosted)
    build-maven-library / build-gradle-library 의 파이썬 판. 이미지 빌드/배포 없이 wheel/sdist publish 까지만 수행한다.
    소스에 pyproject.toml (name/version/dependencies) 이 있어야 한다.
  params:
  - name: git-host-url
    default: "{{gitea_domain}}"
    type: string
  - name: code-repo-org
    default: sample
    type: string
  - name: code-repo-name
    default: sample-python-core
    type: string
  - name: code-repo-url
    description: Code Repository URL to clone from.
    default:  $(params.git-host-url)/$(params.code-repo-org)/$(params.code-repo-name).git
    type: string
  - name: code-revision
    description: Revision to checkout. (branch, tag, sha, ref, etc...)
    default: main
    type: string
  - name: python-version
    default: "3.13"
    type: string
  - name: requirements-file
    description: 라이브러리는 보통 pyproject.toml 에 의존성을 두므로 파일이 없으면 건너뛴다.
    default: requirements.txt
    type: string
  - name: artifact-find-pattern
    default: dist/*.whl
    type: string
  - name: artifact-rename
    default: ""
    type: string
  - name: skip-code-test
    default: "false"
    type: string
  - name: skip-code-analysis
    default: "false"
    type: string
  - name: skip-code-artifact
    default: "false"
    type: string
  - name: skip-build-trigger
    default: "true"
    type: string
  - name: app-env
    default: tdev
    type: string
  - name: app-name
    default: $(params.code-repo-name)
    type: string
  - name: build-trigger-scripts
    default: []
    type: array
  - name: working-pr-dir
    default: $(context.pipelineRun.name)
    type: string
  tasks:
  - displayName: Code Fetch
    name: code-fetch
    params:
    - name: gitInitImage
      value: "{{image_registry}}/nnd/tekton-cicd/git-init:v0.40.2-tz"
    - name: crtFileName
      value: ca-certificates.crt
    - name: sslVerify
      value: "false"
    - name: deleteExisting
      value: "true"
    - name: subdirectory
      value: $(params.working-pr-dir)/$(params.code-repo-name)
    - name: url
      value: $(params.code-repo-url)
    - name: revision
      value: $(params.code-revision)
    taskRef:
      kind: Task
      params:
      - name: kind
        value: task
      - name: name
        value: git-clone
      - name: namespace
        value: tekton-catalog
      resolver: cluster
    workspaces:
    - name: output
      workspace: shared-data
    - name: basic-auth
      workspace: gitconfig
    - name: ssl-ca-directory
      workspace: ssl-ca-directory
  - displayName: Code Build
    name: code-build
    params:
    - name: PYTHON_IMAGE
      value: "{{image_registry}}/nnd/baseimage/python:$(params.python-version)-slim"
    - name: CONTEXT_DIR
      value: $(params.working-pr-dir)/$(params.code-repo-name)
    - name: REQUIREMENTS_FILE
      value: $(params.requirements-file)
    - name: EXTRA_PACKAGES
      value: build
    - name: PYTHON_COMMAND
      value: |
        python -m build
    - name: ARTIFACT_FIND_PATTERN
      value: $(params.artifact-find-pattern)
    - name: ARTIFACT_RENAME
      value: $(params.artifact-rename)
    runAfter:
    - code-fetch
    taskRef:
      kind: Task
      params:
      - name: kind
        value: task
      - name: name
        value: python
      - name: namespace
        value: tekton-catalog
      resolver: cluster
    workspaces:
    - name: source
      workspace: shared-data
    - name: ssl-ca-directory
      workspace: ssl-ca-directory
    - name: pip-settings
      workspace: pip-settings
    - name: pip-local-cache
      workspace: pip-local-cache
  - displayName: Code PytestTest
    name: code-test
    when:
    - input: $(params.skip-code-test)
      operator: in
      values:
      - "false"
    params:
    - name: PYTHON_IMAGE
      value: "{{image_registry}}/nnd/baseimage/python:$(params.python-version)-slim"
    - name: CONTEXT_DIR
      value: $(params.working-pr-dir)/$(params.code-repo-name)
    - name: REQUIREMENTS_FILE
      value: $(params.requirements-file)
    # 테스트에서 패키지를 import 해야 하므로 자기 자신을 편집모드로 설치한다
    - name: EXTRA_PACKAGES
      value: -e . pytest
    - name: PYTHON_COMMAND
      value: |
        pytest -q --junitxml=report/junit.xml
    runAfter:
    - code-build
    taskRef:
      kind: Task
      params:
      - name: kind
        value: task
      - name: name
        value: python
      - name: namespace
        value: tekton-catalog
      resolver: cluster
    workspaces:
    - name: source
      workspace: shared-data
    - name: ssl-ca-directory
      workspace: ssl-ca-directory
    - name: pip-settings
      workspace: pip-settings
    - name: pip-local-cache
      workspace: pip-local-cache
  - displayName: Code Analysis
    name: code-analysis
    when:
    - input: $(params.skip-code-analysis)
      operator: in
      values:
      - "false"
    params:
    - name: CONTEXT_DIR
      value: $(params.working-pr-dir)/$(params.code-repo-name)
    - name: SONAR_HOST_URL
      value: "{{sonar_host_url_internal}}"
    - name: SONAR_PROJECT_KEY
      value: $(params.code-repo-name)
    # python task 가 wheel 파일명에서 뽑아준 버전
    - name: PROJECT_VERSION
      value: $(tasks.code-build.results.version)
    - name: SOURCE_TO_SCAN
      value: .
    - name: SONAR_SCANNER_IMAGE
      value: "{{image_registry}}/nnd/tekton-cicd/sonar-scanner-cli:12.1"
    - name: SONAR_LOGIN_KEY
      value: login
    - name: SONAR_PASSWORD_KEY
      value: password
    - name: SONAR_LINKS_CI
      value: "{{tekton_domain}}/#/namespaces/$(context.pipelineRun.namespace)/pipelineruns/$(context.pipelineRun.name)?pipelineTask=code-analysis&step=sonar-scan"
    - name: SONAR_LINKS_SCM
      value: $(params.code-repo-url)
    - name: SONAR_LANGUAGE
      value: py
    - name: SONAR_INCLUSIONS
      value: "**/*.py"
    - name: SONAR_EXCLUSIONS
      value: "tests/**,build/**,dist/**,**/__pycache__/**"
    - name: SONAR_PROP_IMAGE
      value: "{{image_registry}}/nnd/tekton-cicd/bash:5.2.21"
    - name: SONAR_BRANCH_NAME
      value: $(params.code-revision)
    runAfter:
    - code-test
    taskRef:
      kind: Task
      params:
      - name: kind
        value: task
      - name: name
        value: sonarqube-scanner
      - name: namespace
        value: tekton-catalog
      resolver: cluster
    workspaces:
    - name: source
      workspace: shared-data
    - name: ssl-ca-directory
      workspace: ssl-ca-directory
    - name: sonar-credentials
      workspace: sonar-credentials
  - displayName: Code Artifact
    name: code-artifact
    when:
    - input: $(params.skip-code-artifact)
      operator: in
      values:
      - "false"
    params:
    - name: PYTHON_IMAGE
      value: "{{image_registry}}/nnd/baseimage/python:$(params.python-version)-slim"
    - name: CONTEXT_DIR
      value: $(params.working-pr-dir)/$(params.code-repo-name)
    - name: REQUIREMENTS_FILE
      value: $(params.requirements-file)
    - name: EXTRA_PACKAGES
      value: twine
    # 업로드 대상/계정은 넥서스 시크릿의 .pypirc([nexus] = pypi-hosted) 에 있다
    - name: PYTHON_COMMAND
      value: |
        twine upload --disable-progress-bar --config-file $(workspaces.pip-settings.path)/.pypirc -r nexus dist/*
    - name: ARTIFACT_FIND_PATTERN
      value: $(params.artifact-find-pattern)
    - name: ARTIFACT_RENAME
      value: $(params.artifact-rename)
    runAfter:
    - code-analysis
    taskRef:
      kind: Task
      params:
      - name: kind
        value: task
      - name: name
        value: python
      - name: namespace
        value: tekton-catalog
      resolver: cluster
    workspaces:
    - name: source
      workspace: shared-data
    - name: ssl-ca-directory
      workspace: ssl-ca-directory
    - name: pip-settings
      workspace: pip-settings
    - name: pip-local-cache
      workspace: pip-local-cache
  finally:
  - displayName: Build Trigger
    name: build-trigger
    when:
    - input: $(tasks.status)
      operator: in
      values:
      - Completed
      - Succeeded
    - input: $(params.skip-build-trigger)
      operator: in
      values:
      - "false"
    params:
    - name: ARGS
      value:
      - $(params.build-trigger-scripts)
    taskSpec:
      metadata: {}
      params:
      - name: ARGS
        type: array
      spec: null
      steps:
      - args:
        - $(params.ARGS)
        computeResources: {}
        image: "{{image_registry}}/nnd/tekton-cicd/curl:8.5.0"
        name: curl
        script: |
          for arg in "$@"
          do
            eval "$arg"
          done
  - displayName: Cleanup Policy
    name: cleanup-policy
    params:
    - name: SCRIPT
      value: |
        find $(workspaces.source.path) -mindepth 1 -maxdepth 1 -type d -name "$(params.working-pr-dir)" | xargs -r rm -rf

        tkn pipelinerun delete --force --keep 0 --all $1 -n $(context.pipelineRun.namespace)
        tkn pipelinerun list $1 -n $(context.pipelineRun.namespace)
    - name: ARGS
      value:
      - --label app=$(params.app-name),env=$(params.app-env),type=build,tekton.dev/pipeline!=$(params.app-name)-$(params.app-env)-build-pr
    taskSpec:
      metadata: {}
      params:
      - name: SCRIPT
        type: string
      - name: ARGS
        type: array
      spec: null
      steps:
      - args:
        - $(params.ARGS)
        computeResources: {}
        image: "{{image_registry}}/nnd/tekton-cicd/tkn:v0.12.0"
        name: tkn
        script: |
          if [ "$(workspaces.kubeconfig.bound)" = "true" ] && [ -e $(workspaces.kubeconfig.path)/kubeconfig ]; then
            export KUBECONFIG="$(workspaces.kubeconfig.path)"/kubeconfig
          fi
          eval "$(params.SCRIPT)"
      workspaces:
      - name: source
      - name: kubeconfig
    workspaces:
    - name: source
      workspace: shared-data
    - name: kubeconfig
      workspace: kubeconfig
  workspaces:
  - name: shared-data
  - name: gitconfig
  - name: ssl-ca-directory
  - name: pip-settings
  - name: pip-local-cache
  - name: sonar-credentials
  - name: kubeconfig
