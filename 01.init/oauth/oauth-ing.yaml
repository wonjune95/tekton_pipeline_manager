---
# gitea에 oauth애플리케이션 등록후 발행된 secret코드 (oauth2-proxy를 통해 gitea 인증 후 tekton 대시보드 접근 기능용)
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-proxy-gitea
  namespace: tekton-pipelines
  labels:
    app: oauth-all-in-one
type: Opaque
stringData:
  # [gitea] 사이트관리 > Admin Settings > Integrations
  # Application Name : tekton-dashboard-auth
  # Redirect URIs: {{tekton_domain}}/oauth2/callback
  client_id: {{oauth_client_id}}
  client_secret: {{oauth_client_secret}}
---
# oauth2-proxy 설정 정보 (oauth2-proxy를 통해 gitea 인증 후 tekton 대시보드 접근 기능용)
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-gitea
  namespace: tekton-pipelines
  labels:
    app: oauth-all-in-one
data:
  oauth2_proxy_gitea.cfg: |
    ## https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview
    ## traefik ForwardAuth 방식: upstreams 없이 인증 판정(/oauth2/auth)만 담당

    http_address="0.0.0.0:4180"
    cookie_secret="OQINaROshtE9TcZkNAm-5Zs2Pv3xaWytBmc5W7sPX7w=" # openssl rand -base64 32 | tr -- '+/' '-_'
    email_domains=["*"]
    cookie_secure=false # https(websecure 리스너) 사용 시 true로 변경
    cookie_name="_tekton_oauth2"
    reverse_proxy=true

    redirect_url="{{tekton_domain}}/oauth2/callback"

    ## OpenID Connect Provider
    ## https://docs.gitea.com/development/oauth2-provider
    ## 주의: Gitea(1.26.4 기준) discovery 문서의 issuer는 슬래시(/) 없이 내려옴 - 트레일링 슬래시 붙이면 issuer mismatch 에러 발생
    oidc_issuer_url="{{gitea_domain}}"

    provider="oidc"
    provider_display_name="Gitea OIDC"
    code_challenge_method="S256"
    set_xauthrequest=true
    ssl_insecure_skip_verify=true

    cookie_samesite="lax"
    cookie_expire="0"
    whitelist_domains=[".{{nnd_domain_name}}"] # 인증 후 원래 요청 주소로 리다이렉트 허용

    pass_user_headers=true
---
# oauth2-proxy 배포
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
  namespace: tekton-pipelines
  labels:
    app: oauth-all-in-one
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-all-in-one
  template:
    metadata:
      labels:
        app: oauth-all-in-one
    spec:
      containers:
      - image: {{image_registry}}/nnd/oauth2-proxy:v7.8.1
        name: oauth2-proxy
        args:
        - --config=/etc/oauth2_proxy/oauth2_proxy_gitea.cfg
        env:
        - name: OAUTH2_PROXY_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-gitea
              key: client_id
        - name: OAUTH2_PROXY_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: oauth2-proxy-gitea
              key: client_secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 4180
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/oauth2_proxy
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
{%- for node in node_selector_list %}
                - {{node}}
{%- endfor %}
      volumes:
      - name: config
        configMap:
          name: oauth2-proxy-gitea
          defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy
  namespace: tekton-pipelines
  labels:
    app: oauth-all-in-one
spec:
  ports:
  - name: http
    port: 4180
    protocol: TCP
    targetPort: 4180
  selector:
    app: oauth-all-in-one
---
# traefik ForwardAuth 미들웨어 (nginx auth-url 어노테이션 대체)
# 인증 성공 시 oauth2-proxy가 내려주는 X-Auth-Request-* 헤더를 백엔드로 전달
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tekton-oauth2-auth
  namespace: tekton-pipelines
spec:
  forwardAuth:
    address: http://oauth2-proxy.tekton-pipelines.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Preferred-Username
      - X-Auth-Request-Groups
---
# 미인증(401-403) 시 로그인 화면으로 유도 (nginx auth-signin 어노테이션 대체)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: tekton-oauth2-errors
  namespace: tekton-pipelines
spec:
  errors:
    status:
      - "401-403"
    service:
      name: oauth2-proxy
      port: 4180
    query: "/oauth2/sign_in"
---
# oauth2-proxy 경로 라우팅 (/oauth2/*)
# parentRefs는 traefik 설치 시 만든 Gateway 이름/네임스페이스와 일치해야 함
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-route
  namespace: tekton-pipelines
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - {{tekton_host_url}}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oauth2
      backendRefs:
        - name: oauth2-proxy
          port: 4180
---
# http -> https 강제 리다이렉트 미들웨어
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-to-https
  namespace: tekton-pipelines
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# tekton dashboard 라우팅 - oauth2 미들웨어 적용
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-route
  namespace: tekton-pipelines
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - {{tekton_host_url}}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: redirect-to-https
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: tekton-oauth2-errors
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: tekton-oauth2-auth
      backendRefs:
        - name: tekton-dashboard
          port: 9097
