rules:
- id: mois-2-06-hardcoded-secret-py
  languages: [python]
  severity: WARNING
  message: "[행안부 보안기능] 하드코드된 중요정보: 비밀번호·키·토큰으로 보이는 값이 소스에 직접 적혀 있음 — 환경변수(os.environ)·비밀 저장소(Vault, K8s Secret)·암호화된 설정 파일에서 읽을 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "보안기능"
    mois-item-no: "2-6"
    mois-item: "하드코드된 중요정보"
    cwe: "CWE-259"
    gate: warn
  # ponytail: 이름 규칙 기반. 이름이 비밀번호·키·토큰 낱말로 "끝나는" 변수·키·인자에 4자 이상 문자열 상수가 들어갈 때만 잡는다.
  #           값이 필드 이름 그 자체("password")·자리표시자(<..>, ${..}, {..}, %s)·헤더 이름이거나 공백·한글이 섞인 문장(안내 문구)이면 제외. 이름이 다르면 미탐
  pattern-either:
    # 이름이 비밀 낱말로 끝나는 변수·속성·dict 키·키워드 인자·환경변수에 문자열 상수 (이름 목록은 한 번만 적는다)
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    # 변수·속성 대입: DB_PASSWORD = "...", db_password: str = "...", self.api_key = "..."
                    - pattern: $NAME = "$VAL"
                    - pattern: $O.$NAME = "$VAL"
                    # dict 항목: DATABASES 의 "PASSWORD": "...", {"api_key": "..."}
                    - patterns:
                        - pattern: |
                            {..., "$NAME": "$VAL", ...}
                        - focus-metavariable: $VAL
                    # 키워드 인자: connect(password="..."), Redis(password="..."), Client(api_key="...")
                    - patterns:
                        - pattern: $F(..., $NAME="$VAL", ...)
                        - focus-metavariable: $VAL
                # 값이 필드·헤더·쿠키 이름 그 자체면 비밀 값이 아니다. 4자 미만은 어차피 대상이 아니므로 "pwd" 는 적지 않는다
                - metavariable-regex:
                    metavariable: $VAL
                    regex: (?i)^(?!(password|passwd|secret|token|api_?key|access_?key|secret_?key|bearer|basic|authorization|csrftoken|csrfmiddlewaretoken|sessionid|access_token|refresh_token|x-[\w-]+)$)(?![<{$%])(-----BEGIN[\s\S]+|[\x21-\x7e]{4,})$
            # 환경변수가 없을 때 쓰는 기본값으로 박아 둔 비밀번호: os.environ.get("DB_PASSWORD", "...")
            - patterns:
                - pattern-either:
                    - pattern: os.environ.get("$NAME", "$VAL")
                    - pattern: os.getenv("$NAME", "$VAL")
                - metavariable-regex:
                    metavariable: $VAL
                    regex: ^.{4,}$
                - focus-metavariable: $VAL
        # passw(or)?d 는 password·passwd 둘 다
        - metavariable-regex:
            metavariable: $NAME
            regex: (?i)^\w*(passw(or)?d|pwd|secret|secret_?key|api_?key|access_?key|private_?key|token)$
    # 비밀번호를 상수와 비교 (진단가이드: 하드코드된 비밀번호 비교)
    - patterns:
        - pattern-either:
            - pattern: $X == "$VAL"
            - pattern: |
                "$VAL" == $X
            - pattern: $X != "$VAL"
        # 이름이 비밀번호 낱말로 끝나는 식: password, user.password, data["pwd"], form.get("password")
        - metavariable-regex:
            metavariable: $X
            regex: (?i)^.*(passw(or)?d|pwd)\W{0,3}$
        # 참/거짓·빈 값·입력 종류·필드 이름 같은 표시 값과의 비교는 제외 (show_password == "true", toggle_password == "text"). 4자 미만은 어차피 대상이 아니다
        - metavariable-regex:
            metavariable: $VAL
            regex: (?i)^(?!(true|false|none|null|text|hidden|password|passwd)$).{4,}$
    # JWT 서명 키를 상수로
    - pattern: jwt.encode($P, "$VAL", ...)
    - pattern: jwt.decode($T, "$VAL", ...)
    # 접속 문자열 안의 계정·비밀번호: "postgresql://app:pw@db/app"
    - patterns:
        - pattern: |
            "$URL"
        - metavariable-regex:
            metavariable: $URL
            regex: ^[A-Za-z][A-Za-z0-9+.\-]*://[^:/@\s]+:[^@/\s{}<>$%]{3,}@.*$
