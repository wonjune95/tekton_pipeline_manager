rules:
- id: mois-2-06-hardcoded-secret
  languages: [java]
  severity: WARNING
  message: "[행안부 보안기능] 하드코드된 중요정보: 비밀번호·키로 보이는 값이 소스에 직접 적혀 있음"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "보안기능"
    mois-item-no: "2-6"
    mois-item: "하드코드된 중요정보"
    cwe: "CWE-259"
    gate: warn
  pattern-either:
    - patterns:
      # (필드·지역변수 선언과 대입 모두에 맞는다)
      - pattern: $NAME = "$VAL";
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(passw(or)?d|pwd|secret|api_?key|access_?key|private_?key|token).*
      # 값이 파라미터 이름 같은 단어 그 자체면 비밀번호가 아니다 (예: PASSWORD_FIELD = "password").
      # 4자 미만은 어차피 대상이 아니므로 "pwd" 는 적지 않는다
      - metavariable-regex:
          metavariable: $VAL
          regex: (?i)^(?!(password|passwd|secret|token|api_?key|access_?key)$).{4,}$
    - pattern: java.sql.DriverManager.getConnection($URL, $USER, "$PW")
