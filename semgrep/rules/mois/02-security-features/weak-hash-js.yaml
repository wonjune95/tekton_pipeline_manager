rules:
- id: mois-2-04-weak-hash-js
  languages: [javascript, typescript]
  severity: WARNING
  message: "[행안부 보안기능] 취약한 암호화 알고리즘 사용: MD5·SHA-1 해시 — SHA-256 이상(crypto.createHash('sha256') 등)을 사용할 것 (체크섬·캐시 키처럼 보안 용도가 아니면 예외 처리)"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "보안기능"
    mois-item-no: "2-4"
    mois-item: "취약한 암호화 알고리즘 사용"
    cwe: "CWE-327"
    gate: warn
  # 해시 이름이 문자열 상수(같은 파일의 const 포함)일 때만 본다. 보안 용도인지는 알 수 없어 warn
  pattern-either:
    # Node crypto: createHash('md5'), createHmac('sha1', key), crypto.hash('sha1', data) (Node 21+),
    # WebCrypto: crypto.subtle.digest('SHA-1', data)
    - patterns:
        - pattern-either:
            - pattern: $C.createHash("$H", ...)
            - pattern: $C.createHmac("$H", ...)
            - pattern: crypto.hash("$H", ...)
            - pattern: $C.subtle.digest("$H", ...)
        - metavariable-regex:
            metavariable: $H
            regex: (?i)^(md2|md4|md5|sha-?1|sha|rsa-md5|rsa-sha1)$
    # CryptoJS
    - pattern: $CJ.MD5(...)
    - pattern: $CJ.SHA1(...)
    - pattern: $CJ.HmacMD5(...)
    - pattern: $CJ.HmacSHA1(...)
    # node-forge
    - pattern: $F.md.md5.create(...)
    - pattern: $F.md.sha1.create(...)
