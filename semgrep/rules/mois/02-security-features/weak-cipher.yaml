rules:
- id: mois-2-04-weak-cipher
  languages: [java]
  severity: ERROR
  message: "[행안부 보안기능] 취약한 암호화 알고리즘 사용: DES·RC4 등 취약한 알고리즘 또는 ECB 모드 (AES 만 지정하면 기본이 ECB)"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "보안기능"
    mois-item-no: "2-4"
    mois-item: "취약한 암호화 알고리즘 사용"
    cwe: "CWE-327"
    gate: block
  patterns:
    - pattern-either:
        - pattern: javax.crypto.Cipher.getInstance("$ALG", ...)
        # 알고리즘을 설정에서 읽되, 설정이 없을 때 쓰는 기본값이 취약한 경우
        - patterns:
            # (선언 `String alg = ...` 과 대입 `alg = ...` 모두에 맞는다)
            - pattern-inside: |
                $V = $P.getProperty($K, "$ALG");
                ...
            - pattern: javax.crypto.Cipher.getInstance($V, ...)
    # RSA/ECB/... 는 이름만 ECB 이고 블록 모드 문제가 아니므로 제외
    - metavariable-regex:
        metavariable: $ALG
        regex: (?i)^((DES|DESede|TripleDES|3DES|RC2|RC4|ARCFOUR|Blowfish)(/.*)?|AES|(?!RSA/)[^/]+/ECB/.*)$
