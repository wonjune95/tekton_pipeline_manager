rules:
- id: mois-2-13-sensitive-comment-py
  languages: [python]
  severity: WARNING
  message: "[행안부 보안기능] 주석문 안에 포함된 시스템 주요정보: 주석에 계정·비밀번호로 보이는 값이 있음 — 실제 값이면 주석에서 지우고(이력에 남았다면 비밀번호도 변경), 접속 정보는 비밀 저장소·운영 문서로 옮길 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "보안기능"
    mois-item-no: "2-13"
    mois-item: "주석문 안에 포함된 시스템 주요정보"
    cwe: "CWE-615"
    gate: warn
  # '#' 주석에서만 찾는다 (줄 머리이거나 앞이 공백인 #). docstring 은 보지 않는다
  # ponytail: 정규식 휴리스틱. 값에 숫자·특수문자가 있거나 따옴표로 감싼 경우만 잡는다.
  #           주석 처리한 코드(값에 괄호·대괄호가 있는 호출·첨자)와 파일 경로(user/app1.py)는 제외
  #           `(?!\S)` 는 "뒤가 공백이거나 줄·파일의 끝" 이라는 뜻이다
  pattern-either:
    # "비밀번호 : a1b2c3!", "암호화 전, 후 : 1365ADMIN_01"
    - pattern-regex: (?im)(?:^|[ \t])#[^\n]*?(password|passwd|pwd|비밀번호|패스워드|암호)[^\n]{0,30}?(\bis\b|=|:|은|는)[ \t]*["'“‘]?(?![$%{<])(?![*xX.]+(?!\S))(?![^\s"'”’]*[(\[])(?=[^\s"'”’]*[0-9!@#$%^&*])[^\s"'”’]{4,}
    # Password for administrator is "tiger."
    - pattern-regex: (?im)(?:^|[ \t])#[^\n]*?(password|passwd|pwd|비밀번호|패스워드|암호)[^\n]{0,30}?(\bis\b|=|:|은|는)[ \t]*["“'‘](?!(password|passwd|pwd)["”'’])[^"”'’\s(\[{<$%]{3,}["”'’]
    # DB연결 root / a1q2w3r3f2!@  (계정 / 비밀번호, 빗금 양쪽에 공백)
    - pattern-regex: (?im)(?:^|[ \t])#[^\n]*\b(root|admin|administrator|sa|sys|system|scott|test|user)[ \t]+/[ \t]+[^\s/]*[0-9!@#$%^&*][^\s/]*
    # admin/Passw0rd!  (공백 없는 계정/비밀번호. 경로와 헷갈리지 않게 관리자 계정 이름만, 값에 점·빗금 없음)
    - pattern-regex: (?im)(?:^|[ \t])#[^\n]*(?<![\w/.\-])(root|admin|administrator|sa|scott)/(?=[^\s/.]*[0-9!@#$%^&*])[^\s/.]{4,}(?!\S)
