rules:
- id: mois-2-06-hardcoded-secret-js
  languages: [javascript, typescript]
  severity: WARNING
  message: "[행안부 보안기능] 하드코드된 중요정보: 비밀번호·키·토큰으로 보이는 값이 소스에 직접 적혀 있음 — 환경변수(process.env)·비밀 저장소(Vault, K8s Secret)·암호화된 설정 파일에서 읽고, 없으면 기본값 없이 실패시킬 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "보안기능"
    mois-item-no: "2-6"
    mois-item: "하드코드된 중요정보"
    cwe: "CWE-259"
    gate: warn
  # 참고: semgrep-rules javascript/jsonwebtoken/security/jwt-hardcode.yaml, javascript/lang/security/audit/hardcoded-hmac-key.yaml
  # ponytail: 이름 규칙 기반. 이름이 비밀번호·키·토큰 낱말로 "끝나는" 변수·속성·객체 키에 4자 이상 문자열 상수가 들어갈 때만 잡는다.
  #           값이 필드·저장소 키 이름 그 자체("password", "accessToken")·자리표시자(<..>, ${..}, {..}, %s)·헤더 이름이거나
  #           공백·한글이 섞인 문장(안내 문구)이면 제외. 이름이 다르면 미탐
  pattern-either:
    # 이름이 비밀 낱말로 끝나는 변수·속성·객체 키에 문자열 상수, 또는 환경변수가 없을 때의 기본값 (이름 목록은 한 번만 적는다)
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    # 변수·필드 대입: const DB_PASSWORD = "...", private apiKey = "...", this.secret = "..."
                    - pattern: $NAME = "$VAL"
                    - pattern: $O.$NAME = "$VAL"
                    # 객체 항목: { password: "..." }, { "api_key": "..." } (DB 접속 설정, express-session secret 등)
                    - patterns:
                        - pattern: |
                            {..., $NAME: "$VAL", ...}
                        - focus-metavariable: $VAL
                # 값이 필드·헤더·저장소 키 이름 그 자체면 비밀 값이 아니다 (localStorage.getItem(ACCESS_TOKEN) 의 'accessToken' 등)
                - metavariable-regex:
                    metavariable: $VAL
                    regex: (?i)^(?!((access|refresh|auth|id|jwt|api|csrf|xsrf|session|client|user|app|private|public)?[_-]?(password|passwd|pwd|secret|token|key|secret_?key|access_?key)|bearer|basic|authorization|csrfmiddlewaretoken|sessionid|x-[\w-]+)$)(?![<{$%])(-----BEGIN[\s\S]+|[\x21-\x7e]{4,})$
            # 환경변수가 없을 때 쓰는 기본값으로 박아 둔 비밀: process.env.JWT_SECRET || 'superSecret'
            - patterns:
                - pattern-either:
                    - pattern: process.env.$NAME || "$VAL"
                    - pattern: process.env.$NAME ?? "$VAL"
                    - pattern: process.env["$NAME"] || "$VAL"
                    - pattern: process.env["$NAME"] ?? "$VAL"
                - metavariable-regex:
                    metavariable: $VAL
                    regex: ^.{4,}$
                - focus-metavariable: $VAL
        # passw(or)?d 는 password·passwd 둘 다. 대소문자 무시라 apiKey·clientSecret·JWT_SECRET 에도 맞는다
        - metavariable-regex:
            metavariable: $NAME
            regex: (?i)^\w*(passw(or)?d|pwd|secret|secret_?key|api_?key|access_?key|private_?key|token)$
    # 비밀번호를 상수와 비교 (진단가이드: 하드코드된 비밀번호 비교)
    - patterns:
        - pattern-either:
            - pattern: $X === "$VAL"
            - pattern: $X == "$VAL"
            - pattern: |
                "$VAL" === $X
            - pattern: $X !== "$VAL"
            - pattern: $X != "$VAL"
        # 이름이 비밀번호 낱말로 끝나는 식: password, user.password, req.body.pwd, body["password"]
        - metavariable-regex:
            metavariable: $X
            regex: (?i)^.*(passw(or)?d|pwd)\W{0,3}$
        # 참/거짓·빈 값·입력 종류·필드 이름 같은 표시 값과의 비교는 제외 (input.type === "password"). 4자 미만은 어차피 대상이 아니다
        - metavariable-regex:
            metavariable: $VAL
            regex: (?i)^(?!(true|false|none|null|undefined|text|hidden|password|passwd)$).{4,}$
    # 서명·암호 키를 상수로: jwt.sign(payload, 'secret'), crypto.createHmac('sha256', 'key'), createCipheriv(alg, 'key', iv)
    - patterns:
        - pattern-either:
            - pattern: jwt.sign($P, "$VAL", ...)
            - pattern: jwt.verify($T, "$VAL", ...)
            - pattern: jsonwebtoken.sign($P, "$VAL", ...)
            - pattern: jsonwebtoken.verify($T, "$VAL", ...)
            - pattern: $C.createHmac($ALG, "$VAL", ...)
            - pattern: $C.createCipheriv($ALG, "$VAL", ...)
            - pattern: $C.createDecipheriv($ALG, "$VAL", ...)
            - pattern: $CJ.AES.encrypt($D, "$VAL", ...)
            - pattern: $CJ.AES.decrypt($D, "$VAL", ...)
            - pattern: $CJ.HmacSHA256($D, "$VAL")
        - metavariable-regex:
            metavariable: $VAL
            regex: ^.{4,}$
        - focus-metavariable: $VAL
    # 접속 문자열 안의 계정·비밀번호: "mongodb://app:pw@db/app", "postgres://user:pass@host/db"
    - patterns:
        - pattern: |
            "$URL"
        - metavariable-regex:
            metavariable: $URL
            regex: ^[A-Za-z][A-Za-z0-9+.\-]*://[^:/@\s]+:[^@/\s{}<>$%]{3,}@.*$
