rules:
- id: mois-3-01-toctou
  languages: [java]
  severity: WARNING
  message: "[행안부 시간 및 상태] 경쟁조건: 검사 시점과 사용 시점(TOCTOU): 파일 상태를 검사한 뒤 동기화 없이 같은 파일을 사용함 — 여러 스레드·프로세스가 접근하면 synchronized 등으로 검사와 사용을 묶을 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "시간 및 상태"
    mois-item-no: "3-1"
    mois-item: "경쟁조건: 검사 시점과 사용 시점(TOCTOU)"
    cwe: "CWE-367"
    gate: warn
  patterns:
    - pattern-either:
        # java.io.File: exists()/canRead() 등으로 검사한 뒤 같은 파일을 열거나 지움
        - patterns:
            - pattern-inside:
                patterns:
                  - pattern: if (<... (java.io.File $F).$CHECK() ...>) $BODY;
                  - metavariable-regex:
                      metavariable: $CHECK
                      regex: ^(exists|canRead|canWrite|isFile)$
                  # 검사(if)부터 같은 잠금 안에 있으면 안전 (진단가이드 안전한 코드). 사용만 잠금 안에 있으면 제외하지 않는다
                  - pattern-not-inside: |
                      synchronized ($LOCK) { ... }
                  - pattern-not-inside: |
                      synchronized $RET $M(...) { ... }
            - pattern-either:
                - patterns:
                    - pattern: new $STREAM(<... $F ...>, ...)
                    - metavariable-regex:
                        metavariable: $STREAM
                        regex: ^(java\.io\.)?(FileInputStream|FileOutputStream|FileReader|FileWriter|RandomAccessFile)$
                - patterns:
                    - pattern: $F.$USE(...)
                    - metavariable-regex:
                        metavariable: $USE
                        regex: ^(delete|renameTo|createNewFile)$
        # java.nio.file.Files: exists() 등으로 검사한 뒤 같은 경로를 사용
        - patterns:
            - pattern-inside:
                patterns:
                  - pattern: if (<... java.nio.file.Files.$CHECK($P, ...) ...>) $BODY;
                  - metavariable-regex:
                      metavariable: $CHECK
                      regex: ^(exists|notExists|isReadable|isWritable|isRegularFile)$
                  - pattern-not-inside: |
                      synchronized ($LOCK) { ... }
                  - pattern-not-inside: |
                      synchronized $RET $M(...) { ... }
            - pattern: java.nio.file.Files.$USE($P, ...)
            - metavariable-regex:
                metavariable: $USE
                regex: ^(delete|deleteIfExists|move|copy|newInputStream|newOutputStream|newBufferedReader|newBufferedWriter|readAllBytes|readAllLines|write|createFile)$
