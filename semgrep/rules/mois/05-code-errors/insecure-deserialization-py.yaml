rules:
- id: mois-5-05-insecure-deserialization-py
  mode: taint
  languages: [python]
  severity: ERROR
  message: "[행안부 코드오류] 신뢰할 수 없는 데이터의 역직렬화: 외부 입력(요청 본문·파라미터·업로드 파일)을 pickle·marshal·yaml.load 등으로 검증 없이 역직렬화함 — 임의 코드가 실행될 수 있으니 json·yaml.safe_load 같은 안전한 형식을 쓰거나 서명(HMAC)으로 무결성을 확인한 데이터만 역직렬화할 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "코드오류"
    mois-item-no: "5-5"
    mois-item: "신뢰할 수 없는 데이터의 역직렬화"
    cwe: "CWE-502"
    gate: block
  options:
    go_deeper_stmt: false
  pattern-sources:
    # (A) 요청 객체의 값. 이름이 request·req 인 객체, flask.request(별칭 import 포함), 타입이 Request·WebSocket 으로 적힌 매개변수
    - patterns:
        - pattern-either:
            - patterns:
                - pattern: $REQ.$ATTR
                - metavariable-regex:
                    metavariable: $REQ
                    regex: ^(request|req|self\.request)$
            - pattern: flask.request.$ATTR
            - patterns:
                - pattern-inside: |
                    def $F(..., $REQ: $RT, ...):
                      ...
                - metavariable-regex:
                    metavariable: $RT
                    regex: ^(\w+\.)*(Request|HttpRequest|WebSocket|HTTPConnection)$
                - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|json|files|view_args|get_json|get_data|query_string|stream|url|path|full_path|get_full_path|read|readline|readlines|referrer|environ|user_agent|authorization|content_type|mimetype|resolver_match|receive_text|receive_json|receive_bytes|receive|iter_text|iter_json|iter_bytes)$
    # Django 클래스 뷰의 URL 인자
    - pattern: self.kwargs
    # (B) 라우트 함수 매개변수 — 타입 표기 없음. 의존성(= Depends(...)·Security(...))만 제외한다
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - pattern-not-inside: |
          def $F(..., $P: $T, ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Security(...), ...):
            ...
      - focus-metavariable: $P
    # (B) 라우트 함수 매개변수 — 타입 표기 있음. 문자열을 실을 수 없는 타입(끝까지 일치), 프레임워크 타입, 의존성만 제외한다.
    #     의존성은 Depends·Security 가 보이거나, FastAPI 문서의 별칭 이름(…Dep·Current…User)이거나, 같은 파일에서 별칭으로 정의한 타입일 때만 인정한다.
    #     타입 이름이 …Config·…Client·…Settings 라는 것만으로는 제외하지 않는다 (요청 본문 모델일 수 있다)
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)(?!((\w+\.)*(Request|HttpRequest|Response|WebSocket|BackgroundTasks|Session|AsyncSession|HTTPConnection|SecurityScopes))$)(?!\w*(Dep|Deps|Dependency)$)(?!Current\w*(User|Account|Member|Principal|Admin)\w*$)(?!Annotated\[.*\b(Depends|Security)\()'
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Security(...), ...):
            ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Depends(...)]
          ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Security(...)]
          ...
      - focus-metavariable: $P
    # 의존성으로 주입돼도 요청 값인 것: 문자열·바이트(토큰·헤더 값)와 fastapi.security 의 폼·자격증명 객체
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(Annotated\[\s*)?(str|bytes|OAuth2PasswordRequestForm|OAuth2PasswordRequestFormStrict|HTTPBasicCredentials|HTTPAuthorizationCredentials)\s*(\|\s*None\s*)?(,.*\])?$'
      - focus-metavariable: $P
    # 인자 없는 Depends(): 그 타입을 요청 값으로 만들어 넣는다 (쿼리·폼 모델). 서비스·저장소로 보이는 이름만 제외
    - patterns:
        - pattern-either:
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: $T = fastapi.Depends(), ...):
                  ...
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: typing.Annotated[$T, fastapi.Depends()], ...):
                  ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
        - metavariable-regex:
            metavariable: $T
            regex: '^(?!(Annotated\[\s*)?(\w+\.)*\w*(Service|Repository|Repo|Client|Manager|Session|UseCase|Handler|Factory|Provider|Settings|Config)\s*(,.*\])?$)'
        - focus-metavariable: $P
    # Flask 는 함수의 타입 표기를 검사하지 않는다: 경로에 변환기 없는 자리(<name>, <string:…>, <path:…>)가 있으면 숫자 표기여도 문자열이다
    - patterns:
        - pattern-inside: |
            @$APP.$METHOD("$PATH", ...)
            def $F(..., $P: $T, ...):
              ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|route)$
        - metavariable-regex:
            metavariable: $PATH
            regex: .*<((string|path|any)[^:>]*:)?\w+>
        - metavariable-regex:
            metavariable: $T
            regex: '^((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$'
        - focus-metavariable: $P
    # 요청 값이라고 선언한 매개변수는 라우트 함수가 아니어도(의존성 함수) 입력이다: x: str = Header(), x = Query(None), Annotated[str, Form()]
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    # 타입 표기가 없는 것만 (def f(x=Query())). 표기가 있으면 아래 가지가 숫자형을 거른다
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P=$Q(...), ...):
                              ...
                        - pattern-not-inside: |
                            def $F(..., $P: $T2 = $Q(...), ...):
                              ...
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P: $T = $Q(...), ...):
                              ...
                        - metavariable-regex:
                            metavariable: $T
                            regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)'
                - metavariable-regex:
                    metavariable: $Q
                    regex: ^(fastapi\.)?(Query|Header|Cookie|Form|Body|File|Path)$
            - patterns:
                - pattern-inside: |
                    def $F(..., $P: $T, ...):
                      ...
                - metavariable-regex:
                    metavariable: $T
                    regex: '^Annotated\[\s*(?!(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\b)[^,]*,.*\b(Query|Header|Cookie|Form|Body|File|Path)\('
        - focus-metavariable: $P
    # Django 뷰의 URL 인자: 첫 매개변수가 request 인 함수·메서드의 나머지 매개변수 (URLconf 의 <str:…>·<path:…>·정규식 그룹).
    # 변환기는 urls.py 에 있어 볼 수 없으므로 숫자 타입 표기가 있는 것만 제외한다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                def $F(request, ..., $P, ...):
                  ...
            - pattern-inside: |
                def $F(self, request, ..., $P, ...):
                  ...
        - pattern-not-inside: |
            def $F(..., $P: $T, ...):
              ...
        - pattern-not-inside: |
            def $F(..., *$P, ...):
              ...
        - pattern-not-inside: |
            def $F(..., **$P, ...):
              ...
        - focus-metavariable: $P
  pattern-sanitizers:
    # (공통 1) 모듈 수준에서 문자열·숫자 값만 든 리터럴로 정의한 dict 에서 꺼낸 값은 외부 입력이 아니다: TABLE[key], TABLE.get(key)
    #          인정하지 않는 것: 값에 변수·호출이 든 dict, 함수 안에서 만든 dict, 다른 모듈의 dict, get(key, 입력),
    #          쓰는 함수 안에서 바뀌는 dict (TABLE[k] = v, TABLE.update(...), TABLE.setdefault(...), TABLE |= ..., TABLE = ...)
    - patterns:
        - pattern-either:
            - pattern: $ALLOW[$K]
            - pattern: $ALLOW.get($K)
            - pattern: $ALLOW.get($K, None)
            - pattern: $ALLOW.get($K, "...")
        - pattern-inside: |
            $ALLOW = $LIT
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^\{\s*(?:(?:"[^"\n]*"|''[^''\n]*'')\s*:\s*(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)+\}$'
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW = $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW |= $V2
                ...
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  def $FM(...):
                      ...
                      $ALLOW.$MUT(...)
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(update|setdefault)$
    # (공통 4) Django ORM 조회 결과는 요청 값이 아니라 DB 에 저장된 값이다: Model.objects.get(pk=입력), get_object_or_404(Model, pk=입력)
    #          exact — 조회 호출(또는 그 결과를 받는 대입문)만 깨끗하게 본다. 대입문 안에 SQL 원문을 받는 raw()·extra()·RawSQL 이 있으면
    #          인정하지 않는다 (그 안의 SQL 삽입은 SQL 규칙이 잡아야 한다)
    - patterns:
        - pattern-either:
            - pattern: $M.objects.$Q(...)
            - pattern: django.shortcuts.get_object_or_404(...)
            - pattern: django.shortcuts.get_list_or_404(...)
            # 변수에 받는 문장 (exact 식 패턴만으로는 대입한 변수가 깨끗해지지 않는다)
            - pattern: $V = $M.objects.$Q(...)
            - pattern: $V = django.shortcuts.get_object_or_404(...)
            - pattern: $V = django.shortcuts.get_list_or_404(...)
        - pattern-not: $V = <... $QS.raw(...) ...>
        - pattern-not: $V = <... $QS.extra(...) ...>
        - pattern-not: $V = <... django.db.models.expressions.RawSQL(...) ...>
      exact: true
    # (공통 2) 허용 목록 guard — 목록에 없으면 빠져나가거나(return·raise·continue·flask.abort·sys.exit) 고정된 기본값으로 바꾼다.
    #          허용 목록은 "문자열·숫자만 든 리터럴"이어야 한다: 모듈 수준에서 이름을 붙인 것(ALLOWED = {"a", "b"}, frozenset({...}), set([...]))
    #          또는 조건에 바로 적은 것((...), [...], {...}). 함수 안에서 만든 목록, 쓰는 함수 안에서 바뀌는 목록(append·add·+= …)은 인정하지 않는다.
    #          조건 원문은 "x not in 목록" 또는 "… or x not in 목록 or …" 만 인정한다 (and·괄호·비교로 감싸면 불인정).
    #          if 문 "뒤"의 값만 인정한다 (docs/rule-conventions.md 1절). 결과를 버림 · 실패해도 진행 · 실패 분기 안 사용 ·
    #          안쪽 조건부 return · 검사 뒤 재대입(=, +=, 튜플 풀기 — $X = $V 가 튜플 풀기에도 맞는다 —, 한 단계 안쪽 블록 포함) · else 가 붙은 검사 · 식 안의 조건부 종료는 탐지된다.
    #          종료 함수는 import 로 확인되는 flask.abort · sys.exit 만 본다 (이름만 abort 인 함수는 끝내지 않을 수 있다)
    #          (조건 판정을 metavariable-pattern 안의 정규식으로 하지 않는다 — 실제 코드에서 Semgrep 내부 오류가 난다)
    #   (2-가) 이름 붙은 목록: if x not in ALLOWED: return   /   if x not in ALLOWED: x = "기본값"
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    return ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    raise ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    continue
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    flask.abort(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    sys.exit(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = "..."
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = None
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: $X not in $ALLOW
                  - pattern: not $X in $ALLOW
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?\s+or\s+)*(?:[\w.]+\s+not\s+in\s+[\w.]+|not\s+[\w.]+\s+in\s+[\w.]+)(?:\s+or\s+(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?)*$'
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        # 검사 뒤 한 단계 안쪽 블록(if·else·for·while·with·try·except)에서 다시 대입해도 제외
        - pattern-not-inside:
            pattern-either:
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                  else:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                  else:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  for $I2 in $IT2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  for $I2 in $IT2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  while $C2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  while $C2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  with $W2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  with $W2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                      $X = $V
                      ...
                  except ...:
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                      $X += $V
                      ...
                  except ...:
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                  except ...:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                  except ...:
                      ...
                      $X += $V
                      ...
                  ...
        # else 가 붙은 검사는 인정하지 않는다 (else 쪽에서 값을 바꿀 수 있다)
        - pattern-not-inside: |
            if $COND:
                ...
            else:
                ...
            ...
        # 식 안에서 조건부로만 끝내는 경우(strict and flask.abort(400))는 끝내는 것이 아니다
        - pattern-not-inside: |
            if $COND:
                ...
                $P and $Q
            ...
        - pattern-not-inside: |
            if $COND:
                ...
                $P or $Q
            ...
        - pattern-inside: |
            $ALLOW = $LIT
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^(?:(?:frozenset|set)\(\s*)?[\[{(]\s*(?:(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)*[\]})]\s*\)?$'
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW = $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW += $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW |= $V2
                ...
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  def $FM(...):
                      ...
                      $ALLOW.$MUT(...)
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(update|append|add|extend|insert)$
        - pattern: $X
    #   (2-나) 조건에 바로 적은 목록: if x not in ("png", "jpg"): return   /   ... : x = "png"
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    return ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    raise ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    continue
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    flask.abort(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    sys.exit(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = "..."
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = None
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: $X not in $ALLOW
                  - pattern: not $X in $ALLOW
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?\s+or\s+)*(?:[\w.]+\s+not\s+in\s+[\[{(]\s*(?:(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)*[\]})]|not\s+[\w.]+\s+in\s+[\[{(]\s*(?:(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)*[\]})])(?:\s+or\s+(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?)*$'
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        # 검사 뒤 한 단계 안쪽 블록(if·else·for·while·with·try·except)에서 다시 대입해도 제외
        - pattern-not-inside:
            pattern-either:
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                  else:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                  else:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  for $I2 in $IT2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  for $I2 in $IT2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  while $C2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  while $C2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  with $W2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  with $W2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                      $X = $V
                      ...
                  except ...:
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                      $X += $V
                      ...
                  except ...:
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                  except ...:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                  except ...:
                      ...
                      $X += $V
                      ...
                  ...
        # else 가 붙은 검사는 인정하지 않는다 (else 쪽에서 값을 바꿀 수 있다)
        - pattern-not-inside: |
            if $COND:
                ...
            else:
                ...
            ...
        # 식 안에서 조건부로만 끝내는 경우(strict and flask.abort(400))는 끝내는 것이 아니다
        - pattern-not-inside: |
            if $COND:
                ...
                $P and $Q
            ...
        - pattern-not-inside: |
            if $COND:
                ...
                $P or $Q
            ...
        - pattern: $X
    # (공통 3) 허용 목록 조건 안에서만 쓰는 경우: if x in ALLOWED: 사용(x)
    #          조건 원문은 "x in 목록" 또는 "… and x in 목록 and …" 만 인정한다 (or·not·괄호·비교로 감싸면 불인정).
    #          else 가 있거나 조건 안에서 다시 대입하면 인정하지 않는다. 목록 조건은 (공통 2) 와 같다
    - patterns:
        - pattern-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $C:
                ...
            else:
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X = $V
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X += $V
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: $X in $ALLOW
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?\s+and\s+)*[\w.]+\s+in\s+[\w.]+(?:\s+and\s+(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?)*$'
        - pattern-inside: |
            $ALLOW = $LIT
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^(?:(?:frozenset|set)\(\s*)?[\[{(]\s*(?:(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)*[\]})]\s*\)?$'
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW = $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW += $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW |= $V2
                ...
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  def $FM(...):
                      ...
                      $ALLOW.$MUT(...)
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(update|append|add|extend|insert)$
        - pattern: $X
    - patterns:
        - pattern-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $C:
                ...
            else:
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X = $V
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X += $V
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: $X in $ALLOW
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?\s+and\s+)*[\w.]+\s+in\s+[\[{(]\s*(?:(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)*[\]})](?:\s+and\s+(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?)*$'
        - pattern: $X
  pattern-sinks:
    # pickle 계열·marshal: 역직렬화 중 임의 코드 실행
    - patterns:
        - pattern-either:
            - pattern: pickle.$FN($DATA, ...)
            - pattern: cPickle.$FN($DATA, ...)
            - pattern: _pickle.$FN($DATA, ...)
            - pattern: dill.$FN($DATA, ...)
            - pattern: cloudpickle.$FN($DATA, ...)
            - pattern: marshal.$FN($DATA, ...)
        - metavariable-regex:
            metavariable: $FN
            regex: ^(loads|load)$
        - focus-metavariable: $DATA
    - patterns:
        - pattern-either:
            - pattern: pickle.Unpickler($DATA, ...)
            - pattern: jsonpickle.decode($DATA, ...)
            - pattern: jsonpickle.loads($DATA, ...)
            - pattern: shelve.open($DATA, ...)
            - pattern: pandas.read_pickle($DATA, ...)
            - pattern: joblib.load($DATA, ...)
            # 같은 호출을 키워드 인자로 쓴 형태 (pickle.load(file=f) 등). 이름으로 줄 수 있는 인자만 적는다:
            # pickle.loads · marshal.load(s) · cPickle 은 위치 인자만 받는다
            - pattern: pickle.load(..., file=$DATA, ...)
            - pattern: _pickle.load(..., file=$DATA, ...)
            - pattern: cloudpickle.load(..., file=$DATA, ...)
            - pattern: dill.load(..., file=$DATA, ...)
            - pattern: dill.loads(..., str=$DATA, ...)
            - pattern: pickle.Unpickler(..., file=$DATA, ...)
            - pattern: jsonpickle.decode(..., string=$DATA, ...)
            - pattern: jsonpickle.loads(..., string=$DATA, ...)
            - pattern: shelve.open(..., filename=$DATA, ...)
            - pattern: pandas.read_pickle(..., filepath_or_buffer=$DATA, ...)
            - pattern: joblib.load(..., filename=$DATA, ...)
        - focus-metavariable: $DATA
    # yaml: 객체를 만드는 load 계열은 모두 sink 이고, Loader 가 SafeLoader·BaseLoader 계열로 "확인되는" 호출만 뺀다.
    # 위험한 Loader 이름을 나열하면 상속 클래스(MyLoader)·import 별칭·yaml.loader.UnsafeLoader·변수·getattr·조건식이 모두 빠진다.
    # Loader 를 주지 않은 호출도 남는다 (PyYAML 5.1 미만은 임의 객체 생성)
    - patterns:
        - pattern-either:
            - pattern: yaml.$YFN($DATA, ...)
            - pattern: yaml.$YFN(..., stream=$DATA, ...)
        - metavariable-regex:
            metavariable: $YFN
            regex: ^(load|load_all|unsafe_load|unsafe_load_all|full_load|full_load_all)$
        - pattern-not:
            patterns:
              - pattern-either:
                  - pattern: yaml.$YFN(..., Loader=$L, ...)
                  - pattern: yaml.$YFN($D, $L, ...)
              # Loader 식이 이름 하나여야 한다 (metavariable-pattern 은 식 안 어딘가에만 있어도 맞는다):
              # `SafeLoader if c else Loader`, getattr(yaml, n, SafeLoader), (SafeLoader, Loader)[i] 안에 든 SafeLoader 는 증거가 아니다
              - metavariable-regex:
                  metavariable: $L
                  regex: \A[\w.]+\z
              # import 로 풀리는 PyYAML 의 클래스만 인정한다. 이름만 SafeLoader 인 자체 클래스, SafeLoader 를 상속한 클래스(생성자를 더할 수 있다),
              # 변수에 담은 Loader 는 인정하지 않는다
              - metavariable-pattern:
                  metavariable: $L
                  pattern-either:
                    - pattern: yaml.SafeLoader
                    - pattern: yaml.CSafeLoader
                    - pattern: yaml.BaseLoader
                    - pattern: yaml.CBaseLoader
                    - pattern: yaml.loader.SafeLoader
                    - pattern: yaml.loader.BaseLoader
                    - pattern: yaml.cyaml.CSafeLoader
                    - pattern: yaml.cyaml.CBaseLoader
        - focus-metavariable: $DATA
    # weights_only=True 가 아닌 torch.load 는 pickle 로 읽는다
    - patterns:
        - pattern-either:
            - pattern: torch.load($DATA, ...)
            - pattern: torch.load(..., f=$DATA, ...)
        - pattern-not: torch.load(..., weights_only=True, ...)
        - focus-metavariable: $DATA
    # numpy.load 는 allow_pickle 을 주지 않으면 pickle 을 읽지 않는다. 주었는데 False 로 확인되지 않으면(True·변수·요청 값·**옵션) sink
    - patterns:
        - pattern-either:
            - pattern: numpy.load($DATA, ...)
            - pattern: numpy.load(..., file=$DATA, ...)
        - pattern-either:
            - pattern: numpy.load(..., allow_pickle=$AP, ...)
            - pattern: numpy.load($F, $MM, $AP, ...)
            - pattern: numpy.load(..., **$OPTS)
        - pattern-not: numpy.load(..., allow_pickle=False, ...)
        - pattern-not: numpy.load($F, $MM, False, ...)
        - focus-metavariable: $DATA
- id: mois-5-05-unsafe-deserializer-py
  languages: [python]
  severity: WARNING
  message: "[행안부 코드오류] 신뢰할 수 없는 데이터의 역직렬화: 임의 객체를 만들 수 있는 역직렬화(SafeLoader 로 확인되지 않는 yaml.load·unsafe_load·full_load, 네트워크에서 받은 데이터의 pickle, weights_only 없는 torch.load)를 사용함 — 데이터 출처를 확인하고 yaml.safe_load·json·weights_only=True 로 바꾸거나 서명 검증을 적용할 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "코드오류"
    mois-item-no: "5-5"
    mois-item: "신뢰할 수 없는 데이터의 역직렬화"
    cwe: "CWE-502"
    gate: warn
  pattern-either:
    # SafeLoader·BaseLoader 계열로 확인되지 않는 YAML 로더 (요청 값이 직접 흘러가는 경우는 위 block 규칙이 잡는다).
    # Loader 를 주지 않은 호출, FullLoader, 상속 클래스, 별칭, 변수, 조건식이 모두 여기에 든다
    - patterns:
        - pattern: yaml.$YFN(...)
        - metavariable-regex:
            metavariable: $YFN
            regex: ^(load|load_all|unsafe_load|unsafe_load_all|full_load|full_load_all)$
        - pattern-not:
            patterns:
              - pattern-either:
                  - pattern: yaml.$YFN(..., Loader=$L, ...)
                  - pattern: yaml.$YFN($D, $L, ...)
              - metavariable-regex:
                  metavariable: $L
                  regex: \A[\w.]+\z
              - metavariable-pattern:
                  metavariable: $L
                  pattern-either:
                    - pattern: yaml.SafeLoader
                    - pattern: yaml.CSafeLoader
                    - pattern: yaml.BaseLoader
                    - pattern: yaml.CBaseLoader
                    - pattern: yaml.loader.SafeLoader
                    - pattern: yaml.loader.BaseLoader
                    - pattern: yaml.cyaml.CSafeLoader
                    - pattern: yaml.cyaml.CBaseLoader
    # pickle 로 읽는 모델·배열 파일
    - patterns:
        - pattern: torch.load(...)
        - pattern-not: torch.load(..., weights_only=True, ...)
    # allow_pickle 을 주었는데 False 로 확인되지 않는 numpy.load (True·변수·**옵션)
    - patterns:
        - pattern-either:
            - pattern: numpy.load(..., allow_pickle=$AP, ...)
            - pattern: numpy.load($F, $MM, $AP, ...)
            - pattern: numpy.load(..., **$OPTS)
        - pattern-not: numpy.load(..., allow_pickle=False, ...)
        - pattern-not: numpy.load($F, $MM, False, ...)
    # 소켓·HTTP 로 받은 데이터를 pickle 로 역직렬화
    - patterns:
        - pattern-either:
            - pattern: pickle.$FN($NET, ...)
            - pattern: pickle.$FN(..., file=$NET, ...)
            - patterns:
                - pattern-inside: |
                    $V = $NET
                    ...
                - pattern-either:
                    - pattern: pickle.$FN($V, ...)
                    - pattern: pickle.$FN(..., file=$V, ...)
        - metavariable-regex:
            metavariable: $FN
            regex: ^(loads|load)$
        - metavariable-pattern:
            metavariable: $NET
            pattern-either:
              - pattern: $SOCK.recv(...)
              - pattern: $SOCK.recvfrom(...)[0]
              - pattern: $SOCK.makefile(...)
              # $NET 안 어디에 있어도 맞는다: requests.get(u).content 는 $RESP.content 에, urlopen(u).read() 는 urlopen(...) 에 포함된다
              - pattern: $RESP.content
              - pattern: urllib.request.urlopen(...)
