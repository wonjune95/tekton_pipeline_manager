rules:
- id: mois-1-09-xpath-injection-py
  mode: taint
  languages: [python]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] XML 삽입: 외부 입력이 검증 없이 XPath·XQuery 질의문에 사용됨 — lxml 은 XPath 변수($name)와 키워드 인자로 값을 넘기고, 그럴 수 없으면 정규식 허용 목록으로 검증할 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-9"
    mois-item: "XML 삽입"
    cwe: "CWE-643"
    gate: block
  # guard sanitizer(규약 §1 v2)가 '분기의 마지막 문장이 return·raise' 일 때만 중단으로 보게 한다
  options:
    go_deeper_stmt: false
  pattern-sources:
    # (A) 요청 객체의 값. 이름이 request·req 인 객체, flask.request(별칭 import 포함), 타입이 Request·WebSocket 으로 적힌 매개변수
    - patterns:
        - pattern-either:
            - patterns:
                - pattern: $REQ.$ATTR
                - metavariable-regex:
                    metavariable: $REQ
                    regex: ^(request|req|self\.request)$
            - pattern: flask.request.$ATTR
            - patterns:
                - pattern-inside: |
                    def $F(..., $REQ: $RT, ...):
                      ...
                - metavariable-regex:
                    metavariable: $RT
                    regex: ^(\w+\.)*(Request|HttpRequest|WebSocket|HTTPConnection)$
                - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|json|files|view_args|get_json|get_data|query_string|stream|url|path|full_path|get_full_path|read|readline|readlines|referrer|environ|user_agent|authorization|content_type|mimetype|resolver_match|receive_text|receive_json|receive_bytes|receive|iter_text|iter_json|iter_bytes)$
    # Django 클래스 뷰의 URL 인자
    - pattern: self.kwargs
    # (B) 라우트 함수 매개변수 — 타입 표기 없음. 의존성(= Depends(...)·Security(...))만 제외한다
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - pattern-not-inside: |
          def $F(..., $P: $T, ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Security(...), ...):
            ...
      - focus-metavariable: $P
    # (B) 라우트 함수 매개변수 — 타입 표기 있음. 문자열을 실을 수 없는 타입(끝까지 일치), 프레임워크 타입, 의존성만 제외한다.
    #     의존성은 Depends·Security 가 보이거나, FastAPI 문서의 별칭 이름(…Dep·Current…User)이거나, 같은 파일에서 별칭으로 정의한 타입일 때만 인정한다.
    #     타입 이름이 …Config·…Client·…Settings 라는 것만으로는 제외하지 않는다 (요청 본문 모델일 수 있다)
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)(?!((\w+\.)*(Request|HttpRequest|Response|WebSocket|BackgroundTasks|Session|AsyncSession|HTTPConnection|SecurityScopes))$)(?!\w*(Dep|Deps|Dependency)$)(?!Current\w*(User|Account|Member|Principal|Admin)\w*$)(?!Annotated\[.*\b(Depends|Security)\()'
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Security(...), ...):
            ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Depends(...)]
          ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Security(...)]
          ...
      - focus-metavariable: $P
    # 의존성으로 주입돼도 요청 값인 것: 문자열·바이트(토큰·헤더 값)와 fastapi.security 의 폼·자격증명 객체
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(Annotated\[\s*)?(str|bytes|OAuth2PasswordRequestForm|OAuth2PasswordRequestFormStrict|HTTPBasicCredentials|HTTPAuthorizationCredentials)\s*(\|\s*None\s*)?(,.*\])?$'
      - focus-metavariable: $P
    # 인자 없는 Depends(): 그 타입을 요청 값으로 만들어 넣는다 (쿼리·폼 모델). 서비스·저장소로 보이는 이름만 제외
    - patterns:
        - pattern-either:
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: $T = fastapi.Depends(), ...):
                  ...
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: typing.Annotated[$T, fastapi.Depends()], ...):
                  ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
        - metavariable-regex:
            metavariable: $T
            regex: '^(?!(Annotated\[\s*)?(\w+\.)*\w*(Service|Repository|Repo|Client|Manager|Session|UseCase|Handler|Factory|Provider|Settings|Config)\s*(,.*\])?$)'
        - focus-metavariable: $P
    # Flask 는 함수의 타입 표기를 검사하지 않는다: 경로에 변환기 없는 자리(<name>, <string:…>, <path:…>)가 있으면 숫자 표기여도 문자열이다
    - patterns:
        - pattern-inside: |
            @$APP.$METHOD("$PATH", ...)
            def $F(..., $P: $T, ...):
              ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|route)$
        - metavariable-regex:
            metavariable: $PATH
            regex: .*<((string|path|any)[^:>]*:)?\w+>
        - metavariable-regex:
            metavariable: $T
            regex: '^((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$'
        - focus-metavariable: $P
    # 요청 값이라고 선언한 매개변수는 라우트 함수가 아니어도(의존성 함수) 입력이다: x: str = Header(), x = Query(None), Annotated[str, Form()]
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    # 타입 표기가 없는 것만 (def f(x=Query())). 표기가 있으면 아래 가지가 숫자형을 거른다
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P=$Q(...), ...):
                              ...
                        - pattern-not-inside: |
                            def $F(..., $P: $T2 = $Q(...), ...):
                              ...
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P: $T = $Q(...), ...):
                              ...
                        - metavariable-regex:
                            metavariable: $T
                            regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)'
                - metavariable-regex:
                    metavariable: $Q
                    regex: ^(fastapi\.)?(Query|Header|Cookie|Form|Body|File|Path)$
            - patterns:
                - pattern-inside: |
                    def $F(..., $P: $T, ...):
                      ...
                - metavariable-regex:
                    metavariable: $T
                    regex: '^Annotated\[\s*(?!(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\b)[^,]*,.*\b(Query|Header|Cookie|Form|Body|File|Path)\('
        - focus-metavariable: $P
    # Django 뷰의 URL 인자: 첫 매개변수가 request 인 함수·메서드의 나머지 매개변수 (URLconf 의 <str:…>·<path:…>·정규식 그룹).
    # 변환기는 urls.py 에 있어 볼 수 없으므로 숫자 타입 표기가 있는 것만 제외한다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                def $F(request, ..., $P, ...):
                  ...
            - pattern-inside: |
                def $F(self, request, ..., $P, ...):
                  ...
        - pattern-not-inside: |
            def $F(..., $P: $T, ...):
              ...
        - pattern-not-inside: |
            def $F(..., *$P, ...):
              ...
        - pattern-not-inside: |
            def $F(..., **$P, ...):
              ...
        - focus-metavariable: $P
  pattern-sanitizers:
    - pattern: int(...)
    # 형식 검사 guard (규칙 고유) — 정규식 전체 일치(re.fullmatch) · 문자 종류 검사(isalnum·isdigit·isdecimal·isalpha·isidentifier).
    #   증명할 수 있는 것만 인정한다 (docs/rule-conventions.md 1·2절):
    #   - 정규식은 "허용 문자만 적은 리터럴"이어야 한다: \w · \d · \. · \- · [허용 문자 집합] · 글자 · 수량자 · 묶음.
    #     `.` · \S · \s · [^…] · [A-z]·[+-z] 같은 넓은 범위 · 변수나 요청 값으로 만든 정규식은 무엇이든 통과시킬 수 있어 인정하지 않는다.
    #     컴파일한 정규식은 같은 파일에서 NAME = re.compile("리터럴") 로 정의하고, 그 뒤에 다시 대입하지 않은 것만 본다
    #     (쓰는 함수 안의 global 재대입, 모듈 수준의 두 번째 대입. 함수 안의 지역 변수는 Semgrep 이 다른 이름으로 본다).
    #   - 검사식을 감싸는 식은 or(실패 시 중단) / and(조건 안 사용) 뿐이어야 한다. not (not …) · & · | · == False · is None ·
    #     호출 인자 · 조건식(a if c else b) 안에 들어 있으면 "검사 실패 = 중단" 이 아니다. $WRAP 은 검사식을 품은 모든 식(자신 포함)에 맞는다.
    #   - 종료 함수는 import 로 확인되는 flask.abort · sys.exit 만 본다 (내장 exit()·quit() 는 site 모듈이 없으면 없고, 이름만 abort 인 함수는 끝내지 않을 수 있다).
    #   규칙을 쓰는 방법 (Semgrep 1.180 에서 확인한 것):
    #   - metavariable-pattern 안에는 metavariable-regex 를 두지 않는다. `if(a.b(k=v)).exists():` 처럼 괄호 친 수신 객체가 있는 조건에서
    #     내부 오류(Invalid_argument: String.sub)가 나고 그 파일의 모든 탐지가 빠진다. 안쪽 patterns 로 한 겹 감싸고 정규식은 그 바깥에 건다.
    #   - $COND 는 가지 안에서 묶여 있어야 metavariable-pattern 이 듣는다 — 가지마다 if 문을 다시 적는다.
    # (1) 실패 시 중단: 검사에 실패하면 빠져나가는(return·raise·continue·flask.abort·sys.exit) if 문 **뒤**의 그 변수만 검증된 것으로 본다.
    #     결과를 버림 · 실패해도 계속 진행 · 실패 분기 안에서 사용 · 안쪽 조건부 return · 검사 뒤 재대입(=, +=, 튜플 풀기) 은 인정하지 않는다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    return ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    raise ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    continue
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    flask.abort(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    sys.exit(...)
                ...
        - pattern-either:
            # 문자 종류 검사: not x.isalnum()
            - patterns:
                - patterns:
                    - pattern-inside: |
                        if $COND:
                            ...
                        ...
                    - metavariable-pattern:
                        metavariable: $COND
                        patterns:
                          - pattern: not $X.$IS()
                          - pattern-not-inside:
                              patterns:
                                - pattern: $WRAP
                                - pattern-not: $OR1 or $OR2
                                - pattern-not: not $X.$IS()
                - metavariable-regex:
                    metavariable: $IS
                    regex: ^is(alnum|digit|decimal|alpha|identifier)$
            # 조건에 바로 적은 정규식: not re.fullmatch(r"[a-z0-9]+", x)
            - patterns:
                - patterns:
                    - pattern-inside: |
                        if $COND:
                            ...
                        ...
                    - metavariable-pattern:
                        metavariable: $COND
                        patterns:
                          - pattern: not re.fullmatch("$PAT", $X, ...)
                          - pattern-not-inside:
                              patterns:
                                - pattern: $WRAP
                                - pattern-not: $OR1 or $OR2
                                - pattern-not: not re.fullmatch("$PAT", $X, ...)
                - metavariable-regex:
                    metavariable: $PAT
                    regex: '^(?!.*\\(?!\\?[wd.\-]))(?!.*\[[^\]]*[^A-Za-z0-9\[\\]-[^\]])(?!.*\[[^\]]*(?<![\\\[])-[^A-Za-z0-9\]])(?!.*[A-Z0-9]-[a-z])(?!.*\d-[A-Z])(?:\\{1,2}[wd.\-]|\[[\w.@+:\\-]+\]|[\w@:+*?{},()|^$-])+\z'
            # 모듈 수준에서 컴파일한 정규식: not NAME_RE.fullmatch(x)
            - patterns:
                - patterns:
                    - pattern-inside: |
                        if $COND:
                            ...
                        ...
                    - metavariable-pattern:
                        metavariable: $COND
                        patterns:
                          - pattern: not $RE.fullmatch($X)
                          - pattern-not-inside:
                              patterns:
                                - pattern: $WRAP
                                - pattern-not: $OR1 or $OR2
                                - pattern-not: not $RE.fullmatch($X)
                - pattern-inside: |
                    $RE = re.compile("$PAT", ...)
                    ...
                - metavariable-regex:
                    metavariable: $PAT
                    regex: '^(?!.*\\(?!\\?[wd.\-]))(?!.*\[[^\]]*[^A-Za-z0-9\[\\]-[^\]])(?!.*\[[^\]]*(?<![\\\[])-[^A-Za-z0-9\]])(?!.*[A-Z0-9]-[a-z])(?!.*\d-[A-Z])(?:\\{1,2}[wd.\-]|\[[\w.@+:\\-]+\]|[\w@:+*?{},()|^$-])+\z'
                - pattern-not-inside: |
                    def $FM(...):
                        ...
                        $RE = $V2
                        ...
                - pattern-not-inside: |
                    $RE = re.compile("$PAT", ...)
                    ...
                    $RE = $V2
                    ...
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            (..., $X, ...) = $V
            ...
        - pattern: $X
    # (2) 조건 안에서만 사용: 검사를 통과한 if 안의 그 변수.
    #     else 가 있거나, 조건식 안에서 쓰거나(검사보다 먼저 실행될 수 있다), 본문에서 다시 대입하면(=, +=, 튜플 풀기) 인정하지 않는다
    - patterns:
        - pattern-either:
            # 문자 종류 검사: x.isalnum()
            - patterns:
                - patterns:
                    - pattern-inside: |
                        if $COND:
                            ...
                    - metavariable-pattern:
                        metavariable: $COND
                        patterns:
                          - pattern: $X.$IS()
                          - pattern-not-inside:
                              patterns:
                                - pattern: $WRAP
                                - pattern-not: $AND1 and $AND2
                                - pattern-not: $X.$IS()
                - metavariable-regex:
                    metavariable: $IS
                    regex: ^is(alnum|digit|decimal|alpha|identifier)$
            # 조건에 바로 적은 정규식: re.fullmatch(r"[a-z0-9]+", x)
            - patterns:
                - patterns:
                    - pattern-inside: |
                        if $COND:
                            ...
                    - metavariable-pattern:
                        metavariable: $COND
                        patterns:
                          - pattern: re.fullmatch("$PAT", $X, ...)
                          - pattern-not-inside:
                              patterns:
                                - pattern: $WRAP
                                - pattern-not: $AND1 and $AND2
                                - pattern-not: re.fullmatch("$PAT", $X, ...)
                - metavariable-regex:
                    metavariable: $PAT
                    regex: '^(?!.*\\(?!\\?[wd.\-]))(?!.*\[[^\]]*[^A-Za-z0-9\[\\]-[^\]])(?!.*\[[^\]]*(?<![\\\[])-[^A-Za-z0-9\]])(?!.*[A-Z0-9]-[a-z])(?!.*\d-[A-Z])(?:\\{1,2}[wd.\-]|\[[\w.@+:\\-]+\]|[\w@:+*?{},()|^$-])+\z'
            # 모듈 수준에서 컴파일한 정규식: NAME_RE.fullmatch(x)
            - patterns:
                - patterns:
                    - pattern-inside: |
                        if $COND:
                            ...
                    - metavariable-pattern:
                        metavariable: $COND
                        patterns:
                          - pattern: $RE.fullmatch($X)
                          - pattern-not-inside:
                              patterns:
                                - pattern: $WRAP
                                - pattern-not: $AND1 and $AND2
                                - pattern-not: $RE.fullmatch($X)
                - pattern-inside: |
                    $RE = re.compile("$PAT", ...)
                    ...
                - metavariable-regex:
                    metavariable: $PAT
                    regex: '^(?!.*\\(?!\\?[wd.\-]))(?!.*\[[^\]]*[^A-Za-z0-9\[\\]-[^\]])(?!.*\[[^\]]*(?<![\\\[])-[^A-Za-z0-9\]])(?!.*[A-Z0-9]-[a-z])(?!.*\d-[A-Z])(?:\\{1,2}[wd.\-]|\[[\w.@+:\\-]+\]|[\w@:+*?{},()|^$-])+\z'
                - pattern-not-inside: |
                    def $FM(...):
                        ...
                        $RE = $V2
                        ...
                - pattern-not-inside: |
                    $RE = re.compile("$PAT", ...)
                    ...
                    $RE = $V2
                    ...
        - pattern-not-inside: $COND
        - pattern-not-inside: |
            if $COND:
                ...
            else:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
                $X = $V
                ...
        - pattern-not-inside: |
            if $COND:
                ...
                $X += $V
                ...
        - pattern-not-inside: |
            if $COND:
                ...
                (..., $X, ...) = $V
                ...
        - pattern: $X
    # (공통 1) 모듈 수준에서 문자열·숫자 값만 든 리터럴로 정의한 dict 에서 꺼낸 값은 외부 입력이 아니다: TABLE[key], TABLE.get(key)
    #          인정하지 않는 것: 값에 변수·호출이 든 dict, 함수 안에서 만든 dict, 다른 모듈의 dict, get(key, 입력),
    #          쓰는 함수 안에서 바뀌는 dict (TABLE[k] = v, TABLE.update(...), TABLE.setdefault(...), TABLE |= ..., TABLE = ...)
    - patterns:
        - pattern-either:
            - pattern: $ALLOW[$K]
            - pattern: $ALLOW.get($K)
            - pattern: $ALLOW.get($K, None)
