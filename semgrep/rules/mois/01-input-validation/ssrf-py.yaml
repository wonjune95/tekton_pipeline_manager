rules:
- id: mois-1-12-ssrf-py
  mode: taint
  languages: [python]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] 서버사이드 요청 위조: 외부 입력 URL 로 서버가 검증 없이 요청을 보냄 — 허용 목록의 URL 만 쓰거나 스킴·호스트를 고정하고 입력은 경로·파라미터로만 넘길 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-12"
    mois-item: "서버사이드 요청 위조"
    cwe: "CWE-918"
    gate: block
  options:
    go_deeper_stmt: false
  pattern-sources:
    # (A) 요청 객체의 값. 이름이 request·req 인 객체, flask.request(별칭 import 포함), 타입이 Request·WebSocket 으로 적힌 매개변수
    - patterns:
        - pattern-either:
            - patterns:
                - pattern: $REQ.$ATTR
                - metavariable-regex:
                    metavariable: $REQ
                    regex: ^(request|req|self\.request)$
            - pattern: flask.request.$ATTR
            - patterns:
                - pattern-inside: |
                    def $F(..., $REQ: $RT, ...):
                      ...
                - metavariable-regex:
                    metavariable: $RT
                    regex: ^(\w+\.)*(Request|HttpRequest|WebSocket|HTTPConnection)$
                - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|json|files|view_args|get_json|get_data|query_string|stream|url|path|full_path|get_full_path|read|readline|readlines|referrer|environ|user_agent|authorization|content_type|mimetype|resolver_match|receive_text|receive_json|receive_bytes|receive|iter_text|iter_json|iter_bytes)$
    # Django 클래스 뷰의 URL 인자
    - pattern: self.kwargs
    # (B) 라우트 함수 매개변수 — 타입 표기 없음. 의존성(= Depends(...)·Security(...))만 제외한다
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - pattern-not-inside: |
          def $F(..., $P: $T, ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Security(...), ...):
            ...
      - focus-metavariable: $P
    # (B) 라우트 함수 매개변수 — 타입 표기 있음. 문자열을 실을 수 없는 타입(끝까지 일치), 프레임워크 타입, 의존성만 제외한다.
    #     의존성은 Depends·Security 가 보이거나, FastAPI 문서의 별칭 이름(…Dep·Current…User)이거나, 같은 파일에서 별칭으로 정의한 타입일 때만 인정한다.
    #     타입 이름이 …Config·…Client·…Settings 라는 것만으로는 제외하지 않는다 (요청 본문 모델일 수 있다)
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)(?!((\w+\.)*(Request|HttpRequest|Response|WebSocket|BackgroundTasks|Session|AsyncSession|HTTPConnection|SecurityScopes))$)(?!\w*(Dep|Deps|Dependency)$)(?!Current\w*(User|Account|Member|Principal|Admin)\w*$)(?!Annotated\[.*\b(Depends|Security)\()'
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Security(...), ...):
            ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Depends(...)]
          ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Security(...)]
          ...
      - focus-metavariable: $P
    # 의존성으로 주입돼도 요청 값인 것: 문자열·바이트(토큰·헤더 값)와 fastapi.security 의 폼·자격증명 객체
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(Annotated\[\s*)?(str|bytes|OAuth2PasswordRequestForm|OAuth2PasswordRequestFormStrict|HTTPBasicCredentials|HTTPAuthorizationCredentials)\s*(\|\s*None\s*)?(,.*\])?$'
      - focus-metavariable: $P
    # 인자 없는 Depends(): 그 타입을 요청 값으로 만들어 넣는다 (쿼리·폼 모델). 서비스·저장소로 보이는 이름만 제외
    - patterns:
        - pattern-either:
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: $T = fastapi.Depends(), ...):
                  ...
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: typing.Annotated[$T, fastapi.Depends()], ...):
                  ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
        - metavariable-regex:
            metavariable: $T
            regex: '^(?!(Annotated\[\s*)?(\w+\.)*\w*(Service|Repository|Repo|Client|Manager|Session|UseCase|Handler|Factory|Provider|Settings|Config)\s*(,.*\])?$)'
        - focus-metavariable: $P
    # Flask 는 함수의 타입 표기를 검사하지 않는다: 경로에 변환기 없는 자리(<name>, <string:…>, <path:…>)가 있으면 숫자 표기여도 문자열이다
    - patterns:
        - pattern-inside: |
            @$APP.$METHOD("$PATH", ...)
            def $F(..., $P: $T, ...):
              ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|route)$
        - metavariable-regex:
            metavariable: $PATH
            regex: .*<((string|path|any)[^:>]*:)?\w+>
        - metavariable-regex:
            metavariable: $T
            regex: '^((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$'
        - focus-metavariable: $P
    # 요청 값이라고 선언한 매개변수는 라우트 함수가 아니어도(의존성 함수) 입력이다: x: str = Header(), x = Query(None), Annotated[str, Form()]
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    # 타입 표기가 없는 것만 (def f(x=Query())). 표기가 있으면 아래 가지가 숫자형을 거른다
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P=$Q(...), ...):
                              ...
                        - pattern-not-inside: |
                            def $F(..., $P: $T2 = $Q(...), ...):
                              ...
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P: $T = $Q(...), ...):
                              ...
                        - metavariable-regex:
                            metavariable: $T
                            regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)'
                - metavariable-regex:
                    metavariable: $Q
                    regex: ^(fastapi\.)?(Query|Header|Cookie|Form|Body|File|Path)$
            - patterns:
                - pattern-inside: |
                    def $F(..., $P: $T, ...):
                      ...
                - metavariable-regex:
                    metavariable: $T
                    regex: '^Annotated\[\s*(?!(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\b)[^,]*,.*\b(Query|Header|Cookie|Form|Body|File|Path)\('
        - focus-metavariable: $P
    # Django 뷰의 URL 인자: 첫 매개변수가 request 인 함수·메서드의 나머지 매개변수 (URLconf 의 <str:…>·<path:…>·정규식 그룹).
    # 변환기는 urls.py 에 있어 볼 수 없으므로 숫자 타입 표기가 있는 것만 제외한다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                def $F(request, ..., $P, ...):
                  ...
            - pattern-inside: |
                def $F(self, request, ..., $P, ...):
                  ...
        - pattern-not-inside: |
            def $F(..., $P: $T, ...):
              ...
        - pattern-not-inside: |
            def $F(..., *$P, ...):
              ...
        - pattern-not-inside: |
            def $F(..., **$P, ...):
              ...
        - focus-metavariable: $P
  pattern-sanitizers:
    # 고정 접두: 스킴과 호스트를 고정한 문자열 리터럴이 "값의 맨 앞에 그대로 남는다고 증명되는" 식만 인정한다
    #   (가) 맨 앞 리터럴: "https://고정호스트" 뒤에 / ? # 가 리터럴 안에 있어야 한다. "https://%s/" % x, "https://{}/".format(x),
    #        f"https://{x}/", "https://host:" + port, "https://host" + x(host.evil.example·host@evil 가능), "https://user@" + x 는 제외
    #   (나) 식의 모양은 넷뿐이다: 리터럴 + 값 · 리터럴 % 값 · 리터럴.format(값) · f-string(나란히 적어 이어 붙인 리터럴 포함).
    #        글자가 리터럴로 시작해도 조건식·or·and·join·묶음(a, b)·dict 항목·생성식은 값이 다른 데서 올 수 있으므로 인정하지 않는다
    #   (다) 맨 앞 리터럴을 바꾸거나 잘라내는 연산이 앞머리에 걸려 있으면 제외한다 ($RCV 가 그 리터럴로 시작하는 식일 때):
    #        "https://HOST/".replace("HOST", x) · "https://host/".rstrip("/") + x · "https://host/"[:-1] + x · "https://host/" * n + x
    #        Semgrep 은 a % b * c 를 a % (b * c) 로 읽으므로(Python 은 (a % b) * c) % 오른쪽에 곱셈이 보이면 제외한다
    #   int(...) 는 sanitizer 가 아니다: "http://" + str(int(x)) 는 10진수 IP(2130706433 = 127.0.0.1)이고, 포트·옥텟 자리의 정수도 대상을 바꾼다.
    #        경로·질의 자리의 정수는 위 고정 접두로 인정된다
    - patterns:
        - pattern: $S
        - metavariable-regex:
            metavariable: $S
            regex: ^f?["']https?://[^/?#{}"'\\%@\s]+[/?#]
        - pattern-either:
            - pattern: $A + $B
            - pattern: $A % $B
            - pattern: $A.format(...)
            # f-string 하나, 또는 나란히 적어 이어 붙인 리터럴들 (Semgrep 1.180 은 둘 다 같은 이어붙이기 노드로 본다)
            - pattern: '"..." "..."'
        - pattern-not:
            patterns:
              - pattern-either:
                  - patterns:
                      - pattern: <... $RCV.$M ...>
                      - metavariable-regex:
                          metavariable: $M
                          regex: ^(?!format$)
                  - pattern: <... $RCV[...] ...>
                  # 슬라이스는 모양마다 따로 적어야 맞는다 ($RCV[...] 는 색인에만 맞는다). 전체 복사 [:] 는 접두를 바꾸지 않으므로 넣지 않는다
                  - pattern: <... $RCV[$I:$J] ...>
                  - pattern: <... $RCV[$I:] ...>
                  - pattern: <... $RCV[:$J] ...>
                  - pattern: <... $RCV[$I:$J:$K] ...>
                  - pattern: <... $RCV[$I::$K] ...>
                  - pattern: <... $RCV[:$J:$K] ...>
                  - pattern: <... $RCV[::$K] ...>
                  - pattern: <... $RCV * $N ...>
                  - patterns:
                      - pattern: <... $RCV % $R ...>
                      - metavariable-pattern:
                          metavariable: $R
                          pattern: $X * $N
              - metavariable-regex:
                  metavariable: $RCV
                  regex: ^f?["']https?://
    # (공통 1) 모듈 수준에서 문자열·숫자 값만 든 리터럴로 정의한 dict 에서 꺼낸 값은 외부 입력이 아니다: TABLE[key], TABLE.get(key)
    #          인정하지 않는 것: 값에 변수·호출이 든 dict, 함수 안에서 만든 dict, 다른 모듈의 dict, get(key, 입력),
    #          쓰는 함수 안에서 바뀌는 dict (TABLE[k] = v, TABLE.update(...), TABLE.setdefault(...), TABLE |= ..., TABLE = ...)
    - patterns:
        - pattern-either:
            - pattern: $ALLOW[$K]
            - pattern: $ALLOW.get($K)
            - pattern: $ALLOW.get($K, None)
            - pattern: $ALLOW.get($K, "...")
        - pattern-inside: |
            $ALLOW = $LIT
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^\{\s*(?:(?:"[^"\n]*"|''[^''\n]*'')\s*:\s*(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)+\}$'
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW = $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW |= $V2
                ...
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  def $FM(...):
                      ...
                      $ALLOW.$MUT(...)
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(update|setdefault)$
    # (공통 4) Django ORM 조회 결과는 요청 값이 아니라 DB 에 저장된 값이다: Model.objects.get(pk=입력), get_object_or_404(Model, pk=입력)
    #          exact — 조회 호출(또는 그 결과를 받는 대입문)만 깨끗하게 본다. 대입문 안에 SQL 원문을 받는 raw()·extra()·RawSQL 이 있으면
    #          인정하지 않는다 (그 안의 SQL 삽입은 SQL 규칙이 잡아야 한다)
    - patterns:
        - pattern-either:
            - pattern: $M.objects.$Q(...)
            - pattern: django.shortcuts.get_object_or_404(...)
            - pattern: django.shortcuts.get_list_or_404(...)
            # 변수에 받는 문장 (exact 식 패턴만으로는 대입한 변수가 깨끗해지지 않는다)
            - pattern: $V = $M.objects.$Q(...)
            - pattern: $V = django.shortcuts.get_object_or_404(...)
            - pattern: $V = django.shortcuts.get_list_or_404(...)
        - pattern-not: $V = <... $QS.raw(...) ...>
        - pattern-not: $V = <... $QS.extra(...) ...>
        - pattern-not: $V = <... django.db.models.expressions.RawSQL(...) ...>
      exact: true
    # (공통 2) 허용 목록 guard — 목록에 없으면 빠져나가거나(return·raise·continue·flask.abort·sys.exit) 고정된 기본값으로 바꾼다.
    #          허용 목록은 "문자열·숫자만 든 리터럴"이어야 한다: 모듈 수준에서 이름을 붙인 것(ALLOWED = {"a", "b"}, frozenset({...}), set([...]))
    #          또는 조건에 바로 적은 것((...), [...], {...}). 함수 안에서 만든 목록, 쓰는 함수 안에서 바뀌는 목록(append·add·+= …)은 인정하지 않는다.
    #          조건 원문은 "x not in 목록" 또는 "… or x not in 목록 or …" 만 인정한다 (and·괄호·비교로 감싸면 불인정).
    #          if 문 "뒤"의 값만 인정한다 (docs/rule-conventions.md 1절). 결과를 버림 · 실패해도 진행 · 실패 분기 안 사용 ·
    #          안쪽 조건부 return · 검사 뒤 재대입(=, +=, 튜플 풀기 — $X = $V 가 튜플 풀기에도 맞는다 —, 한 단계 안쪽 블록 포함) · else 가 붙은 검사 · 식 안의 조건부 종료는 탐지된다.
    #          종료 함수는 import 로 확인되는 flask.abort · sys.exit 만 본다 (이름만 abort 인 함수는 끝내지 않을 수 있다)
    #          (조건 판정을 metavariable-pattern 안의 정규식으로 하지 않는다 — 실제 코드에서 Semgrep 내부 오류가 난다)
    #   (2-가) 이름 붙은 목록: if x not in ALLOWED: return   /   if x not in ALLOWED: x = "기본값"
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    return ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    raise ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    continue
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    flask.abort(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    sys.exit(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = "..."
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = None
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: $X not in $ALLOW
                  - pattern: not $X in $ALLOW
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?\s+or\s+)*(?:[\w.]+\s+not\s+in\s+[\w.]+|not\s+[\w.]+\s+in\s+[\w.]+)(?:\s+or\s+(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?)*$'
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        # 검사 뒤 한 단계 안쪽 블록(if·else·for·while·with·try·except)에서 다시 대입해도 제외
        - pattern-not-inside:
            pattern-either:
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                  else:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                  else:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  for $I2 in $IT2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
