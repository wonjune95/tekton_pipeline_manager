rules:
- id: mois-1-02-code-injection-py
  mode: taint
  languages: [python]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] 코드삽입: 외부 입력이 eval·exec·동적 import·템플릿 원문(Jinja2·Django Template)에서 코드로 실행됨 — 값 해석은 ast.literal_eval·json.loads 로, 모듈 선택은 허용 목록으로, 템플릿은 고정하고 입력은 변수로 넘길 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-2"
    mois-item: "코드삽입"
    cwe: "CWE-94"
    gate: block
  options:
    go_deeper_stmt: false
  pattern-sources:
    # (A) 요청 객체의 값. 이름이 request·req 인 객체, flask.request(별칭 import 포함), 타입이 Request·WebSocket 으로 적힌 매개변수
    - patterns:
        - pattern-either:
            - patterns:
                - pattern: $REQ.$ATTR
                - metavariable-regex:
                    metavariable: $REQ
                    regex: ^(request|req|self\.request)$
            - pattern: flask.request.$ATTR
            - patterns:
                - pattern-inside: |
                    def $F(..., $REQ: $RT, ...):
                      ...
                - metavariable-regex:
                    metavariable: $RT
                    regex: ^(\w+\.)*(Request|HttpRequest|WebSocket|HTTPConnection)$
                - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|json|files|view_args|get_json|get_data|query_string|stream|url|path|full_path|get_full_path|read|readline|readlines|referrer|environ|user_agent|authorization|content_type|mimetype|resolver_match|receive_text|receive_json|receive_bytes|receive|iter_text|iter_json|iter_bytes)$
    # Django 클래스 뷰의 URL 인자
    - pattern: self.kwargs
    # (B) 라우트 함수 매개변수 — 타입 표기 없음. 의존성(= Depends(...)·Security(...))만 제외한다
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - pattern-not-inside: |
          def $F(..., $P: $T, ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Security(...), ...):
            ...
      - focus-metavariable: $P
    # (B) 라우트 함수 매개변수 — 타입 표기 있음. 문자열을 실을 수 없는 타입(끝까지 일치), 프레임워크 타입, 의존성만 제외한다.
    #     의존성은 Depends·Security 가 보이거나, FastAPI 문서의 별칭 이름(…Dep·Current…User)이거나, 같은 파일에서 별칭으로 정의한 타입일 때만 인정한다.
    #     타입 이름이 …Config·…Client·…Settings 라는 것만으로는 제외하지 않는다 (요청 본문 모델일 수 있다)
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)(?!((\w+\.)*(Request|HttpRequest|Response|WebSocket|BackgroundTasks|Session|AsyncSession|HTTPConnection|SecurityScopes))$)(?!\w*(Dep|Deps|Dependency)$)(?!Current\w*(User|Account|Member|Principal|Admin)\w*$)(?!Annotated\[.*\b(Depends|Security)\()'
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Security(...), ...):
            ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Depends(...)]
          ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Security(...)]
          ...
      - focus-metavariable: $P
    # 의존성으로 주입돼도 요청 값인 것: 문자열·바이트(토큰·헤더 값)와 fastapi.security 의 폼·자격증명 객체
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(Annotated\[\s*)?(str|bytes|OAuth2PasswordRequestForm|OAuth2PasswordRequestFormStrict|HTTPBasicCredentials|HTTPAuthorizationCredentials)\s*(\|\s*None\s*)?(,.*\])?$'
      - focus-metavariable: $P
    # 인자 없는 Depends(): 그 타입을 요청 값으로 만들어 넣는다 (쿼리·폼 모델). 서비스·저장소로 보이는 이름만 제외
    - patterns:
        - pattern-either:
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: $T = fastapi.Depends(), ...):
                  ...
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: typing.Annotated[$T, fastapi.Depends()], ...):
                  ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
        - metavariable-regex:
            metavariable: $T
            regex: '^(?!(Annotated\[\s*)?(\w+\.)*\w*(Service|Repository|Repo|Client|Manager|Session|UseCase|Handler|Factory|Provider|Settings|Config)\s*(,.*\])?$)'
        - focus-metavariable: $P
    # Flask 는 함수의 타입 표기를 검사하지 않는다: 경로에 변환기 없는 자리(<name>, <string:…>, <path:…>)가 있으면 숫자 표기여도 문자열이다
    - patterns:
        - pattern-inside: |
            @$APP.$METHOD("$PATH", ...)
            def $F(..., $P: $T, ...):
              ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|route)$
        - metavariable-regex:
            metavariable: $PATH
            regex: .*<((string|path|any)[^:>]*:)?\w+>
        - metavariable-regex:
            metavariable: $T
            regex: '^((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$'
        - focus-metavariable: $P
    # 요청 값이라고 선언한 매개변수는 라우트 함수가 아니어도(의존성 함수) 입력이다: x: str = Header(), x = Query(None), Annotated[str, Form()]
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    # 타입 표기가 없는 것만 (def f(x=Query())). 표기가 있으면 아래 가지가 숫자형을 거른다
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P=$Q(...), ...):
                              ...
                        - pattern-not-inside: |
                            def $F(..., $P: $T2 = $Q(...), ...):
                              ...
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P: $T = $Q(...), ...):
                              ...
                        - metavariable-regex:
                            metavariable: $T
                            regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)'
                - metavariable-regex:
                    metavariable: $Q
                    regex: ^(fastapi\.)?(Query|Header|Cookie|Form|Body|File|Path)$
            - patterns:
                - pattern-inside: |
                    def $F(..., $P: $T, ...):
                      ...
                - metavariable-regex:
                    metavariable: $T
                    regex: '^Annotated\[\s*(?!(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\b)[^,]*,.*\b(Query|Header|Cookie|Form|Body|File|Path)\('
        - focus-metavariable: $P
    # Django 뷰의 URL 인자: 첫 매개변수가 request 인 함수·메서드의 나머지 매개변수 (URLconf 의 <str:…>·<path:…>·정규식 그룹).
    # 변환기는 urls.py 에 있어 볼 수 없으므로 숫자 타입 표기가 있는 것만 제외한다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                def $F(request, ..., $P, ...):
                  ...
            - pattern-inside: |
                def $F(self, request, ..., $P, ...):
                  ...
        - pattern-not-inside: |
            def $F(..., $P: $T, ...):
              ...
        - pattern-not-inside: |
            def $F(..., *$P, ...):
              ...
        - pattern-not-inside: |
            def $F(..., **$P, ...):
              ...
        - focus-metavariable: $P
  pattern-sanitizers:
    # (공통 1) 모듈 수준에서 문자열·숫자 값만 든 리터럴로 정의한 dict 에서 꺼낸 값은 외부 입력이 아니다: TABLE[key], TABLE.get(key)
    #          인정하지 않는 것: 값에 변수·호출이 든 dict, 함수 안에서 만든 dict, 다른 모듈의 dict, get(key, 입력),
    #          쓰는 함수 안에서 바뀌는 dict (TABLE[k] = v, TABLE.update(...), TABLE.setdefault(...), TABLE |= ..., TABLE = ...)
    - patterns:
        - pattern-either:
            - pattern: $ALLOW[$K]
            - pattern: $ALLOW.get($K)
            - pattern: $ALLOW.get($K, None)
            - pattern: $ALLOW.get($K, "...")
        - pattern-inside: |
            $ALLOW = $LIT
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^\{\s*(?:(?:"[^"\n]*"|''[^''\n]*'')\s*:\s*(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)+\}$'
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW = $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW |= $V2
                ...
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  def $FM(...):
                      ...
                      $ALLOW.$MUT(...)
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(update|setdefault)$
    # (공통 4) Django ORM 조회 결과는 요청 값이 아니라 DB 에 저장된 값이다: Model.objects.get(pk=입력), get_object_or_404(Model, pk=입력)
    #          exact — 조회 호출(또는 그 결과를 받는 대입문)만 깨끗하게 본다. 대입문 안에 SQL 원문을 받는 raw()·extra()·RawSQL 이 있으면
    #          인정하지 않는다 (그 안의 SQL 삽입은 SQL 규칙이 잡아야 한다)
    - patterns:
        - pattern-either:
            - pattern: $M.objects.$Q(...)
            - pattern: django.shortcuts.get_object_or_404(...)
            - pattern: django.shortcuts.get_list_or_404(...)
            # 변수에 받는 문장 (exact 식 패턴만으로는 대입한 변수가 깨끗해지지 않는다)
            - pattern: $V = $M.objects.$Q(...)
            - pattern: $V = django.shortcuts.get_object_or_404(...)
            - pattern: $V = django.shortcuts.get_list_or_404(...)
        - pattern-not: $V = <... $QS.raw(...) ...>
        - pattern-not: $V = <... $QS.extra(...) ...>
        - pattern-not: $V = <... django.db.models.expressions.RawSQL(...) ...>
      exact: true
    # (공통 2) 허용 목록 guard — 목록에 없으면 빠져나가거나(return·raise·continue·flask.abort·sys.exit) 고정된 기본값으로 바꾼다.
    #          허용 목록은 "문자열·숫자만 든 리터럴"이어야 한다: 모듈 수준에서 이름을 붙인 것(ALLOWED = {"a", "b"}, frozenset({...}), set([...]))
    #          또는 조건에 바로 적은 것((...), [...], {...}). 함수 안에서 만든 목록, 쓰는 함수 안에서 바뀌는 목록(append·add·+= …)은 인정하지 않는다.
    #          조건 원문은 "x not in 목록" 또는 "… or x not in 목록 or …" 만 인정한다 (and·괄호·비교로 감싸면 불인정).
    #          if 문 "뒤"의 값만 인정한다 (docs/rule-conventions.md 1절). 결과를 버림 · 실패해도 진행 · 실패 분기 안 사용 ·
    #          안쪽 조건부 return · 검사 뒤 재대입(=, +=, 튜플 풀기 — $X = $V 가 튜플 풀기에도 맞는다 —, 한 단계 안쪽 블록 포함) · else 가 붙은 검사 · 식 안의 조건부 종료는 탐지된다.
    #          종료 함수는 import 로 확인되는 flask.abort · sys.exit 만 본다 (이름만 abort 인 함수는 끝내지 않을 수 있다)
    #          (조건 판정을 metavariable-pattern 안의 정규식으로 하지 않는다 — 실제 코드에서 Semgrep 내부 오류가 난다)
    #   (2-가) 이름 붙은 목록: if x not in ALLOWED: return   /   if x not in ALLOWED: x = "기본값"
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    return ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    raise ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    continue
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    flask.abort(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    sys.exit(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = "..."
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = None
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: $X not in $ALLOW
                  - pattern: not $X in $ALLOW
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?\s+or\s+)*(?:[\w.]+\s+not\s+in\s+[\w.]+|not\s+[\w.]+\s+in\s+[\w.]+)(?:\s+or\s+(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?)*$'
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        # 검사 뒤 한 단계 안쪽 블록(if·else·for·while·with·try·except)에서 다시 대입해도 제외
        - pattern-not-inside:
            pattern-either:
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                  else:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                  else:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  for $I2 in $IT2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  for $I2 in $IT2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  while $C2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  while $C2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  with $W2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  with $W2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                      $X = $V
                      ...
                  except ...:
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                      $X += $V
                      ...
                  except ...:
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                  except ...:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                  except ...:
                      ...
                      $X += $V
                      ...
                  ...
        # else 가 붙은 검사는 인정하지 않는다 (else 쪽에서 값을 바꿀 수 있다)
        - pattern-not-inside: |
            if $COND:
                ...
            else:
                ...
            ...
        # 식 안에서 조건부로만 끝내는 경우(strict and flask.abort(400))는 끝내는 것이 아니다
        - pattern-not-inside: |
            if $COND:
                ...
                $P and $Q
            ...
        - pattern-not-inside: |
            if $COND:
                ...
                $P or $Q
            ...
        - pattern-inside: |
            $ALLOW = $LIT
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^(?:(?:frozenset|set)\(\s*)?[\[{(]\s*(?:(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)*[\]})]\s*\)?$'
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW = $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW += $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW |= $V2
                ...
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  def $FM(...):
                      ...
                      $ALLOW.$MUT(...)
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(update|append|add|extend|insert)$
        - pattern: $X
    #   (2-나) 조건에 바로 적은 목록: if x not in ("png", "jpg"): return   /   ... : x = "png"
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    return ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    raise ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    continue
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    flask.abort(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    sys.exit(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = "..."
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = None
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: $X not in $ALLOW
                  - pattern: not $X in $ALLOW
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?\s+or\s+)*(?:[\w.]+\s+not\s+in\s+[\[{(]\s*(?:(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)*[\]})]|not\s+[\w.]+\s+in\s+[\[{(]\s*(?:(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)*[\]})])(?:\s+or\s+(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?)*$'
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        # 검사 뒤 한 단계 안쪽 블록(if·else·for·while·with·try·except)에서 다시 대입해도 제외
        - pattern-not-inside:
            pattern-either:
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                  else:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  if $C2:
                      ...
                  else:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  for $I2 in $IT2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  for $I2 in $IT2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  while $C2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  while $C2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  with $W2:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  with $W2:
                      ...
                      $X += $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                      $X = $V
                      ...
                  except ...:
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                      $X += $V
                      ...
                  except ...:
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                  except ...:
                      ...
                      $X = $V
                      ...
                  ...
              - pattern: |
                  if $COND:
                      ...
                  ...
                  try:
                      ...
                  except ...:
                      ...
                      $X += $V
                      ...
                  ...
        # else 가 붙은 검사는 인정하지 않는다 (else 쪽에서 값을 바꿀 수 있다)
        - pattern-not-inside: |
            if $COND:
                ...
            else:
                ...
            ...
        # 식 안에서 조건부로만 끝내는 경우(strict and flask.abort(400))는 끝내는 것이 아니다
        - pattern-not-inside: |
            if $COND:
                ...
                $P and $Q
            ...
        - pattern-not-inside: |
            if $COND:
                ...
                $P or $Q
            ...
        - pattern: $X
    # (공통 3) 허용 목록 조건 안에서만 쓰는 경우: if x in ALLOWED: 사용(x)
    #          조건 원문은 "x in 목록" 또는 "… and x in 목록 and …" 만 인정한다 (or·not·괄호·비교로 감싸면 불인정).
    #          else 가 있거나 조건 안에서 다시 대입하면 인정하지 않는다. 목록 조건은 (공통 2) 와 같다
    - patterns:
        - pattern-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $C:
                ...
            else:
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X = $V
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X += $V
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: $X in $ALLOW
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?\s+and\s+)*[\w.]+\s+in\s+[\w.]+(?:\s+and\s+(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?)*$'
        - pattern-inside: |
            $ALLOW = $LIT
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^(?:(?:frozenset|set)\(\s*)?[\[{(]\s*(?:(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)*[\]})]\s*\)?$'
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW = $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW += $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW |= $V2
                ...
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  def $FM(...):
                      ...
                      $ALLOW.$MUT(...)
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(update|append|add|extend|insert)$
        - pattern: $X
    - patterns:
        - pattern-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $C:
                ...
            else:
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X = $V
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X += $V
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: $X in $ALLOW
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?\s+and\s+)*[\w.]+\s+in\s+[\[{(]\s*(?:(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)*[\]})](?:\s+and\s+(?:not\s+)?[\w.]+(?:\([^()\n]*\))?(?:\s+is\s+(?:not\s+)?None)?)*$'
        - pattern: $X
  pattern-sinks:
    # 코드·모듈 이름·템플릿 원문 자리만 본다 — 첫 번째 위치 인자와, 같은 자리를 키워드로 넘긴 형태(source=·name=·template_string=·text=).
    # 템플릿 변수(context)로 넘긴 값은 탐지하지 않는다. eval·exec 의 첫 인자는 위치 전용이라 키워드 형태가 없다
    - patterns:
        - pattern-either:
            - pattern: eval($CODE, ...)
            - pattern: exec($CODE, ...)
            - pattern: compile($CODE, ...)
            - pattern: compile(..., source=$CODE, ...)
            - pattern: __import__($CODE, ...)
            - pattern: __import__(..., name=$CODE, ...)
            - pattern: importlib.import_module($CODE, ...)
            - pattern: importlib.import_module(..., name=$CODE, ...)
            # 상대 import 의 기준 패키지(package)도 어느 모듈을 실행할지 정한다
            - pattern: importlib.import_module($NAME, $CODE)
            - pattern: importlib.import_module(..., package=$CODE, ...)
            - pattern: jinja2.Template($CODE, ...)
            - pattern: jinja2.Template(..., source=$CODE, ...)
            - pattern: django.template.Template($CODE, ...)
            - pattern: django.template.Template(..., template_string=$CODE, ...)
            - pattern: mako.template.Template($CODE, ...)
            - pattern: mako.template.Template(..., text=$CODE, ...)
            - pattern: flask.render_template_string($CODE, ...)
            - pattern: flask.render_template_string(..., source=$CODE, ...)
        # from re import compile 로 가져온 compile 은 정규식 컴파일이다
        - pattern-not: re.compile(...)
        - focus-metavariable: $CODE
    # from_string(템플릿 원문): 다른 클래스에도 있는 이름이라 템플릿 환경으로 확인되는 객체만 본다
    - patterns:
        - pattern-either:
            #   Django 템플릿 엔진: engines["django"].from_string(...)
            - pattern: django.template.engines[$K].from_string(...)
            #   같은 파일에서 jinja2.Environment(...) 로 만든 객체
            - patterns:
                - pattern: $ENV.from_string(...)
                - pattern-inside: |
                    $ENV = jinja2.Environment(...)
                    ...
            #   만들자마자 호출: jinja2.Environment(...).from_string(...)
            - pattern: jinja2.Environment(...).from_string(...)
            #   또는 이름이 템플릿 환경으로 보이는 객체 (env·environment·engine·jinja… 로 끝나는 이름: app.jinja_env, self.env 등)
            - patterns:
                - pattern: $ENV.from_string(...)
                - metavariable-regex:
                    metavariable: $ENV
                    regex: (?i)^(\w+\.)*\w*(env|environment|engine|jinja\w*)$
        # 원문 자리: 첫 번째 위치 인자, 또는 키워드(source=·template_code= — 엔진마다 이름이 다르다).
        # 키워드는 템플릿 변수 자리(globals)만 빼고 모두 원문으로 본다
        - pattern-either:
            - pattern: $O.from_string($CODE, ...)
            - patterns:
                - pattern: $O.from_string(..., $KW=$CODE, ...)
                - metavariable-regex:
                    metavariable: $KW
                    regex: ^(?!globals$)
        - focus-metavariable: $CODE
