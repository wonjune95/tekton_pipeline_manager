rules:
- id: mois-1-12-ssrf-js
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] 서버사이드 요청 위조: 외부 입력이 서버가 요청할 주소(axios·fetch·http.request·got 등)에 사용됨 — 요청할 호스트를 허용 목록으로 검증하거나, \"https://고정호스트/\" 처럼 스킴·호스트를 고정한 주소의 경로에만 입력을 덧붙일 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-12"
    mois-item: "서버사이드 요청 위조"
    cwe: "CWE-918"
    gate: block
  # 참고: semgrep-rules javascript/express/security/audit/express-ssrf.yaml
  options:
    go_deeper_stmt: false
  pattern-sources:
    # (A) 서버 요청 값 (정규식은 가지마다 따로 건다 — 한 묶음에서 일부 가지에만 있는 메타변수에 걸면 나머지 가지가 무효가 된다)
    - patterns:
        - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|params|cookies|signedCookies|headers|originalUrl|url|path|hostname|files|file)$
    - patterns:
        - pattern: $REQ.$GET(...)
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $GET
            regex: ^(get|header|param)$
    - pattern: ctx.query
    - pattern: ctx.params
    - pattern: ctx.headers
    - pattern: ctx.cookies.get(...)
    - patterns:
        - pattern: ctx.request.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|headers|files|url|path)$
    # (A-2) 요청 객체를 구조분해한 핸들러 매개변수: ({ params, query, body }: Request, res) => …  (두 번째 매개변수가 res·response·reply 일 때만)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                ({..., $K, ...}, $RES, ...) => { ... }
            - pattern-inside: |
                ({..., $K, ...}: $T, $RES, ...) => { ... }
            - pattern-inside: |
                function ({..., $K, ...}, $RES, ...) { ... }
            - pattern-inside: |
                function $FN({..., $K, ...}, $RES, ...) { ... }
        - metavariable-regex:
            metavariable: $K
            regex: ^(query|body|params|cookies|headers|files|file)$
        - metavariable-regex:
            metavariable: $RES
            regex: ^(res|response|reply)$
        - pattern: $K
    # (B) NestJS 컨트롤러 매개변수 (숫자 변환 파이프 ParseIntPipe·ParseFloatPipe·ParseBoolPipe·ParseUUIDPipe 를 준 것은 제외)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                $M(..., @$D(...) $P: $T, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P: $T, ...) { ... }
        - metavariable-regex:
            metavariable: $D
            regex: ^(Query|Body|Param|Headers|Req|Request)$
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern-inside: |
                      $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
              - metavariable-regex:
                  metavariable: $PIPE
                  regex: ^Parse(Int|Float|Bool|UUID|Enum)Pipe$
        - focus-metavariable: $P
    # (C) 브라우저 입력
    - patterns:
        - pattern-either:
            - pattern: location.$LOC
            - pattern: window.location.$LOC
            - pattern: document.location.$LOC
        - metavariable-regex:
            metavariable: $LOC
            regex: ^(href|search|hash|pathname)$
    - pattern: document.URL
    - pattern: document.documentURI
    - pattern: document.referrer
    - pattern: window.name
    - patterns:
        - pattern-inside: |
            $W.addEventListener("message", ($E) => { ... })
        - pattern: $E.data
    # Angular ActivatedRoute: this.route.snapshot.queryParams.q · .params · .paramMap.get(...) · .fragment
    - patterns:
        - pattern: $R.snapshot.$P
        - metavariable-regex:
            metavariable: $P
            regex: ^(queryParams|params|queryParamMap|paramMap|fragment)$
    - pattern: useParams()
    - pattern: useSearchParams()
    - pattern: useLocation()
    - pattern: useRouter().query
    - patterns:
        - pattern-inside: |
            $R = useRouter();
            ...
        - pattern: $R.query
  pattern-sanitizers:
    # ── 공통 sanitizer (JS) — 규칙 파일마다 같은 내용. 가지별 증명은 mois-1-05-os-command-injection-js fixture 에서 한다 ──
    # (공통 1) 숫자 변환 결과: parseInt(x) · parseFloat(x) · Number(x) · Number.parseInt(x) · Number.parseFloat(x)
    - patterns:
        - pattern-either:
            - pattern: parseInt(...)
            - pattern: parseFloat(...)
            - pattern: Number(...)
            - pattern: Number.parseInt(...)
            - pattern: Number.parseFloat(...)
    # (공통 2) 허용 목록 검사 — 실패 시 중단 (규약 §1 v2): if (!ALLOWED.includes(x)) { …; return; } 뒤의 x
    #   ALLOWED 는 같은 파일에 const 로 선언한 문자열·숫자 리터럴 배열(또는 new Set([...]))이어야 하고, 선언 뒤 최상위 문장이나
    #   같은 블록에서 push·add·splice 등으로 바꾸지 않아야 한다 (다른 함수 안의 변경은 보지 못한다 — 한계).
    #   조건식은 검사 하나, 또는 null 검사와 || 로 묶은 것만 인정한다 (&&·!(…)·?: 로 감싸면 불인정).
    #   실패 분기 안에서 쓰는 것, 검사 뒤 재대입·덧붙임(같은 블록과 한 단계 안쪽)은 인정하지 않는다.
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if ($COND) { ... return ...; }
                ...
            - pattern-inside: |
                if ($COND) { ... throw $E; }
                ...
            - pattern-inside: |
                if ($COND) return ...;
                ...
            - pattern-inside: |
                if ($COND) throw $E;
                ...
        - pattern-inside: |
            const $ALLOW = $LIT;
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^(?:new\s+Set\(\s*)?\[\s*(?:(?:"[^"\\\n]*"|''[^''\\\n]*''|-?\d+)\s*(?:,\s*)?)*\](?:\s*\))?$'
        - metavariable-pattern:
            metavariable: $COND
            pattern-either:
              - pattern: '!$ALLOW.includes($X)'
              - pattern: '!$ALLOW.has($X)'
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:!?\s*[\w$.]+(?:\s*[!=]==?\s*(?:null|undefined))?\s*\|\|\s*)*!\s*[\w$]+\.(?:includes|has)\(\s*[\w$.]+\s*\)(?:\s*\|\|\s*!?\s*[\w$.]+(?:\s*[!=]==?\s*(?:null|undefined))?)*$'
        - pattern-not-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $X = $V;
            ...
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $X += $V;
            ...
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern: |
                      const $ALLOW = $LIT;
                      ...
                      $ALLOW.$MUT(...);
                      ...
                  - pattern: |
                      $ALLOW.$MUT(...);
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(push|unshift|splice|fill|copyWithin|add|delete|clear|pop|shift)$
        - pattern-not-inside: |
            const $ALLOW = $LIT;
            ...
            $ALLOW[$I] = $V;
            ...
        - pattern-not-inside: |
            $ALLOW[$I] = $V;
            ...
        - pattern: $X
    # (공통 3) 형식 검사 — 실패 시 중단: if (!/^[a-z0-9_-]+$/.test(x)) return …; · if (!Number.isInteger(x)) throw …; 뒤의 x
    #   정규식은 조건에 바로 적은 리터럴이고 ^…$ 로 전체를 고정하며, 글자 묶음이 영문·숫자·_·- 뿐이어야 한다 (. / \ 공백·따옴표 불가)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if ($COND) { ... return ...; }
                ...
            - pattern-inside: |
                if ($COND) { ... throw $E; }
                ...
            - pattern-inside: |
                if ($COND) return ...;
                ...
            - pattern-inside: |
                if ($COND) throw $E;
                ...
        - metavariable-pattern:
            metavariable: $COND
            pattern-either:
              - pattern: '!$RE.test($X)'
              - pattern: '!Number.isInteger($X)'
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:!?\s*[\w$.]+(?:\s*[!=]==?\s*(?:null|undefined))?\s*\|\|\s*)*!\s*(?:/\^(?:(?:\[(?:[A-Za-z0-9_]|\\[wd]|\\?-)+\]|\\[wd]|[A-Za-z0-9_])(?:[+*?]|\{\d+(?:,\d*)?\})?)+\$/[gimsuy]*\.test|Number\.isInteger)\(\s*[\w$.]+\s*\)(?:\s*\|\|\s*!?\s*[\w$.]+(?:\s*[!=]==?\s*(?:null|undefined))?)*$'
        - pattern-not-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $X = $V;
            ...
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $X += $V;
            ...
        - pattern: $X
    # (공통 4) 조건 안에서만 사용: if (ALLOWED.includes(x)) { use(x) } — else 없는 if, 조건은 검사 하나뿐 (&&·|| 로 묶으면 불인정)
    - patterns:
        - pattern-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S; else $S2;
        - pattern-inside: |
            const $ALLOW = $LIT;
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^(?:new\s+Set\(\s*)?\[\s*(?:(?:"[^"\\\n]*"|''[^''\\\n]*''|-?\d+)\s*(?:,\s*)?)*\](?:\s*\))?$'
        - metavariable-pattern:
            metavariable: $COND
            pattern-either:
              - pattern: $ALLOW.includes($X)
              - pattern: $ALLOW.has($X)
        - metavariable-regex:
            metavariable: $COND
            regex: '^[\w$]+\.(?:includes|has)\(\s*[\w$.]+\s*\)$'
        - pattern-not-inside: |
            if ($COND) { ... $X = $V; ... }
        - pattern-not-inside: |
            if ($COND) { ... $X += $V; ... }
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern: |
                      const $ALLOW = $LIT;
                      ...
                      $ALLOW.$MUT(...);
                      ...
                  - pattern: |
                      $ALLOW.$MUT(...);
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(push|unshift|splice|fill|copyWithin|add|delete|clear|pop|shift)$
        - pattern-not-inside: |
            const $ALLOW = $LIT;
            ...
            $ALLOW[$I] = $V;
            ...
        - pattern-not-inside: |
            $ALLOW[$I] = $V;
            ...
        - pattern: $X
    # (공통 5) 조건 안에서만 사용: if (/^[a-z0-9_-]+$/.test(x)) · if (Number.isInteger(x)) · if (x === "리터럴")
    - patterns:
        - pattern-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S; else $S2;
        - metavariable-pattern:
            metavariable: $COND
            pattern-either:
              - pattern: $RE.test($X)
              - pattern: Number.isInteger($X)
              - pattern: $X === $L
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:/\^(?:(?:\[(?:[A-Za-z0-9_]|\\[wd]|\\?-)+\]|\\[wd]|[A-Za-z0-9_])(?:[+*?]|\{\d+(?:,\d*)?\})?)+\$/[gimsuy]*\.test|Number\.isInteger)\(\s*[\w$.]+\s*\)|[\w$.]+\s*===\s*(?:"[^"\\\n]*"|''[^''\\\n]*''|-?\d+))$'
        - pattern-not-inside: |
            if ($COND) { ... $X = $V; ... }
        - pattern-not-inside: |
            if ($COND) { ... $X += $V; ... }
        - pattern: $X
    # 고정 접두: 문자열 리터럴(템플릿 리터럴 포함)로 시작하고 그 앞부분이 요청 대상을 고정하는 식만 인정한다
    #   (1) "/경로…" 로 시작하는 상대 경로 (같은 서버의 경로라 대상 호스트가 바뀌지 않는다). "/" 바로 뒤가 입력이면 //host 가 되므로 제외
    #   (2) "https://고정호스트/…" — 호스트가 리터럴 안에서 / ? # 로 끝나야 한다 ("https://host" + x 는 host.evil.example·host@evil 이 가능해 제외)
    #   리터럴 바로 뒤에는 + 만 올 수 있다. 식 전체가 조건식·||·&&·?? 이거나, 그 식에 메서드를 부르거나(.replace(…)·.slice(…)) 색인하면 제외
    - patterns:
        - pattern: $S
        - metavariable-regex:
            metavariable: $S
            regex: '^(?:(["''])(?:/[^/\\"''\n]|https?://[^/?#"''`\\@\s$]+[/?#])[^"''\n]*\1\s*(?:\+|$)|`(?:/[^/\\$`]|https?://[^/?#$`\\@\s]+[/?#]))'
        - pattern-not: '$C ? $A : $B'
        - pattern-not: $A || $B
        - pattern-not: $A && $B
        - pattern-not: $A ?? $B
        - pattern-not-inside: $S.$M(...)
        - pattern-not-inside: $S[$I]
        # 템플릿 리터럴은 Semgrep 이 범위를 끝까지 잡지 못해 $S.$M(...) 로 맞지 않는다 — 따로 적는다
        - pattern-not-inside: '`...`.$M(...)'
        - pattern-not-inside: '`...`[$I]'
  pattern-sinks:
    # fetch (전역 fetch · node-fetch · undici) — 첫 인자(주소 또는 Request)
    - patterns:
        - pattern-either:
            - pattern: fetch($U, ...)
            - pattern: new Request($U, ...)
        - focus-metavariable: $U
    # 그 파일에서 require·import 로 가져온 HTTP 클라이언트: axios · got · superagent · request · needle · undici · http · https
    #   모듈 자체를 부르는 형태(axios(url) · got(url) · request(url))와 메서드(axios.get · http.request · superagent.post …)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                $C = require("$M");
                ...
            - pattern-inside: |
                import * as $C from "$M";
                ...
            - pattern-inside: |
                import $C from "$M";
                ...
        - metavariable-regex:
            metavariable: $M
            regex: ^(axios|got|superagent|request|needle|undici|node-fetch|(node:)?https?)$
        - pattern-either:
            # 첫 인자가 객체 리터럴이면 아래 "옵션 객체" 가지가 주소 항목만 본다 (path·data 등 다른 항목의 입력은 주소가 아니다)
            - patterns:
                - pattern: $C($U, ...)
                - pattern-not: '$C({...}, ...)'
            - patterns:
                - pattern: $C.$FN($U, ...)
                - pattern-not: '$C.$FN({...}, ...)'
                - metavariable-regex:
                    metavariable: $FN
                    regex: ^(get|post|put|patch|delete|del|head|options|request|stream|fetch)$
            # 옵션 객체로 주소를 넘기는 형태: axios({ url }) · axios.request({ url }) · http.request({ host }) · got({ url })
            - pattern: '$C({..., url: $U, ...}, ...)'
            - patterns:
                - pattern-either:
                    - pattern: '$C.$FN({..., url: $U, ...}, ...)'
                    - pattern: '$C.$FN({..., host: $U, ...}, ...)'
                    - pattern: '$C.$FN({..., hostname: $U, ...}, ...)'
                    - pattern: '$C.$FN({..., baseURL: $U, ...}, ...)'
                    - pattern: '$C.$FN({..., prefixUrl: $U, ...}, ...)'
                - metavariable-regex:
                    metavariable: $FN
                    regex: ^(get|request|create|extend)$
        - focus-metavariable: $U
    # 이름을 골라 가져온 함수: import { request } from "undici" · const { get } = require("https")
    - patterns:
        - pattern-either:
            - pattern-inside: |
                const {..., $FN: $LOCAL, ...} = require("$M");
                ...
            - pattern-inside: |
                import { $FN as $LOCAL } from "$M";
                ...
            - pattern-inside: |
                $LOCAL = require("$M").$FN;
                ...
        - metavariable-regex:
            metavariable: $M
            regex: ^(undici|(node:)?https?)$
        - metavariable-regex:
            metavariable: $FN
            regex: ^(get|request|fetch|stream)$
        - pattern: $LOCAL($U, ...)
        - focus-metavariable: $U
    - patterns:
        - pattern-inside: |
            import { $FN } from "$M";
            ...
        - metavariable-regex:
            metavariable: $M
            regex: ^(undici|(node:)?https?)$
        - metavariable-regex:
            metavariable: $FN
            regex: ^(get|request|fetch|stream)$
        - pattern: $FN($U, ...)
        - focus-metavariable: $U
