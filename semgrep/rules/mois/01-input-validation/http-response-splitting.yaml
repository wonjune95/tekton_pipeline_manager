rules:
- id: mois-1-13-http-response-splitting
  mode: taint
  languages: [java]
  severity: WARNING
  message: "[행안부 입력데이터 검증 및 표현] HTTP 응답분할: 외부 입력이 개행 문자(CR·LF) 제거 없이 응답 헤더·쿠키에 사용됨"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-13"
    mois-item: "HTTP 응답분할"
    cwe: "CWE-113"
    gate: warn
  pattern-sources:
    - patterns:
        - pattern-either:
            - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GET(...)
            - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GET(...)
        - metavariable-regex:
            metavariable: $GET
            regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getRequestURI|getRequestURL|getPathInfo|getCookies|getInputStream|getReader|getPart|getParts)$
    - pattern: (javax.servlet.http.Cookie $CK).getValue()
    - pattern: (jakarta.servlet.http.Cookie $CK).getValue()
    # 요청을 감싼 표준 객체: Spring 멀티파트·WebRequest, cos MultipartRequest, 업로드 파일의 원본 이름
    - patterns:
        - pattern-either:
            - pattern: (org.springframework.web.multipart.MultipartHttpServletRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.multipart.MultipartRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.context.request.WebRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.context.request.NativeWebRequest $REQ).$GET(...)
            - pattern: (com.oreilly.servlet.MultipartRequest $REQ).$GET(...)
            - pattern: (javax.servlet.ServletRequest $REQ).$GET(...)
            - pattern: (jakarta.servlet.ServletRequest $REQ).$GET(...)
        - metavariable-regex:
            metavariable: $GET
            regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaderValues|getHeaderNames|getFilesystemName|getOriginalFileName|getFileNames|getInputStream|getReader)$
    - pattern: (org.springframework.web.multipart.MultipartFile $MF).getOriginalFilename()
    - patterns:
        - pattern-either:
            - pattern: $RET $M(..., @$A(...) $T $P, ...) { ... }
            - pattern: $RET $M(..., @$A $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $A
            regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|ModelAttribute|MatrixVariable)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|Integer|Long|Short|Byte|Double|Float|Boolean|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime)$).*
        - focus-metavariable: $P
    # Spring MVC 는 애너테이션이 없는 핸들러 매개변수도 요청 값으로 채운다 (단순형은 요청 파라미터, 객체는 폼 바인딩).
    # 숫자·날짜형과 프레임워크가 넣어 주는 객체(요청·응답·세션·모델 등), 요청과 무관한 애너테이션은 제외
    - patterns:
        - pattern-either:
            - pattern: |
                @$MAP(...)
                $RET $M(..., $T $P, ...) { ... }
            - pattern: |
                @$MAP
                $RET $M(..., $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $MAP
            regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|ModelAndView|Map|BindingResult|Errors|Locale|TimeZone|Principal|Authentication|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort|WebRequest|NativeWebRequest|InputStream|OutputStream|Reader|Writer|HttpMethod)\b).*
        # 애너테이션이 붙은 매개변수는 여기서 보지 않는다. 요청 바인딩 애너테이션은 위 항목, 검증 애너테이션은 아래 항목이 본다.
        # 그 밖의 애너테이션(@AuthenticationPrincipal, 직접 만든 @CurrentUser 등)은 요청 값이 아니라 프레임워크·리졸버가 넣는 값이다
        - pattern-not: $RET $M(..., @$ANN(...) $T $P, ...) { ... }
        - focus-metavariable: $P
    # 검증 애너테이션만 붙은 핸들러 매개변수(@Valid MemberForm form)도 요청 값으로 채워진다
    - patterns:
        - pattern: |
            @$MAP(...)
            $RET $M(..., @$VA(...) $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $MAP
            regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
        - metavariable-regex:
            metavariable: $VA
            regex: ^(Valid|Validated|NotNull|NotBlank|NotEmpty|Size|Pattern|Length|Email|Nullable|NonNull)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|ModelAndView|Map|BindingResult|Errors|Locale|TimeZone|Principal|Authentication|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort|WebRequest|NativeWebRequest|InputStream|OutputStream|Reader|Writer|HttpMethod)\b).*
        - focus-metavariable: $P
  pattern-sanitizers:
    # 전자정부 표준프레임워크의 보안 유틸(EgovWebUtil). 프로젝트가 패키지를 옮겨 쓰는 경우를 위해 짧은 이름도 본다
    - pattern: egovframework.com.cmm.EgovWebUtil.removeCRLF(...)
    - pattern: EgovWebUtil.removeCRLF(...)
    # CR·LF 를 둘 다 지우는 것이 리터럴로 보이는 치환만 인정한다 (docs/rule-conventions.md §2 "문자 제거").
    # \r\n 쌍만 지우거나 한쪽만 지우는 치환, 그 밖의 replace·replaceAll 은 인정하지 않는다.
    # Semgrep 은 Java 문자열을 소스에 적힌 글자 그대로 묶는다: "\r" 은 역슬래시 1개(CR 문자), "\\r" 은 2개(정규식 \r), "\\\\r" 은 4개(역슬래시와 r 두 글자).
    # 바꿔 넣는 문자열은 역슬래시와 $ 가 없는 리터럴이어야 한다: replaceAll("\\R", "\n") 은 개행을 다시 넣고, "$1" 은 지운 글자를 되돌린다.
    # (1) replaceAll("[\\r\\n]", "") — \r 과 \n 이 모두 든 문자 클래스, \r|\n, \R, \s
    #     문자 클래스 안은 \r \n \t \f 와 보통 글자만 본다 ("[\\\\r\\\\n]" 은 역슬래시·r·n 을 지우고, && 교집합은 아무것도 안 지울 수 있다).
    #     \R · \s 는 역슬래시 2개만 ("\s" 는 Java 15 부터 공백 한 글자다)
    - patterns:
        - pattern: $X.replaceAll("$RE", "$TO")
        - metavariable-regex:
            metavariable: $RE
            regex: ^(\[(?!\^)(?=[^\]]*\\{1,2}r)(?=[^\]]*\\{1,2}n)(\\{1,2}[rntf]|[^\]\\&])*\]|\(?(\\{1,2}r\\{1,2}n\|)?(\\{1,2}r\|\\{1,2}n|\\{1,2}n\|\\{1,2}r)\)?|\\\\[Rs])[+*]?$
        - metavariable-regex:
            metavariable: $TO
            regex: ^[^\\$]*$
    # (2) replace("\r", "").replace("\n", "") — 둘을 이어서 각각 지움.
    #     replace 는 정규식이 아니므로 역슬래시 1개("\r" = CR 문자)만 인정한다. replace("\\r", "") 는 역슬래시와 r 두 글자를 지운다
    - patterns:
        - pattern-either:
            - pattern: $X.replace("$CR", "$TO1").replace("$LF", "$TO2")
            - pattern: $X.replace("$LF", "$TO1").replace("$CR", "$TO2")
        - metavariable-regex:
            metavariable: $CR
            regex: ^\\r$
        - metavariable-regex:
            metavariable: $LF
            regex: ^\\n$
        - metavariable-regex:
            metavariable: $TO1
            regex: ^[^\\$]*$
        - metavariable-regex:
            metavariable: $TO2
            regex: ^[^\\$]*$
    # (3) replaceAll("\\r", "").replaceAll("\\n", "") — replaceAll 은 정규식이므로 역슬래시 1개(CR 문자)와 2개(정규식 \r) 모두 CR 이다
    - patterns:
        - pattern-either:
            - pattern: $X.replaceAll("$CR", "$TO1").replaceAll("$LF", "$TO2")
            - pattern: $X.replaceAll("$LF", "$TO1").replaceAll("$CR", "$TO2")
        - metavariable-regex:
            metavariable: $CR
            regex: ^\\{1,2}r$
        - metavariable-regex:
            metavariable: $LF
            regex: ^\\{1,2}n$
        - metavariable-regex:
            metavariable: $TO1
            regex: ^[^\\$]*$
        - metavariable-regex:
            metavariable: $TO2
            regex: ^[^\\$]*$
    - pattern: java.net.URLEncoder.encode(...)
    - pattern: org.springframework.web.util.UriUtils.encode(...)
    - pattern: Integer.parseInt(...)
    - pattern: Long.parseLong(...)
  pattern-propagators:
    - pattern: $SB.append($X)
      from: $X
      to: $SB
    # 컬렉션에 넣은 값은 컬렉션 전체를 오염시킨다 (요소 단위로는 구분하지 못한다)
    - pattern: $COL.add($X)
      from: $X
      to: $COL
    - pattern: $COL.add($IDX, $X)
      from: $X
      to: $COL
    - pattern: $COL.put($KEY, $X)
      from: $X
      to: $COL
    - pattern: $COL.addAll($X)
      from: $X
      to: $COL
  pattern-sinks:
    - patterns:
        - pattern-either:
            - pattern: (javax.servlet.http.HttpServletResponse $R).setHeader($N, $V)
            - pattern: (javax.servlet.http.HttpServletResponse $R).addHeader($N, $V)
            - pattern: (jakarta.servlet.http.HttpServletResponse $R).setHeader($N, $V)
            - pattern: (jakarta.servlet.http.HttpServletResponse $R).addHeader($N, $V)
            - pattern: new javax.servlet.http.Cookie($N, $V)
            - pattern: new jakarta.servlet.http.Cookie($N, $V)
            - pattern: (javax.servlet.http.Cookie $C).setValue($V)
            - pattern: (jakarta.servlet.http.Cookie $C).setValue($V)
            - pattern: (org.springframework.http.HttpHeaders $H).add($N, $V)
            - pattern: (org.springframework.http.HttpHeaders $H).set($N, $V)
        - focus-metavariable: $V
    # 헤더 이름 자리에 들어간 입력도 응답을 나눈다: response.setHeader(request.getParameter("name"), "1")
    # (쿠키 이름은 Cookie 생성자가 허용 문자만 받으므로 보지 않는다)
    - patterns:
        - pattern-either:
            - pattern: (javax.servlet.http.HttpServletResponse $R).$SET($N, $V)
            - pattern: (jakarta.servlet.http.HttpServletResponse $R).$SET($N, $V)
        - metavariable-regex:
            metavariable: $SET
            regex: ^(setHeader|addHeader)$
        - focus-metavariable: $N
    - patterns:
        - pattern-either:
            - pattern: (org.springframework.http.HttpHeaders $H).add($N, $V)
            - pattern: (org.springframework.http.HttpHeaders $H).set($N, $V)
        - focus-metavariable: $N
