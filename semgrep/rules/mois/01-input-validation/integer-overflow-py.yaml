rules:
- id: mois-1-14-integer-overflow-py
  mode: taint
  languages: [python]
  severity: WARNING
  message: "[행안부 입력데이터 검증 및 표현] 정수형 오버플로우: 외부 입력값을 범위 검사 없이 고정 폭 정수형(numpy·ctypes·struct)으로 바꾸거나 크기·반복 횟수로 사용함 — 상한을 넘으면 중단하도록 검사한 뒤 사용할 것 (FastAPI 는 Query(ge=, le=))"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-14"
    mois-item: "정수형 오버플로우"
    cwe: "CWE-190"
    gate: warn
  # Python int 는 자릿수 제한이 없어 연산 자체는 넘치지 않는다. 고정 폭으로 바꾸는 곳과 크기로 쓰는 곳만 본다.
  # guard sanitizer(규약 §1 v2)가 '분기의 마지막 문장이 return·raise' 일 때만 중단으로 보게 한다
  options:
    go_deeper_stmt: false
  pattern-sources:
    # (A) 요청 객체의 값. 이름이 request·req 인 객체, flask.request(별칭 import 포함), 타입이 Request·WebSocket 으로 적힌 매개변수
    - patterns:
        - pattern-either:
            - patterns:
                - pattern: $REQ.$ATTR
                - metavariable-regex:
                    metavariable: $REQ
                    regex: ^(request|req|self\.request)$
            - pattern: flask.request.$ATTR
            - patterns:
                - pattern-inside: |
                    def $F(..., $REQ: $RT, ...):
                      ...
                - metavariable-regex:
                    metavariable: $RT
                    regex: ^(\w+\.)*(Request|HttpRequest|WebSocket|HTTPConnection)$
                - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|json|files|view_args|get_json|get_data|query_string|stream|url|path|full_path|get_full_path|read|readline|readlines|referrer|environ|user_agent|authorization|content_type|mimetype|resolver_match|receive_text|receive_json|receive_bytes|receive|iter_text|iter_json|iter_bytes)$
    # Django 클래스 뷰의 URL 인자
    - pattern: self.kwargs
    # (B) 라우트 함수 매개변수 — 타입 표기 없음. 의존성(= Depends(...)·Security(...))만 제외한다
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - pattern-not-inside: |
          def $F(..., $P: $T, ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Security(...), ...):
            ...
      - focus-metavariable: $P
    # (B) 라우트 함수 매개변수 — 타입 표기 있음. 문자열을 실을 수 없는 타입(끝까지 일치), 프레임워크 타입, 의존성만 제외한다.
    #     의존성은 Depends·Security 가 보이거나, FastAPI 문서의 별칭 이름(…Dep·Current…User)이거나, 같은 파일에서 별칭으로 정의한 타입일 때만 인정한다.
    #     타입 이름이 …Config·…Client·…Settings 라는 것만으로는 제외하지 않는다 (요청 본문 모델일 수 있다)
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)(?!((\w+\.)*(Request|HttpRequest|Response|WebSocket|BackgroundTasks|Session|AsyncSession|HTTPConnection|SecurityScopes))$)(?!\w*(Dep|Deps|Dependency)$)(?!Current\w*(User|Account|Member|Principal|Admin)\w*$)(?!Annotated\[.*\b(Depends|Security)\()'
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Security(...), ...):
            ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Depends(...)]
          ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Security(...)]
          ...
      - focus-metavariable: $P
    # 의존성으로 주입돼도 요청 값인 것: 문자열·바이트(토큰·헤더 값)와 fastapi.security 의 폼·자격증명 객체
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(Annotated\[\s*)?(str|bytes|OAuth2PasswordRequestForm|OAuth2PasswordRequestFormStrict|HTTPBasicCredentials|HTTPAuthorizationCredentials)\s*(\|\s*None\s*)?(,.*\])?$'
      - focus-metavariable: $P
    # 인자 없는 Depends(): 그 타입을 요청 값으로 만들어 넣는다 (쿼리·폼 모델). 서비스·저장소로 보이는 이름만 제외
    - patterns:
        - pattern-either:
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: $T = fastapi.Depends(), ...):
                  ...
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: typing.Annotated[$T, fastapi.Depends()], ...):
                  ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
        - metavariable-regex:
            metavariable: $T
            regex: '^(?!(Annotated\[\s*)?(\w+\.)*\w*(Service|Repository|Repo|Client|Manager|Session|UseCase|Handler|Factory|Provider|Settings|Config)\s*(,.*\])?$)'
        - focus-metavariable: $P
    # Flask 는 함수의 타입 표기를 검사하지 않는다: 경로에 변환기 없는 자리(<name>, <string:…>, <path:…>)가 있으면 숫자 표기여도 문자열이다
    - patterns:
        - pattern-inside: |
            @$APP.$METHOD("$PATH", ...)
            def $F(..., $P: $T, ...):
              ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|route)$
        - metavariable-regex:
            metavariable: $PATH
            regex: .*<((string|path|any)[^:>]*:)?\w+>
        - metavariable-regex:
            metavariable: $T
            regex: '^((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$'
        - focus-metavariable: $P
    # 요청 값이라고 선언한 매개변수는 라우트 함수가 아니어도(의존성 함수) 입력이다: x: str = Header(), x = Query(None), Annotated[str, Form()]
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    # 타입 표기가 없는 것만 (def f(x=Query())). 표기가 있으면 아래 가지가 숫자형을 거른다
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P=$Q(...), ...):
                              ...
                        - pattern-not-inside: |
                            def $F(..., $P: $T2 = $Q(...), ...):
                              ...
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P: $T = $Q(...), ...):
                              ...
                        - metavariable-regex:
                            metavariable: $T
                            regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)'
                - metavariable-regex:
                    metavariable: $Q
                    regex: ^(fastapi\.)?(Query|Header|Cookie|Form|Body|File|Path)$
            - patterns:
                - pattern-inside: |
                    def $F(..., $P: $T, ...):
                      ...
                - metavariable-regex:
                    metavariable: $T
                    regex: '^Annotated\[\s*(?!(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\b)[^,]*,.*\b(Query|Header|Cookie|Form|Body|File|Path)\('
        - focus-metavariable: $P
    # Django 뷰의 URL 인자: 첫 매개변수가 request 인 함수·메서드의 나머지 매개변수 (URLconf 의 <str:…>·<path:…>·정규식 그룹).
    # 변환기는 urls.py 에 있어 볼 수 없으므로 숫자 타입 표기가 있는 것만 제외한다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                def $F(request, ..., $P, ...):
                  ...
            - pattern-inside: |
                def $F(self, request, ..., $P, ...):
                  ...
        - pattern-not-inside: |
            def $F(..., $P: $T, ...):
              ...
        - pattern-not-inside: |
            def $F(..., *$P, ...):
              ...
        - pattern-not-inside: |
            def $F(..., **$P, ...):
              ...
        - focus-metavariable: $P
    # 정수형 라우트 매개변수 — 공통 블록은 삽입 계열을 위해 숫자형을 빼므로 이 항목에서만 더한다 (le·lt 상한이 있으면 제외)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: int, ...):
                  ...
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: Annotated[int, ...], ...):
                  ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
        - pattern-not-inside: |
            def $F(..., $P: int = $Q(..., le=$MAX, ...), ...):
              ...
        - pattern-not-inside: |
            def $F(..., $P: int = $Q(..., lt=$MAX, ...), ...):
              ...
        - pattern-not-inside: |
            def $F(..., $P: Annotated[int, ..., $Q(..., le=$MAX, ...), ...], ...):
              ...
        - pattern-not-inside: |
            def $F(..., $P: Annotated[int, ..., $Q(..., lt=$MAX, ...), ...], ...):
              ...
        - focus-metavariable: $P
  pattern-sanitizers:
    # 범위 검사는 '상한을 넘으면 중단' 하거나 '상한 아래일 때만 사용' 하는 guard 일 때만 인정한다 (규약 §1 v2).
    # 비교식이 있기만 한 경우, 하한만 검사한 경우(n < 0), 실패해도 계속 진행하는 경우, 반대 분기에서 쓰는 경우는 탐지된다.
    #   - 상한($Y)은 요청에서 올 수 없는 값이어야 한다: 숫자 리터럴(1024 * 1024 · 2**31 - 1), 대문자 상수(MAX_SIZE · settings.MAX_ITEMS), len(이름).
    #     소문자 변수·속성·호출 결과는 요청에서 받은 값일 수 있어 인정하지 않는다 (if n > limit: … 에서 limit 도 입력이면 상한이 아니다).
    #   - 검사식을 감싸는 식은 or(실패 시 중단) / and(조건 안 사용) 뿐이어야 한다. not (…) · & · | · == False · 호출 인자 · 조건식 안에 들어 있으면
    #     "상한 초과 = 중단" 이 아니다. $WRAP 은 검사식을 품은 모든 식(자신 포함)에 맞는다.
    #   - 종료 함수는 import 로 확인되는 flask.abort · sys.exit 만 본다 (내장 exit()·quit() · 이름만 abort 인 함수는 종료로 보지 않는다).
    # (1) 실패 시 중단: if n < 0 or n > MAX: return … / if not 0 <= n <= MAX: raise … 뒤에 오는 n.
    #     실패 분기 안에서 사용 · 안쪽 조건부 return · 검사 뒤 재대입(=, +=, 튜플 풀기)은 인정하지 않는다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    return ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    raise ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    continue
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    flask.abort(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    sys.exit(...)
                ...
        # 안쪽 patterns: 상한($Y)의 정규식은 metavariable-pattern 밖에서 건다 (안에 두면 괄호 친 수신 객체가 있는 조건에서 Semgrep 내부 오류)
        - patterns:
            - pattern-inside: |
                if $COND:
                    ...
                ...
            - metavariable-pattern:
                metavariable: $COND
                patterns:
                  - pattern-either:
                      - pattern: $X > $Y
                      - pattern: $X >= $Y
                      - pattern: $Y < $X
                      - pattern: $Y <= $X
                      - pattern: not $A < $X < $Y
                      - pattern: not $A < $X <= $Y
                      - pattern: not $A <= $X < $Y
                      - pattern: not $A <= $X <= $Y
                  - pattern-not-inside:
                      patterns:
                        - pattern: $WRAP
                        - pattern-not: $OR1 or $OR2
                        - pattern-not: $X > $Y
                        - pattern-not: $X >= $Y
                        - pattern-not: $Y < $X
                        - pattern-not: $Y <= $X
                        - pattern-not: not $A < $X < $Y
                        - pattern-not: not $A < $X <= $Y
                        - pattern-not: not $A <= $X < $Y
                        - pattern-not: not $A <= $X <= $Y
        - metavariable-regex:
            metavariable: $Y
            regex: '^(?:[\d_]+(?:\s*[*+<-]{1,2}\s*[\d_]+)*|(?:[\w.]+\.)?[A-Z][A-Z0-9_]*|len\([\w.]+\))\z'
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            (..., $X, ...) = $V
            ...
        - pattern: $X
    # (2) 조건 안에서만 사용: if n <= MAX: … / if 0 <= n <= MAX: … / if n >= 0 and n <= MAX: …
    #     else 가 있거나, 조건식 안에서 쓰거나(검사보다 먼저 실행될 수 있다), 본문에서 다시 대입하면(=, +=, 튜플 풀기) 인정하지 않는다
    - patterns:
        # 안쪽 patterns: 상한($Y)의 정규식은 metavariable-pattern 밖에서 건다 (안에 두면 괄호 친 수신 객체가 있는 조건에서 Semgrep 내부 오류)
        - patterns:
            - pattern-inside: |
                if $COND:
                    ...
            - metavariable-pattern:
                metavariable: $COND
                patterns:
                  - pattern-either:
                      - pattern: $X < $Y
                      - pattern: $X <= $Y
                      - pattern: $Y > $X
                      - pattern: $Y >= $X
                      - pattern: $A < $X < $Y
                      - pattern: $A < $X <= $Y
                      - pattern: $A <= $X < $Y
                      - pattern: $A <= $X <= $Y
                  - pattern-not-inside:
                      patterns:
                        - pattern: $WRAP
                        - pattern-not: $AND1 and $AND2
                        - pattern-not: $X < $Y
                        - pattern-not: $X <= $Y
                        - pattern-not: $Y > $X
                        - pattern-not: $Y >= $X
                        - pattern-not: $A < $X < $Y
                        - pattern-not: $A < $X <= $Y
                        - pattern-not: $A <= $X < $Y
                        - pattern-not: $A <= $X <= $Y
        - metavariable-regex:
            metavariable: $Y
            regex: '^(?:[\d_]+(?:\s*[*+<-]{1,2}\s*[\d_]+)*|(?:[\w.]+\.)?[A-Z][A-Z0-9_]*|len\([\w.]+\))\z'
        - pattern-not-inside: $COND
        - pattern-not-inside: |
            if $COND:
                ...
            else:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
                $X = $V
                ...
        - pattern-not-inside: |
            if $COND:
                ...
                $X += $V
                ...
        - pattern-not-inside: |
            if $COND:
                ...
                (..., $X, ...) = $V
                ...
        - pattern: $X
    # 상한을 정하는 함수 (반환값을 써야 한다). 상한 인자는 위와 같이 요청에서 올 수 없는 값이어야 한다:
    #   min(a, b) 의 두 값이 모두 입력이거나 numpy.clip(n, 0, None) 처럼 상한이 없으면 걸러지지 않는다
    - patterns:
        - pattern-either:
            - pattern: min($N, $Y)
            - pattern: min($Y, $N)
            - pattern: numpy.clip($N, $LO, $Y)
        - metavariable-regex:
            metavariable: $Y
            regex: '^(?:[\d_]+(?:\s*[*+<-]{1,2}\s*[\d_]+)*|(?:[\w.]+\.)?[A-Z][A-Z0-9_]*|len\([\w.]+\))\z'
    # (공통 1) 모듈 수준에서 문자열·숫자 값만 든 리터럴로 정의한 dict 에서 꺼낸 값은 외부 입력이 아니다: TABLE[key], TABLE.get(key)
    #          인정하지 않는 것: 값에 변수·호출이 든 dict, 함수 안에서 만든 dict, 다른 모듈의 dict, get(key, 입력),
    #          쓰는 함수 안에서 바뀌는 dict (TABLE[k] = v, TABLE.update(...), TABLE.setdefault(...), TABLE |= ..., TABLE = ...)
    - patterns:
        - pattern-either:
            - pattern: $ALLOW[$K]
            - pattern: $ALLOW.get($K)
            - pattern: $ALLOW.get($K, None)
            - pattern: $ALLOW.get($K, "...")
        - pattern-inside: |
            $ALLOW = $LIT
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^\{\s*(?:(?:"[^"\n]*"|''[^''\n]*'')\s*:\s*(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)+\}$'
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW = $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW |= $V2
                ...
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  def $FM(...):
                      ...
                      $ALLOW.$MUT(...)
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(update|setdefault)$
    # (공통 4) Django ORM 조회 결과는 요청 값이 아니라 DB 에 저장된 값이다: Model.objects.get(pk=입력), get_object_or_404(Model, pk=입력)
    #          exact — 조회 호출(또는 그 결과를 받는 대입문)만 깨끗하게 본다. 대입문 안에 SQL 원문을 받는 raw()·extra()·RawSQL 이 있으면
    #          인정하지 않는다 (그 안의 SQL 삽입은 SQL 규칙이 잡아야 한다)
    - patterns:
        - pattern-either:
            - pattern: $M.objects.$Q(...)
            - pattern: django.shortcuts.get_object_or_404(...)
            - pattern: django.shortcuts.get_list_or_404(...)
