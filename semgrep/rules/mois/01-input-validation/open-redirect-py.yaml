#   sink:   block 규칙과 같되 FastAPI·Starlette 의 RedirectResponse 는 뺐다 (그 Request 에는 path·full_path·get_full_path() 가 없다)
#   sanitizer: 이 문제에 대해 확실한 것만 둔다 — 고정 접두, reverse()/url_for() 결과, Django url_has_allowed_host_and_scheme guard.
