rules:
- id: mois-1-07-open-redirect-py
  mode: taint
  languages: [python]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] 신뢰되지 않는 URL 주소로 자동접속 연결: 외부 입력 URL 로 검증 없이 리다이렉트함 — 허용 목록에서 고르거나 고정된 상대 경로만 쓰고, Django 는 url_has_allowed_host_and_scheme 로 호스트를 확인해 실패하면 이동하지 말 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-7"
    mois-item: "신뢰되지 않는 URL 주소로 자동접속 연결"
    cwe: "CWE-601"
    gate: block
  # guard sanitizer(규약 §1 v2)가 '분기의 마지막 문장이 return·raise' 일 때만 중단으로 보게 한다
  options:
    go_deeper_stmt: false
  pattern-sources:
    # (A) 요청 객체의 값. 이름이 request·req 인 객체, flask.request(별칭 import 포함), 타입이 Request·WebSocket 으로 적힌 매개변수
    - patterns:
        - pattern-either:
            - patterns:
                - pattern: $REQ.$ATTR
                - metavariable-regex:
                    metavariable: $REQ
                    regex: ^(request|req|self\.request)$
            - pattern: flask.request.$ATTR
            - patterns:
                - pattern-inside: |
                    def $F(..., $REQ: $RT, ...):
                      ...
                - metavariable-regex:
                    metavariable: $RT
                    regex: ^(\w+\.)*(Request|HttpRequest|WebSocket|HTTPConnection)$
                - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|json|files|view_args|get_json|get_data|query_string|stream|url|path|full_path|get_full_path|read|readline|readlines|referrer|environ|user_agent|authorization|content_type|mimetype|resolver_match|receive_text|receive_json|receive_bytes|receive|iter_text|iter_json|iter_bytes)$
    # Django 클래스 뷰의 URL 인자
    - pattern: self.kwargs
    # (B) 라우트 함수 매개변수 — 타입 표기 없음. 의존성(= Depends(...)·Security(...))만 제외한다
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - pattern-not-inside: |
          def $F(..., $P: $T, ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Security(...), ...):
            ...
      - focus-metavariable: $P
    # (B) 라우트 함수 매개변수 — 타입 표기 있음. 문자열을 실을 수 없는 타입(끝까지 일치), 프레임워크 타입, 의존성만 제외한다.
    #     의존성은 Depends·Security 가 보이거나, FastAPI 문서의 별칭 이름(…Dep·Current…User)이거나, 같은 파일에서 별칭으로 정의한 타입일 때만 인정한다.
    #     타입 이름이 …Config·…Client·…Settings 라는 것만으로는 제외하지 않는다 (요청 본문 모델일 수 있다)
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)(?!((\w+\.)*(Request|HttpRequest|Response|WebSocket|BackgroundTasks|Session|AsyncSession|HTTPConnection|SecurityScopes))$)(?!\w*(Dep|Deps|Dependency)$)(?!Current\w*(User|Account|Member|Principal|Admin)\w*$)(?!Annotated\[.*\b(Depends|Security)\()'
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Security(...), ...):
            ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Depends(...)]
          ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Security(...)]
          ...
      - focus-metavariable: $P
    # 의존성으로 주입돼도 요청 값인 것: 문자열·바이트(토큰·헤더 값)와 fastapi.security 의 폼·자격증명 객체
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(Annotated\[\s*)?(str|bytes|OAuth2PasswordRequestForm|OAuth2PasswordRequestFormStrict|HTTPBasicCredentials|HTTPAuthorizationCredentials)\s*(\|\s*None\s*)?(,.*\])?$'
      - focus-metavariable: $P
    # 인자 없는 Depends(): 그 타입을 요청 값으로 만들어 넣는다 (쿼리·폼 모델). 서비스·저장소로 보이는 이름만 제외
    - patterns:
        - pattern-either:
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: $T = fastapi.Depends(), ...):
                  ...
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: typing.Annotated[$T, fastapi.Depends()], ...):
                  ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
        - metavariable-regex:
            metavariable: $T
            regex: '^(?!(Annotated\[\s*)?(\w+\.)*\w*(Service|Repository|Repo|Client|Manager|Session|UseCase|Handler|Factory|Provider|Settings|Config)\s*(,.*\])?$)'
        - focus-metavariable: $P
    # Flask 는 함수의 타입 표기를 검사하지 않는다: 경로에 변환기 없는 자리(<name>, <string:…>, <path:…>)가 있으면 숫자 표기여도 문자열이다
    - patterns:
        - pattern-inside: |
            @$APP.$METHOD("$PATH", ...)
            def $F(..., $P: $T, ...):
              ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|route)$
        - metavariable-regex:
            metavariable: $PATH
            regex: .*<((string|path|any)[^:>]*:)?\w+>
        - metavariable-regex:
            metavariable: $T
            regex: '^((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$'
        - focus-metavariable: $P
    # 요청 값이라고 선언한 매개변수는 라우트 함수가 아니어도(의존성 함수) 입력이다: x: str = Header(), x = Query(None), Annotated[str, Form()]
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    # 타입 표기가 없는 것만 (def f(x=Query())). 표기가 있으면 아래 가지가 숫자형을 거른다
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P=$Q(...), ...):
                              ...
                        - pattern-not-inside: |
                            def $F(..., $P: $T2 = $Q(...), ...):
                              ...
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P: $T = $Q(...), ...):
                              ...
                        - metavariable-regex:
                            metavariable: $T
                            regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)'
                - metavariable-regex:
                    metavariable: $Q
                    regex: ^(fastapi\.)?(Query|Header|Cookie|Form|Body|File|Path)$
            - patterns:
                - pattern-inside: |
                    def $F(..., $P: $T, ...):
                      ...
                - metavariable-regex:
                    metavariable: $T
                    regex: '^Annotated\[\s*(?!(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\b)[^,]*,.*\b(Query|Header|Cookie|Form|Body|File|Path)\('
        - focus-metavariable: $P
    # Django 뷰의 URL 인자: 첫 매개변수가 request 인 함수·메서드의 나머지 매개변수 (URLconf 의 <str:…>·<path:…>·정규식 그룹).
    # 변환기는 urls.py 에 있어 볼 수 없으므로 숫자 타입 표기가 있는 것만 제외한다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                def $F(request, ..., $P, ...):
                  ...
            - pattern-inside: |
                def $F(self, request, ..., $P, ...):
                  ...
        - pattern-not-inside: |
            def $F(..., $P: $T, ...):
              ...
        - pattern-not-inside: |
            def $F(..., *$P, ...):
              ...
        - pattern-not-inside: |
            def $F(..., **$P, ...):
              ...
        - focus-metavariable: $P
  pattern-sanitizers:
    # 고정 접두: 문자열 리터럴(f-string 포함)로 시작하고 그 앞부분이 이동할 곳을 고정하는 식만 인정한다
    #   (1) "/경로…" 로 시작하는 상대 경로. "/" 바로 뒤가 입력이면("/" + x, "/%s" % x, f"/{x}") //host 가 되므로 제외
    #   (2) "https://고정호스트/…" — 호스트가 리터럴 안에서 / ? # 로 끝나야 한다 ("https://%s/" % x, "https://host" + x 는 제외)
    #   리터럴 바로 뒤에는 접두를 그대로 두는 연산(+, %, .format(…))만 올 수 있다. 리터럴을 바꾸는 호출("/a".replace(…), .join(…), .strip(…))·
    #   자르기("/a"[:0])·반복("/a" * n)은 인정하지 않는다. 식 전체가 조건식·and·or 면 값이 다른 데서 올 수 있으므로 제외
    - patterns:
        - pattern: $S
        - metavariable-regex:
            metavariable: $S
            regex: ^f?(["'])(/[^/\\{"'%]|https?://[^/?#{}"'\\%@\s]+[/?#])[^"'\n]*\1\s*(\+|%|\.format\(|$)
        - pattern-not: $A if $C else $B
        - pattern-not: $A or $B
        - pattern-not: $A and $B
    # 요청의 "경로" 부분만 담는 값(request.path · full_path · get_full_path())은 이 규칙(block)에서 다루지 않는다.
    #   //host 또는 /\host 로 시작하는 요청 경로는 다른 호스트로 갈 수 있지만, redirect(request.path) 는 흔한 무해한 관용구라
    #   warn 규칙 mois-1-07-open-redirect-path-py 가 따로 보고한다 (이 파일 아래쪽)
    - patterns:
        - pattern-either:
            - pattern: $REQ.path
            - pattern: $REQ.full_path
            - pattern: $REQ.get_full_path()
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(request|req|self\.request|flask\.request)$
    # 프레임워크가 만든 경로 뒤에 덧붙인 값 (질의 문자열 등): reverse(…) + "?q=" + x, url_for(…) + f"?q={x}"
    #   - import 로 확인되는 django.urls.reverse · flask.url_for 여야 한다 (이름만 reverse 인 함수는 제외)
    #   - 식이 그 호출로 시작해 바로 + 문자열 리터럴로 이어져야 한다 (reverse(…) * 0 + x, reverse(…)[:0] + x, 입력 + reverse(…) + … 는 제외)
    #   - 그 리터럴은 / · \ 가 아닌 글자로 시작해야 한다. 경로가 "/" 인 라우트면 reverse("home") + 입력 이 "//host" 가 되기 때문이다
    #   - 리터럴 뒤에는 + 만 올 수 있다 ("?q=".replace(…) 등 제외). 식 전체가 조건식·and·or 면 제외
    - patterns:
        - pattern: $S
        - metavariable-regex:
            metavariable: $S
            regex: ^((django\.urls\.)?reverse|(flask\.)?url_for)\((?:[^()]|\([^()]*\))*\)\s*\+\s*f?(["'])[^/\\{"'%][^"'\n]*\4\s*(\+|$)
        - metavariable-pattern:
            metavariable: $S
            pattern-either:
              - pattern: django.urls.reverse(...)
              - pattern: flask.url_for(...)
        - pattern-not: $A if $C else $B
        - pattern-not: $A or $B
        - pattern-not: $A and $B
    - pattern: django.urls.reverse(...)
    - pattern: flask.url_for(...)
    - pattern: int(...)
    # Django 호스트·스킴 검사(url_has_allowed_host_and_scheme·is_safe_url) — 실패 시 중단: 검사에 실패하면 빠져나가는(return·raise·continue) if 문 **뒤**의 그 변수만 검증된 것으로 본다 (규약 §1 v2).
    #   결과를 버림 · 실패해도 계속 진행 · 실패 분기 안에서 사용 · 안쪽 조건부 return · 검사 뒤 재대입 · and · & 로 묶인 검사 · else 가 붙은 guard 는 인정하지 않는다.
    #   urlsplit(x).netloc == "" 처럼 "호스트가 비었는지"만 보는 검사는 인정하지 않는다 — "///evil.example" · "\\evil.example" 은
    #   netloc 이 비어 있지만 브라우저는 다른 호스트로 간다 (Django 의 검사는 이 둘을 따로 걸러 낸다)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    return ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    raise ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    continue
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: not django.utils.http.url_has_allowed_host_and_scheme($X, ...)
                  - pattern: not django.utils.http.url_has_allowed_host_and_scheme(url=$X, ...)
                  - pattern: not django.utils.http.is_safe_url($X, ...)
              - pattern-not-inside: $P and $Q
              - pattern-not-inside: $P & $Q
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            else:
                ...
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        - pattern: $X
    # Django 호스트·스킴 검사 — 조건 안에서만 사용: 검사를 통과한 if 안 (else·부정·or·| 가 있거나, 그 안에서 다시 대입·덧붙이면 인정하지 않는다)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if <... django.utils.http.url_has_allowed_host_and_scheme($X, ...) ...>:
                    ...
            - pattern-inside: |
                if <... django.utils.http.url_has_allowed_host_and_scheme(url=$X, ...) ...>:
                    ...
            - pattern-inside: |
                if <... django.utils.http.is_safe_url($X, ...) ...>:
                    ...
        - pattern-not-inside: |
            if <... not $NEG ...>:
                ...
        - pattern-not-inside: |
            if <... $P or $Q ...>:
                ...
        - pattern-not-inside: |
            if <... $P | $Q ...>:
                ...
        - pattern-not-inside: |
            if $C:
                ...
            else:
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X = $V
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X += $V
                ...
        - pattern: $X
    # 같은 검사에 실패하면 안전한 값으로 바꾸는 형태: if not url_has_allowed_host_and_scheme(next, ...): next = "/"
    #   분기의 마지막 문장이 그 변수에 문자열 리터럴·settings 값·reverse()·resolve_url(리터럴 또는 settings 값) 을 넣는 대입일 때만,
    #   if 문 뒤의 그 변수를 검증된 것으로 본다. resolve_url(입력) 은 "/" 나 "." 이 든 값을 그대로 돌려주므로 인정하지 않는다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    $X = "..."
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = django.conf.settings.$NAME
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = django.urls.reverse(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = django.shortcuts.resolve_url(django.conf.settings.$NAME)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    $X = django.shortcuts.resolve_url("...")
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: not django.utils.http.url_has_allowed_host_and_scheme($X, ...)
                  - pattern: not django.utils.http.url_has_allowed_host_and_scheme(url=$X, ...)
                  - pattern: not django.utils.http.is_safe_url($X, ...)
              - pattern-not-inside: $P and $Q
              - pattern-not-inside: $P & $Q
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            else:
                ...
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        - pattern: $X
    # (공통 1) 모듈 수준에서 문자열·숫자 값만 든 리터럴로 정의한 dict 에서 꺼낸 값은 외부 입력이 아니다: TABLE[key], TABLE.get(key)
    #          인정하지 않는 것: 값에 변수·호출이 든 dict, 함수 안에서 만든 dict, 다른 모듈의 dict, get(key, 입력),
    #          쓰는 함수 안에서 바뀌는 dict (TABLE[k] = v, TABLE.update(...), TABLE.setdefault(...), TABLE |= ..., TABLE = ...)
    - patterns:
        - pattern-either:
            - pattern: $ALLOW[$K]
            - pattern: $ALLOW.get($K)
            - pattern: $ALLOW.get($K, None)
            - pattern: $ALLOW.get($K, "...")
        - pattern-inside: |
            $ALLOW = $LIT
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^\{\s*(?:(?:"[^"\n]*"|''[^''\n]*'')\s*:\s*(?:"[^"\n]*"|''[^''\n]*''|-?\d+)\s*(?:,\s*)?)+\}$'
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW = $V2
                ...
        - pattern-not-inside: |
            def $FM(...):
                ...
                $ALLOW |= $V2
                ...
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  def $FM(...):
                      ...
                      $ALLOW.$MUT(...)
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(update|setdefault)$
