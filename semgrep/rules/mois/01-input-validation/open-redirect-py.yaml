- id: mois-1-07-open-redirect-path-py
  mode: taint
  languages: [python]
  severity: WARNING
  message: "[행안부 입력데이터 검증 및 표현] 신뢰되지 않는 URL 주소로 자동접속 연결(확인 필요): 요청 경로(request.path·full_path·get_full_path())로 만든 주소로 리다이렉트함 — 경로가 // 또는 /\\ 로 시작하면 다른 호스트로 이동할 수 있다. 앞쪽 슬래시를 확인·제거하거나 프레임워크의 안전 URL 검사(Django url_has_allowed_host_and_scheme)를 통과한 값만 쓸 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-7"
    mois-item: "신뢰되지 않는 URL 주소로 자동접속 연결"
    cwe: "CWE-601"
    gate: warn
  # guard sanitizer(규약 §1 v2)가 '분기의 마지막 문장이 return·raise' 일 때만 중단으로 보게 한다
  options:
    go_deeper_stmt: false
  pattern-sources:
    - patterns:
        - pattern-either:
            - pattern: $REQ.path
            - pattern: $REQ.full_path
            - pattern: $REQ.get_full_path()
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(request|req|self\.request|flask\.request)$
  pattern-sanitizers:
    # 고정 접두 — block 규칙과 같다: "/경로…" 또는 "https://고정호스트/…" 리터럴로 시작하고 바로 +, %, .format(…) 으로 이어지는 식
    - patterns:
        - pattern: $S
        - metavariable-regex:
            metavariable: $S
            regex: ^f?(["'])(/[^/\\{"'%]|https?://[^/?#{}"'\\%@\s]+[/?#])[^"'\n]*\1\s*(\+|%|\.format\(|$)
        - pattern-not: $A if $C else $B
        - pattern-not: $A or $B
        - pattern-not: $A and $B
    # 프레임워크가 만든 경로 뒤에 리터럴을 두고 덧붙인 값 — block 규칙과 같다: reverse(…) + "?next=" + request.path
    #   reverse("home") + request.path 는 인정하지 않는다 (경로가 "/" 인 라우트면 "/" + "/evil.example" = "//evil.example")
    - patterns:
        - pattern: $S
        - metavariable-regex:
            metavariable: $S
            regex: ^((django\.urls\.)?reverse|(flask\.)?url_for)\((?:[^()]|\([^()]*\))*\)\s*\+\s*f?(["'])[^/\\{"'%][^"'\n]*\4\s*(\+|$)
        - metavariable-pattern:
            metavariable: $S
            pattern-either:
              - pattern: django.urls.reverse(...)
              - pattern: flask.url_for(...)
        - pattern-not: $A if $C else $B
        - pattern-not: $A or $B
        - pattern-not: $A and $B
    - pattern: django.urls.reverse(...)
    - pattern: flask.url_for(...)
    # Django 호스트·스킴 검사 — 실패 시 중단: 검사에 실패하면 빠져나가는(return·raise) if 문 **뒤**의 그 변수만 검증된 것으로 본다 (규약 §1 v2).
    #   url_has_allowed_host_and_scheme 는 "//host" · "///host" · "/\host" 를 모두 거부한다.
    #   결과를 버림 · 실패해도 계속 진행 · 실패 분기 안에서 사용 · 검사 뒤 재대입 · and · & 로 묶인 검사 · else 가 붙은 guard 는 인정하지 않는다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    return ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    raise ...
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern: not django.utils.http.url_has_allowed_host_and_scheme($X, ...)
              - pattern-not-inside: $P and $Q
              - pattern-not-inside: $P & $Q
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            else:
                ...
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        - pattern: $X
    # Django 호스트·스킴 검사 — 조건 안에서만 사용: 검사를 통과한 if 안 (else·부정·or·| 가 있거나, 그 안에서 다시 대입·덧붙이면 인정하지 않는다)
    - patterns:
        - pattern-inside: |
            if <... django.utils.http.url_has_allowed_host_and_scheme($X, ...) ...>:
                ...
        - pattern-not-inside: |
            if <... not $NEG ...>:
                ...
        - pattern-not-inside: |
            if <... $P or $Q ...>:
                ...
        - pattern-not-inside: |
            if <... $P | $Q ...>:
                ...
        - pattern-not-inside: |
            if $C:
                ...
            else:
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X = $V
                ...
        - pattern-not-inside: |
            if $C:
                ...
                $X += $V
                ...
        - pattern: $X
  pattern-sinks:
    - patterns:
        - pattern-either:
            - pattern: django.shortcuts.redirect($URL, ...)
            - pattern: django.http.HttpResponseRedirect($URL, ...)
            - pattern: django.http.HttpResponsePermanentRedirect($URL, ...)
            - pattern: flask.redirect($URL, ...)
            # response["Location"] = …, response.headers["Location"] = … 모두 여기에 맞는다
            - pattern: $RESP["Location"] = $URL
        - focus-metavariable: $URL
