rules:
- id: mois-1-17-format-string-js
  mode: taint
  languages: [javascript, typescript]
  severity: WARNING
  message: "[행안부 입력데이터 검증 및 표현] 포맷 스트링 삽입: 외부 입력이 sprintf-js 의 형식 문자열로 사용됨 — %(user.password)s 처럼 인자 객체의 다른 속성을 꺼내 노출할 수 있다. 형식은 상수로 두고 입력은 인자로 넘길 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-17"
    mois-item: "포맷 스트링 삽입"
    cwe: "CWE-134"
    gate: warn
  # JS 의 util.format · console.log 형식 문자열은 %s %d %j %o 등으로 넘긴 인자만 바꿀 뿐 메모리 · 속성에 접근하지 못해 대상이 아니다
  # (로그 위조는 별도 문제). 형식 문자열에서 인자 객체의 속성 경로를 따라가는 sprintf-js 의 sprintf · vsprintf 만 본다.
  # 넘긴 객체에 숨길 값이 있는지는 알 수 없어 warn. 함수 안 taint 만.
  pattern-sources:
    # (A) 서버 요청 값 (정규식은 가지마다 따로 건다 — 한 묶음에서 일부 가지에만 있는 메타변수에 걸면 나머지 가지가 무효가 된다)
    - patterns:
        - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|params|cookies|signedCookies|headers|originalUrl|url|path|hostname|files|file)$
    - patterns:
        - pattern: $REQ.$GET(...)
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $GET
            regex: ^(get|header|param)$
    - pattern: ctx.query
    - pattern: ctx.params
    - pattern: ctx.headers
    - pattern: ctx.cookies.get(...)
    - patterns:
        - pattern: ctx.request.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|headers|files|url|path)$
    # (A-2) 요청 객체를 구조분해한 핸들러 매개변수: ({ params, query, body }: Request, res) => …  (두 번째 매개변수가 res·response·reply 일 때만)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                ({..., $K, ...}, $RES, ...) => { ... }
            - pattern-inside: |
                ({..., $K, ...}: $T, $RES, ...) => { ... }
            - pattern-inside: |
                function ({..., $K, ...}, $RES, ...) { ... }
            - pattern-inside: |
                function $FN({..., $K, ...}, $RES, ...) { ... }
        - metavariable-regex:
            metavariable: $K
            regex: ^(query|body|params|cookies|headers|files|file)$
        - metavariable-regex:
            metavariable: $RES
            regex: ^(res|response|reply)$
        - pattern: $K
    # (B) NestJS 컨트롤러 매개변수 (숫자 변환 파이프 ParseIntPipe·ParseFloatPipe·ParseBoolPipe·ParseUUIDPipe 를 준 것은 제외)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                $M(..., @$D(...) $P: $T, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P: $T, ...) { ... }
        - metavariable-regex:
            metavariable: $D
            regex: ^(Query|Body|Param|Headers|Req|Request)$
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern-inside: |
                      $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
              - metavariable-regex:
                  metavariable: $PIPE
                  regex: ^Parse(Int|Float|Bool|UUID|Enum)Pipe$
        - focus-metavariable: $P
    # (C) 브라우저 입력
    - patterns:
        - pattern-either:
            - pattern: location.$LOC
            - pattern: window.location.$LOC
            - pattern: document.location.$LOC
        - metavariable-regex:
            metavariable: $LOC
            regex: ^(href|search|hash|pathname)$
    - pattern: document.URL
    - pattern: document.documentURI
    - pattern: document.referrer
    - pattern: window.name
    - patterns:
        - pattern-inside: |
            $W.addEventListener("message", ($E) => { ... })
        - pattern: $E.data
    # Angular ActivatedRoute: this.route.snapshot.queryParams.q · .params · .paramMap.get(...) · .fragment
    - patterns:
        - pattern: $R.snapshot.$P
        - metavariable-regex:
            metavariable: $P
            regex: ^(queryParams|params|queryParamMap|paramMap|fragment)$
    - pattern: useParams()
    - pattern: useSearchParams()
    - pattern: useLocation()
    - pattern: useRouter().query
    - patterns:
        - pattern-inside: |
            $R = useRouter();
            ...
        - pattern: $R.query
  pattern-sinks:
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    - pattern-inside: |
                        import { ..., $FN, ... } from "sprintf-js";
                        ...
                    - pattern-inside: |
                        const { ..., $FN, ... } = require("sprintf-js");
                        ...
                - pattern: $FN($FMT, ...)
            # 별칭: import { sprintf as fmt } · const { sprintf: fmt } = require(...)
            - patterns:
                - pattern-either:
                    - pattern-inside: |
                        import { ..., $FN as $F, ... } from "sprintf-js";
                        ...
                    - pattern-inside: |
                        const { ..., $FN: $F, ... } = require("sprintf-js");
                        ...
                - pattern: $F($FMT, ...)
            - patterns:
                - pattern-either:
                    - pattern-inside: |
                        $SP = require("sprintf-js");
                        ...
                    - pattern-inside: |
                        import * as $SP from "sprintf-js";
                        ...
                - pattern: $SP.$FN($FMT, ...)
        - metavariable-regex:
            metavariable: $FN
            regex: ^v?sprintf$
        - focus-metavariable: $FMT
