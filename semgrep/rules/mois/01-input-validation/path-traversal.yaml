rules:
- id: mois-1-03-path-traversal
  mode: taint
  languages: [java]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] 경로 조작 및 자원 삽입: 외부 입력이 검증 없이 파일 경로에 사용됨"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-3"
    mois-item: "경로 조작 및 자원 삽입"
    cwe: "CWE-22"
    gate: block
  # guard sanitizer 가 "마지막 문장이 return·throw 인 if" 만 중단으로 보도록 한다 (docs/rule-conventions.md §1)
  options:
    go_deeper_stmt: false
  pattern-sources:
    - patterns:
        - pattern-either:
            - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GET(...)
            - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GET(...)
        - metavariable-regex:
            metavariable: $GET
            regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getRequestURI|getRequestURL|getPathInfo|getCookies|getInputStream|getReader|getPart|getParts)$
    - pattern: (javax.servlet.http.Cookie $CK).getValue()
    - pattern: (jakarta.servlet.http.Cookie $CK).getValue()
    # 요청을 감싼 표준 객체: Spring 멀티파트·WebRequest, cos MultipartRequest, 업로드 파일의 원본 이름
    - patterns:
        - pattern-either:
            - pattern: (org.springframework.web.multipart.MultipartHttpServletRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.multipart.MultipartRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.context.request.WebRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.context.request.NativeWebRequest $REQ).$GET(...)
            - pattern: (com.oreilly.servlet.MultipartRequest $REQ).$GET(...)
            - pattern: (javax.servlet.ServletRequest $REQ).$GET(...)
            - pattern: (jakarta.servlet.ServletRequest $REQ).$GET(...)
        - metavariable-regex:
            metavariable: $GET
            regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaderValues|getHeaderNames|getFilesystemName|getOriginalFileName|getFileNames|getInputStream|getReader)$
    - pattern: (org.springframework.web.multipart.MultipartFile $MF).getOriginalFilename()
    - patterns:
        - pattern-either:
            - pattern: $RET $M(..., @$A(...) $T $P, ...) { ... }
            - pattern: $RET $M(..., @$A $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $A
            regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|ModelAttribute|MatrixVariable)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|Integer|Long|Short|Byte|Double|Float|Boolean|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime)$).*
        - focus-metavariable: $P
    # Spring MVC 는 애너테이션이 없는 핸들러 매개변수도 요청 값으로 채운다 (단순형은 요청 파라미터, 객체는 폼 바인딩).
    # 숫자·날짜형과 프레임워크가 넣어 주는 객체(요청·응답·세션·모델 등), 요청과 무관한 애너테이션은 제외
    - patterns:
        - pattern-either:
            - pattern: |
                @$MAP(...)
                $RET $M(..., $T $P, ...) { ... }
            - pattern: |
                @$MAP
                $RET $M(..., $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $MAP
            regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|ModelAndView|Map|BindingResult|Errors|Locale|TimeZone|Principal|Authentication|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort|WebRequest|NativeWebRequest|InputStream|OutputStream|Reader|Writer|HttpMethod)\b).*
        # 애너테이션이 붙은 매개변수는 여기서 보지 않는다. 요청 바인딩 애너테이션은 위 항목, 검증 애너테이션은 아래 항목이 본다.
        # 그 밖의 애너테이션(@AuthenticationPrincipal, 직접 만든 @CurrentUser 등)은 요청 값이 아니라 프레임워크·리졸버가 넣는 값이다
        - pattern-not: $RET $M(..., @$ANN(...) $T $P, ...) { ... }
        - focus-metavariable: $P
    # 검증 애너테이션만 붙은 핸들러 매개변수(@Valid MemberForm form)도 요청 값으로 채워진다
    - patterns:
        - pattern: |
            @$MAP(...)
            $RET $M(..., @$VA(...) $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $MAP
            regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
        - metavariable-regex:
            metavariable: $VA
            regex: ^(Valid|Validated|NotNull|NotBlank|NotEmpty|Size|Pattern|Length|Email|Nullable|NonNull)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|ModelAndView|Map|BindingResult|Errors|Locale|TimeZone|Principal|Authentication|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort|WebRequest|NativeWebRequest|InputStream|OutputStream|Reader|Writer|HttpMethod)\b).*
        - focus-metavariable: $P
  pattern-sanitizers:
    # 전자정부 표준프레임워크의 보안 유틸(EgovWebUtil). 프로젝트가 패키지를 옮겨 쓰는 경우를 위해 짧은 이름도 본다
    # filePathBlackList(값) 은 ".." 만 지운다 — /etc/passwd 같은 절대 경로는 그대로 통과하므로 값만 넘긴 것은 인정하지 않는다.
    # 기준 경로 뒤에 붙일 때만 인정한다: 기준 + filePathBlackList(값), new File(기준, filePathBlackList(값)), filePathBlackList(값, 기준 경로).
    # (기준 쪽이 입력이면 그 부분은 그대로 탐지된다. 두 인자형은 기준 경로까지 한 호출이라 기준이 입력인지는 가리지 못한다)
    - patterns:
        - pattern-either:
            - pattern: egovframework.com.cmm.EgovWebUtil.filePathBlackList($V)
            - pattern: EgovWebUtil.filePathBlackList($V)
        - pattern-either:
            - pattern-inside: $BASE + $U.filePathBlackList($V)
            - pattern-inside: new java.io.File($BASE, $U.filePathBlackList($V))
    # 기준 경로를 붙인 값을 통째로 넘기는 전자정부 관용구: filePathBlackList(기준 + 이름). 앞이 고정 경로라 절대 경로로 바꿀 수 없다
    # (기준 쪽이 입력이면 가리지 못한다 — 이 형태는 기준 + 값 전체를 한 호출이 받는다)
    - patterns:
        - pattern-either:
            - pattern: egovframework.com.cmm.EgovWebUtil.filePathBlackList($BASE + $REST)
            - pattern: EgovWebUtil.filePathBlackList($BASE + $REST)
            # 기준 + 이름을 변수에 먼저 담은 경우 (String path = 기준 + 이름; … filePathBlackList(path)). 그 사이에 다시 대입하면 인정하지 않는다
            - patterns:
                # ($P = … 는 초기값 있는 선언 String p = … 에도 맞는다)
                - pattern-inside: |
                    $P = $BASE + $REST;
                    ...
                - pattern-not-inside: |
                    $P = $BASE + $REST;
                    ...
                    $P = $OTHER;
                    ...
                - pattern-either:
                    - pattern: egovframework.com.cmm.EgovWebUtil.filePathBlackList($P)
                    - pattern: EgovWebUtil.filePathBlackList($P)
    - pattern: egovframework.com.cmm.EgovWebUtil.filePathBlackList($V, $BASEPATH)
    - pattern: EgovWebUtil.filePathBlackList($V, $BASEPATH)
    # filePathReplaceAll·fileInjectPathReplaceAll 은 구분자(/ \)와 ".." 를 모두 지운다
    - pattern: egovframework.com.cmm.EgovWebUtil.filePathReplaceAll(...)
    - pattern: EgovWebUtil.filePathReplaceAll(...)
    - pattern: egovframework.com.cmm.EgovWebUtil.fileInjectPathReplaceAll(...)
    - pattern: EgovWebUtil.fileInjectPathReplaceAll(...)
    # 경로를 떼어 내고 파일 이름만 남기는 변환.
    # 한계: 값이 ".." 그 자체면 이름도 ".." 다 (new File("..").getName() == ".."). new File(기준, 이름) 이 기준의 부모 디렉터리가 되지만
    #       그 아래의 다른 파일을 고를 수는 없다. 정적으로 가릴 방법이 없어 인정한 채로 둔다 (디렉터리를 지우거나 나열하는 코드는 수동 확인)
    - pattern: org.apache.commons.io.FilenameUtils.getName(...)
    - pattern: new java.io.File(...).getName()
    - pattern: java.nio.file.Paths.get(...).getFileName()
    - pattern: java.nio.file.Path.of(...).getFileName()
    # 정규화한 경로가 기준 디렉터리 아래인지 검사하고 아니면 중단(return·throw)하는 guard 만 검증으로 본다
    # (docs/rule-conventions.md §1 v2 "실패 시 중단" 틀, §2 "경로"). if 문 **뒤**에 오는 $F 만 안전 처리한다.
    # 인정하지 않는 것: 구분자를 붙이지 않은 문자열 비교(/safe-evil 이 /safe 로 통과), 정규화하지 않은 비교,
    # 실패해도 계속 진행, 결과를 버림, 반대 분기, 실패 분기 안에서의 사용, 안쪽 조건부 return, 검사 뒤 재대입,
    # || 가 아닌 식(&&·&·^·?:·!(…) 등)에 묶인 검사, 다른 변수 검사. `f == null || !검사` 처럼 || 로만 묶인 것은 인정한다.
    # (1) 검사식 안에서 정규화: f.getCanonicalPath().startsWith(base + File.separator), p.normalize().startsWith(base) 등
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if ($COND) { ... return ...; }
                ...
            - pattern-inside: |
                if ($COND) { ... throw $E; }
                ...
            - pattern-inside: |
                if ($COND) return ...;
                ...
            - pattern-inside: |
                if ($COND) throw $E;
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - patterns:
                      - pattern: '!$F.getCanonicalPath().startsWith($BASE + $SEP)'
                      - metavariable-regex:
                          metavariable: $SEP
                          regex: ^((java\.io\.)?File\.separator(Char)?|"/"|'/')$
                  - pattern: '!$F.normalize().startsWith($B)'
                  - pattern: '!$F.toRealPath(...).startsWith($B)'
                  - pattern: '!$F.toAbsolutePath().normalize().startsWith($B)'
              # 검사식을 감싸는 식은 || 뿐이어야 한다 (f == null || !검사). &&·&·^·?:·!(…)·== false 등에 묶이면 인정하지 않는다
              - pattern-not-inside:
                  patterns:
                    - pattern: $WRAP
                    - pattern-not: $OR1 || $OR2
                    - pattern-not: '!$ANY.startsWith(...)'
        # if 문 자체(실패 분기 안)에서 쓰는 것과, 검사 뒤에 다시 대입한 경우는 제외
        - pattern-not-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $F = $V;
            ...
        - pattern: $F
    # (2) 정규화한 문자열을 변수에 받아 비교: String c = f.getCanonicalPath(); ... c.startsWith(base + File.separator)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if ($COND) { ... return ...; }
                ...
            - pattern-inside: |
                if ($COND) { ... throw $E; }
                ...
            - pattern-inside: |
                if ($COND) return ...;
                ...
            - pattern-inside: |
                if ($COND) throw $E;
                ...
        - pattern-inside: |
            $C = $F.getCanonicalPath();
            ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern: '!$C.startsWith($BASE + $SEP)'
              - metavariable-regex:
                  metavariable: $SEP
                  regex: ^((java\.io\.)?File\.separator(Char)?|"/"|'/')$
              # 검사식을 감싸는 식은 || 뿐이어야 한다 (f == null || !검사). &&·&·^·?:·!(…)·== false 등에 묶이면 인정하지 않는다
              - pattern-not-inside:
                  patterns:
                    - pattern: $WRAP
                    - pattern-not: $OR1 || $OR2
                    - pattern-not: '!$ANY.startsWith(...)'
        # if 문 자체(실패 분기 안)에서 쓰는 것과, 검사 뒤에 다시 대입한 경우는 제외
        - pattern-not-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $F = $V;
            ...
        - pattern: $F
    # (3) 만들 때 normalize()·toRealPath() 로 정규화해 둔 Path 를 Path.startsWith 로 비교 (경로 요소 단위 비교)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if ($COND) { ... return ...; }
                ...
            - pattern-inside: |
                if ($COND) { ... throw $E; }
                ...
            - pattern-inside: |
                if ($COND) return ...;
                ...
            - pattern-inside: |
                if ($COND) throw $E;
                ...
        - pattern-either:
            - pattern-inside: |
                $F = $X.normalize();
                ...
            - pattern-inside: |
                $F = $X.toRealPath(...);
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern: '!(java.nio.file.Path $F).startsWith($B)'
              # 검사식을 감싸는 식은 || 뿐이어야 한다 (f == null || !검사). &&·&·^·?:·!(…)·== false 등에 묶이면 인정하지 않는다
              - pattern-not-inside:
                  patterns:
                    - pattern: $WRAP
                    - pattern-not: $OR1 || $OR2
                    - pattern-not: '!$ANY.startsWith(...)'
        # if 문 자체(실패 분기 안)에서 쓰는 것과, 검사 뒤에 다시 대입한 경우는 제외
        - pattern-not-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $F = $V;
            ...
        - pattern: $F
  pattern-propagators:
    - pattern: $SB.append($X)
      from: $X
      to: $SB
    # 컬렉션에 넣은 값은 컬렉션 전체를 오염시킨다 (요소 단위로는 구분하지 못한다)
    - pattern: $COL.add($X)
      from: $X
      to: $COL
    - pattern: $COL.add($IDX, $X)
      from: $X
      to: $COL
    - pattern: $COL.put($KEY, $X)
      from: $X
      to: $COL
    - pattern: $COL.addAll($X)
      from: $X
      to: $COL
  pattern-sinks:
    - patterns:
        - pattern-either:
            - pattern: new java.io.File(...)
            - pattern: new java.io.FileInputStream(...)
            - pattern: new java.io.FileOutputStream(...)
            - pattern: new java.io.FileReader(...)
            - pattern: new java.io.FileWriter(...)
            - pattern: java.nio.file.Paths.get(...)
            - pattern: java.nio.file.Path.of(...)
            - pattern: (java.nio.file.Path $DIR).resolve(...)
            - pattern: (java.nio.file.Path $DIR).resolveSibling(...)
            - pattern: java.nio.file.Paths.get(...).resolve(...)
            - pattern: java.nio.file.Path.of(...).resolve(...)
            # File 에서 얻은 Path (호출 결과는 타입을 알 수 없어 따로 적는다)
            - pattern: $FILE.toPath().resolve(...)
            - pattern: $FILE.toPath().resolveSibling(...)
        # File·Path 를 만들어 변수에 담은 뒤, 쓰기 전에 그 변수를 위 sanitizer (1)~(3) 과 같은 guard 로 검사하면
        # 만드는 줄은 제외한다 (검사 뒤의 사용은 sanitizer 가 처리). guard 가 인정되지 않으면 만드는 줄부터 탐지된다.
        - pattern-not-inside:
            patterns:
              - pattern: $F = $INIT;
              - pattern-either:
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              if ($COND) { ... return ...; }
                              ...
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              if ($COND) { ... throw $E; }
                              ...
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              if ($COND) return ...;
                              ...
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              if ($COND) throw $E;
                              ...
                      - metavariable-pattern:
                          metavariable: $COND
                          patterns:
                            - pattern-either:
                                - patterns:
                                    - pattern: '!$F.getCanonicalPath().startsWith($BASE + $SEP)'
                                    - metavariable-regex:
                                        metavariable: $SEP
                                        regex: ^((java\.io\.)?File\.separator(Char)?|"/"|'/')$
                                - pattern: '!$F.normalize().startsWith($B)'
                                - pattern: '!$F.toRealPath(...).startsWith($B)'
                                - pattern: '!$F.toAbsolutePath().normalize().startsWith($B)'
                            # 검사식을 감싸는 식은 || 뿐이어야 한다 (f == null || !검사). &&·&·^·?:·!(…)·== false 등에 묶이면 인정하지 않는다
                            - pattern-not-inside:
                                patterns:
                                  - pattern: $WRAP
                                  - pattern-not: $OR1 || $OR2
                                  - pattern-not: '!$ANY.startsWith(...)'
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              $C = $F.getCanonicalPath();
                              ...
                              if ($COND) { ... return ...; }
                              ...
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              $C = $F.getCanonicalPath();
                              ...
                              if ($COND) { ... throw $E; }
                              ...
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              $C = $F.getCanonicalPath();
                              ...
                              if ($COND) return ...;
                              ...
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              $C = $F.getCanonicalPath();
                              ...
                              if ($COND) throw $E;
                              ...
                      - metavariable-pattern:
                          metavariable: $COND
                          patterns:
                            - pattern: '!$C.startsWith($BASE + $SEP)'
                            - metavariable-regex:
                                metavariable: $SEP
                                regex: ^((java\.io\.)?File\.separator(Char)?|"/"|'/')$
                            # 검사식을 감싸는 식은 || 뿐이어야 한다 (f == null || !검사). &&·&·^·?:·!(…)·== false 등에 묶이면 인정하지 않는다
                            - pattern-not-inside:
                                patterns:
                                  - pattern: $WRAP
                                  - pattern-not: $OR1 || $OR2
                                  - pattern-not: '!$ANY.startsWith(...)'
                  - patterns:
                      - pattern-either:
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              if ($COND) { ... return ...; }
                              ...
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              if ($COND) { ... throw $E; }
                              ...
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              if ($COND) return ...;
                              ...
                          - pattern-inside: |
                              $F = $INIT;
                              ...
                              if ($COND) throw $E;
                              ...
                      - metavariable-pattern:
                          metavariable: $COND
                          patterns:
                            - pattern: '!(java.nio.file.Path $F).startsWith($B)'
                            # 검사식을 감싸는 식은 || 뿐이어야 한다 (f == null || !검사). &&·&·^·?:·!(…)·== false 등에 묶이면 인정하지 않는다
                            - pattern-not-inside:
                                patterns:
                                  - pattern: $WRAP
                                  - pattern-not: $OR1 || $OR2
                                  - pattern-not: '!$ANY.startsWith(...)'
                      - metavariable-regex:
                          metavariable: $INIT
                          regex: (?s).*\.(normalize\(\)|toRealPath\([^()]*\))$
              # 검사하기 전에 이미 써 버린 경우는 제외하지 않는다 (경로를 읽기만 하는 메서드는 사용으로 보지 않음)
              - pattern-not-inside:
                  patterns:
                    - pattern: $F = $INIT;
                    - pattern-inside: |
                        $F = $INIT;
                        ...
