rules:
- id: mois-1-04-xss-spring-response
  mode: taint
  languages: [java]
  severity: WARNING
  message: "[행안부 입력데이터 검증 및 표현] 크로스사이트 스크립트: @ResponseBody·@RestController 핸들러가 외부 입력에서 만든 문자열을 그대로 응답함 — 브라우저가 HTML 로 해석하면 스크립트가 실행된다. HtmlUtils.htmlEscape 로 이스케이프하거나 produces 로 text/plain·JSON 을 지정할 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-4"
    mois-item: "크로스사이트 스크립트"
    cwe: "CWE-79"
    gate: warn
  pattern-sources:
    - patterns:
        - pattern-either:
            - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GET(...)
            - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GET(...)
        - metavariable-regex:
            metavariable: $GET
            regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getRequestURI|getRequestURL|getPathInfo|getCookies|getInputStream|getReader|getPart|getParts)$
    - pattern: (javax.servlet.http.Cookie $CK).getValue()
    - pattern: (jakarta.servlet.http.Cookie $CK).getValue()
    # 요청을 감싼 표준 객체: Spring 멀티파트·WebRequest, cos MultipartRequest, 업로드 파일의 원본 이름
    - patterns:
        - pattern-either:
            - pattern: (org.springframework.web.multipart.MultipartHttpServletRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.multipart.MultipartRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.context.request.WebRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.context.request.NativeWebRequest $REQ).$GET(...)
            - pattern: (com.oreilly.servlet.MultipartRequest $REQ).$GET(...)
            - pattern: (javax.servlet.ServletRequest $REQ).$GET(...)
            - pattern: (jakarta.servlet.ServletRequest $REQ).$GET(...)
        - metavariable-regex:
            metavariable: $GET
            regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaderValues|getHeaderNames|getFilesystemName|getOriginalFileName|getFileNames|getInputStream|getReader)$
    - pattern: (org.springframework.web.multipart.MultipartFile $MF).getOriginalFilename()
    - patterns:
        - pattern-either:
            - pattern: $RET $M(..., @$A(...) $T $P, ...) { ... }
            - pattern: $RET $M(..., @$A $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $A
            regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|ModelAttribute|MatrixVariable)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|Integer|Long|Short|Byte|Double|Float|Boolean|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime)$).*
        - focus-metavariable: $P
    # Spring MVC 는 애너테이션이 없는 핸들러 매개변수도 요청 값으로 채운다 (단순형은 요청 파라미터, 객체는 폼 바인딩).
    # 숫자·날짜형과 프레임워크가 넣어 주는 객체(요청·응답·세션·모델 등), 요청과 무관한 애너테이션은 제외
    - patterns:
        - pattern-either:
            - pattern: |
                @$MAP(...)
                $RET $M(..., $T $P, ...) { ... }
            - pattern: |
                @$MAP
                $RET $M(..., $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $MAP
            regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|ModelAndView|Map|BindingResult|Errors|Locale|TimeZone|Principal|Authentication|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort|WebRequest|NativeWebRequest|InputStream|OutputStream|Reader|Writer|HttpMethod)\b).*
        # 애너테이션이 붙은 매개변수는 여기서 보지 않는다. 요청 바인딩 애너테이션은 위 항목, 검증 애너테이션은 아래 항목이 본다.
        # 그 밖의 애너테이션(@AuthenticationPrincipal, 직접 만든 @CurrentUser 등)은 요청 값이 아니라 프레임워크·리졸버가 넣는 값이다
        - pattern-not: $RET $M(..., @$ANN(...) $T $P, ...) { ... }
        - focus-metavariable: $P
    # 검증 애너테이션만 붙은 핸들러 매개변수(@Valid MemberForm form)도 요청 값으로 채워진다
    - patterns:
        - pattern: |
            @$MAP(...)
            $RET $M(..., @$VA(...) $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $MAP
            regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
        - metavariable-regex:
            metavariable: $VA
            regex: ^(Valid|Validated|NotNull|NotBlank|NotEmpty|Size|Pattern|Length|Email|Nullable|NonNull)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|ModelAndView|Map|BindingResult|Errors|Locale|TimeZone|Principal|Authentication|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort|WebRequest|NativeWebRequest|InputStream|OutputStream|Reader|Writer|HttpMethod)\b).*
        - focus-metavariable: $P
  pattern-sanitizers:
    # HTML 인코더는 **출력 위치를 증명할 수 있을 때만** 안전 처리로 본다 (v0.6.1).
    # HTML 인코더가 막는 것은 "태그 사이의 본문"과 "따옴표로 감싼 일반 속성 값"뿐이다. 아래 위치에서는 인코딩해도 뚫리므로 인정하지 않는다.
    #   - <script> 안, 이벤트 속성(onclick=…)·srcdoc 안, javascript: 로 시작하는 속성 값 (브라우저가 엔티티를 풀고 스크립트로 실행한다)
    #   - 값이 입력으로 시작하는 URL 속성(href·src·action·data): javascript:alert(1) 에는 바꿀 문자가 없다
    #   - 태그 안의 따옴표 밖(value=입력, <div 입력>): 공백 하나로 새 속성을 붙일 수 있다
    #   - 인코더가 바꾸지 않는 따옴표로 감싼 속성 값 (가지 (2)·(3))
    # 위치는 인코딩한 값 **앞에 붙은 코드 글자**($CTX)로 판단한다. 판단할 수 없는 경우(값만 출력, 리터럴 없음)는 본문으로 본다.
    - patterns:
        - pattern-either:
            # (1) < > & 와 따옴표 두 종류를 모두 바꾸는 인코더.
            # 전자정부 표준프레임워크의 보안 유틸(EgovWebUtil)은 프로젝트가 패키지를 옮겨 쓰는 경우를 위해 짧은 이름도 본다
            - pattern: egovframework.com.cmm.EgovWebUtil.clearXSSMinimum(...)
            - pattern: EgovWebUtil.clearXSSMinimum(...)
            - pattern: egovframework.com.cmm.EgovWebUtil.clearXSSMaximum(...)
            - pattern: EgovWebUtil.clearXSSMaximum(...)
            - pattern: egovframework.com.cmm.EgovWebUtil.escapeXml(...)
            - pattern: EgovWebUtil.escapeXml(...)
            - pattern: org.springframework.web.util.HtmlUtils.htmlEscape(...)
            - pattern: org.springframework.web.util.HtmlUtils.htmlEscapeDecimal(...)
            - pattern: org.springframework.web.util.HtmlUtils.htmlEscapeHex(...)
            - pattern: org.owasp.encoder.Encode.forHtml(...)
            - pattern: org.owasp.esapi.ESAPI.encoder().encodeForHTML(...)
            - pattern: org.owasp.esapi.ESAPI.encoder().encodeForHTMLAttribute(...)
            - pattern: (org.owasp.esapi.Encoder $ENC).encodeForHTML(...)
            - pattern: (org.owasp.esapi.Encoder $ENC).encodeForHTMLAttribute(...)
            - patterns:
                - pattern-either:
                    # (2) 작은따옴표를 바꾸지 않는 인코더 (commons escapeHtml*: " & < > 만): 작은따옴표 속성 값에서는 인정하지 않는다
                    - pattern: org.apache.commons.text.StringEscapeUtils.escapeHtml4(...)
                    - pattern: org.apache.commons.text.StringEscapeUtils.escapeHtml3(...)
                    - pattern: org.apache.commons.lang3.StringEscapeUtils.escapeHtml4(...)
                    - pattern: org.apache.commons.lang3.StringEscapeUtils.escapeHtml3(...)
                    - pattern: org.apache.commons.lang.StringEscapeUtils.escapeHtml(...)
                    - patterns:
                        - pattern-either:
                            # (3) 따옴표를 전혀 바꾸지 않는 인코더 (EgovWebUtil.clearXSS, Encode.forHtmlContent: & < > 만): 속성 값에서는 인정하지 않는다
                            - pattern: egovframework.com.cmm.EgovWebUtil.clearXSS(...)
                            - pattern: EgovWebUtil.clearXSS(...)
                            - pattern: org.owasp.encoder.Encode.forHtmlContent(...)
                        - pattern-not-inside:
                            patterns:
                              # 인코딩한 값($R)과 그 앞에 붙는 글자($CTX)의 관계. 세 정규식이 같은 목록을 쓴다 (YAML anchor)
                              - pattern-either: &xss-ctx
                                  - pattern: $CTX + $R                          # "…" + enc(x)
                                  - pattern: $CTX.$CM(..., $R, ...)             # sb.append("…").append(enc(x)), "…%s".formatted(enc(x))
                                  - pattern: $O.$F(..., $CTX, ..., $R, ...)     # printf("…%s…", enc(x)), String.format(…)
                                  # 바로 앞 문장에서 출력한 글자 뒤에 값 하나를 출력. 다음 문장이 여러 조각을 이어 붙이면 값의 위치를 알 수 없어 보지 않는다
                                  - patterns:
                                      - pattern: |
                                          $O.$M1($CTX);
                                          $O.$M2($R);
                                      - pattern-not: |
                                          $O.$M1($CTX);
                                          $O.$M2($A + $B);
                                  # 인코딩한 값을 변수에 담았다가 위와 같은 위치에 쓰는 경우 ($R = 대입한 식, 쓰는 쪽은 safe.trim()·삼항식처럼 변수가 든 식)
                                  - pattern: |
                                      $V = $R;
                                      ...
                                      $CTX + <... $V ...>;
                                  - pattern: |
                                      $V = $R;
                                      ...
                                      $CTX.$CM(..., <... $V ...>, ...);
                                  - pattern: |
                                      $V = $R;
                                      ...
                                      $O.$F(..., $CTX, ..., <... $V ...>, ...);
                                  - pattern: |
                                      $V = $R;
                                      ...
                                      $O.$M1($CTX);
                                      $O.$M2($V);
                              # 닫히지 않은 큰따옴표 속성 값 (소스 글자로는 =\" 뒤에 \" 가 다시 나오지 않음)
                              - metavariable-regex:
                                  metavariable: $CTX
                                  regex: '(?is).*=\s*\\"(?:(?!\\").)*(?:\z|%[\d$.-]*[a-z])'
                              - focus-metavariable: $R
                - pattern-not-inside:
                    patterns:
                      - pattern-either: *xss-ctx
                      # 닫히지 않은 작은따옴표 속성 값
                      - metavariable-regex:
                          metavariable: $CTX
                          regex: '(?is).*=\s*\\?\x27[^\x27]*(?:\z|%[\d$.-]*[a-z])'
                      - focus-metavariable: $R
        - pattern-not-inside:
            patterns:
              - pattern-either: *xss-ctx
              # 어떤 HTML 인코더도 막지 못하는 위치. 순서대로
              #   닫히지 않은 <script> · 닫히지 않은 이벤트 속성/srcdoc · 닫히지 않은 javascript: 속성 값
              #   · 닫히지 않은 태그 안에서 따옴표 밖(따옴표 없는 속성 값, 속성 이름 자리: 앞 속성들의 따옴표는 닫혀 있음)
              #   · 값이 비어 있는 URL 속성(리터럴이 따옴표에서 끝나고 뒤에 다른 리터럴이 없음. "/board/view?id=" 처럼 앞부분이 고정이면 인정)
              # 끝은 식의 끝(\z)이거나 형식 문자열의 자리표시(%s·%1$s …; "100%" 의 % 는 아님)
              - metavariable-regex:
                  metavariable: $CTX
                  regex: '(?is).*(?:(?:<script\b(?:(?!</script).)*|(?:(?:\bon\w+|srcdoc)\s*=\s*|=\s*(?=\\?["\x27]\s*javascript:))(\\"|\x27)(?:(?!\1).)*|<[a-z](?:(?!\\")[^<>\x27]|\\"(?:(?!\\").)*\\"|\x27[^\x27]*\x27)*)(?:\z|%[\d$.-]*[a-z])|(?:href|src|action|data)\s*=\s*\\?["\x27]\s*(?:"[^"]*\z|%[\d$.-]*[a-z]))'
              - focus-metavariable: $R
  pattern-propagators:
    - pattern: $SB.append($X)
      from: $X
      to: $SB
    # 컬렉션에 넣은 값은 컬렉션 전체를 오염시킨다 (요소 단위로는 구분하지 못한다)
    - pattern: $COL.add($X)
      from: $X
      to: $COL
    - pattern: $COL.add($IDX, $X)
      from: $X
      to: $COL
    - pattern: $COL.put($KEY, $X)
      from: $X
      to: $COL
    - pattern: $COL.addAll($X)
      from: $X
      to: $COL
  pattern-sinks:
    # 문자열을 반환하는 핸들러만 본다 (객체 반환은 JSON 으로 직렬화된다).
    # produces 가 브라우저가 HTML 로 해석하지 않는 형식(JSON·text/plain·octet-stream)으로 **보일 때만** 제외한다.
    # text/html, */*, 여러 형식을 나열한 경우, 프로젝트 상수는 제외하지 않는다.
    - patterns:
      - pattern-either:
        - pattern-inside: |
            @RestController
            class $C { ... }
        - pattern-inside: |
            @ResponseBody
            $RET $M(...) { ... }
      - pattern-inside: |
          @$HM(...)
          String $M2(...) { ... }
      - metavariable-regex:
          metavariable: $HM
          regex: ^(Request|Get|Post|Put|Patch|Delete)Mapping$
      - pattern-not-inside:
          patterns:
            - pattern: |
                @$MAP(..., produces = $CT, ...)
                $RET2 $M3(...) { ... }
            # produces 는 Spring 매핑 애너테이션의 것만 본다 (Swagger @ApiOperation(produces=…) 는 문서용이라 응답 형식을 바꾸지 않는다)
            - metavariable-regex:
                metavariable: $MAP
                regex: ^(Request|Get|Post|Put|Patch|Delete)Mapping$
            - metavariable-regex:
                metavariable: $CT
                regex: (?i)^("(application/([a-z0-9.-]+\+)?json|text/plain|application/octet-stream)(\s*;[^"]*)?"|(MediaType\.)?(APPLICATION_(PROBLEM_)?JSON(_UTF8)?|TEXT_PLAIN|APPLICATION_OCTET_STREAM)_VALUE)$
      - pattern: return $X;
      - focus-metavariable: $X
