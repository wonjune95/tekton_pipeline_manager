rules:
- id: mois-1-01-sql-injection-js
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] SQL 삽입: 외부 입력이 SQL 문장 문자열에 이어 붙여져 실행됨(query·execute·Sequelize·Knex raw·TypeORM·Prisma queryRawUnsafe) — 문장은 고정하고 입력은 자리표시자(?·:name 등)와 값 배열·replacements 로 넘길 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-1"
    mois-item: "SQL 삽입"
    cwe: "CWE-89"
    gate: block
  # 참고: semgrep-rules javascript/sequelize/security/audit/sequelize-injection-express.yaml, javascript/express/security/injection/tainted-sql-string.yaml
  # NoSQL(MongoDB 연산자 삽입)은 SQL 문장이 아니고 판단 기준(객체 형태 검사)이 달라 이 규칙에서 다루지 않는다
  options:
    go_deeper_stmt: false
  pattern-sources:
    # (A) 서버 요청 값 (정규식은 가지마다 따로 건다 — 한 묶음에서 일부 가지에만 있는 메타변수에 걸면 나머지 가지가 무효가 된다)
    - patterns:
        - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|params|cookies|signedCookies|headers|originalUrl|url|path|hostname|files|file)$
    - patterns:
        - pattern: $REQ.$GET(...)
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $GET
            regex: ^(get|header|param)$
    - pattern: ctx.query
    - pattern: ctx.params
    - pattern: ctx.headers
    - pattern: ctx.cookies.get(...)
    - patterns:
        - pattern: ctx.request.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|headers|files|url|path)$
    # (A-2) 요청 객체를 구조분해한 핸들러 매개변수: ({ params, query, body }: Request, res) => …  (두 번째 매개변수가 res·response·reply 일 때만)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                ({..., $K, ...}, $RES, ...) => { ... }
            - pattern-inside: |
                ({..., $K, ...}: $T, $RES, ...) => { ... }
            - pattern-inside: |
                function ({..., $K, ...}, $RES, ...) { ... }
            - pattern-inside: |
                function $FN({..., $K, ...}, $RES, ...) { ... }
        - metavariable-regex:
            metavariable: $K
            regex: ^(query|body|params|cookies|headers|files|file)$
        - metavariable-regex:
            metavariable: $RES
            regex: ^(res|response|reply)$
        - pattern: $K
    # (B) NestJS 컨트롤러 매개변수 (숫자 변환 파이프 ParseIntPipe·ParseFloatPipe·ParseBoolPipe·ParseUUIDPipe 를 준 것은 제외)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                $M(..., @$D(...) $P: $T, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P: $T, ...) { ... }
        - metavariable-regex:
            metavariable: $D
            regex: ^(Query|Body|Param|Headers|Req|Request)$
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern-inside: |
                      $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
              - metavariable-regex:
                  metavariable: $PIPE
                  regex: ^Parse(Int|Float|Bool|UUID|Enum)Pipe$
        - focus-metavariable: $P
    # (C) 브라우저 입력
    - patterns:
        - pattern-either:
            - pattern: location.$LOC
            - pattern: window.location.$LOC
            - pattern: document.location.$LOC
        - metavariable-regex:
            metavariable: $LOC
            regex: ^(href|search|hash|pathname)$
    - pattern: document.URL
    - pattern: document.documentURI
    - pattern: document.referrer
    - pattern: window.name
    - patterns:
        - pattern-inside: |
            $W.addEventListener("message", ($E) => { ... })
        - pattern: $E.data
    # Angular ActivatedRoute: this.route.snapshot.queryParams.q · .params · .paramMap.get(...) · .fragment
    - patterns:
        - pattern: $R.snapshot.$P
        - metavariable-regex:
            metavariable: $P
            regex: ^(queryParams|params|queryParamMap|paramMap|fragment)$
    - pattern: useParams()
    - pattern: useSearchParams()
    - pattern: useLocation()
    - pattern: useRouter().query
    - patterns:
        - pattern-inside: |
            $R = useRouter();
            ...
        - pattern: $R.query
  pattern-sanitizers:
    # ── 공통 sanitizer (JS) — 규칙 파일마다 같은 내용. 가지별 증명은 mois-1-05-os-command-injection-js fixture 에서 한다 ──
    # (공통 1) 숫자 변환 결과: parseInt(x) · parseFloat(x) · Number(x) · Number.parseInt(x) · Number.parseFloat(x)
    - patterns:
        - pattern-either:
            - pattern: parseInt(...)
            - pattern: parseFloat(...)
            - pattern: Number(...)
            - pattern: Number.parseInt(...)
            - pattern: Number.parseFloat(...)
    # (공통 2) 허용 목록 검사 — 실패 시 중단 (규약 §1 v2): if (!ALLOWED.includes(x)) { …; return; } 뒤의 x
    #   ALLOWED 는 같은 파일에 const 로 선언한 문자열·숫자 리터럴 배열(또는 new Set([...]))이어야 하고, 선언 뒤 최상위 문장이나
    #   같은 블록에서 push·add·splice 등으로 바꾸지 않아야 한다 (다른 함수 안의 변경은 보지 못한다 — 한계).
    #   조건식은 검사 하나, 또는 null 검사와 || 로 묶은 것만 인정한다 (&&·!(…)·?: 로 감싸면 불인정).
    #   실패 분기 안에서 쓰는 것, 검사 뒤 재대입·덧붙임(같은 블록과 한 단계 안쪽)은 인정하지 않는다.
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if ($COND) { ... return ...; }
                ...
            - pattern-inside: |
                if ($COND) { ... throw $E; }
                ...
            - pattern-inside: |
                if ($COND) return ...;
                ...
            - pattern-inside: |
                if ($COND) throw $E;
                ...
        - pattern-inside: |
            const $ALLOW = $LIT;
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^(?:new\s+Set\(\s*)?\[\s*(?:(?:"[^"\\\n]*"|''[^''\\\n]*''|-?\d+)\s*(?:,\s*)?)*\](?:\s*\))?$'
        - metavariable-pattern:
            metavariable: $COND
            pattern-either:
              - pattern: '!$ALLOW.includes($X)'
              - pattern: '!$ALLOW.has($X)'
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:!?\s*[\w$.]+(?:\s*[!=]==?\s*(?:null|undefined))?\s*\|\|\s*)*!\s*[\w$]+\.(?:includes|has)\(\s*[\w$.]+\s*\)(?:\s*\|\|\s*!?\s*[\w$.]+(?:\s*[!=]==?\s*(?:null|undefined))?)*$'
        - pattern-not-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $X = $V;
            ...
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $X += $V;
            ...
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern: |
                      const $ALLOW = $LIT;
                      ...
                      $ALLOW.$MUT(...);
                      ...
                  - pattern: |
                      $ALLOW.$MUT(...);
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(push|unshift|splice|fill|copyWithin|add|delete|clear|pop|shift)$
        - pattern-not-inside: |
            const $ALLOW = $LIT;
            ...
            $ALLOW[$I] = $V;
            ...
        - pattern-not-inside: |
            $ALLOW[$I] = $V;
            ...
        - pattern: $X
    # (공통 3) 형식 검사 — 실패 시 중단: if (!/^[a-z0-9_-]+$/.test(x)) return …; · if (!Number.isInteger(x)) throw …; 뒤의 x
    #   정규식은 조건에 바로 적은 리터럴이고 ^…$ 로 전체를 고정하며, 글자 묶음이 영문·숫자·_·- 뿐이어야 한다 (. / \ 공백·따옴표 불가)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if ($COND) { ... return ...; }
                ...
            - pattern-inside: |
                if ($COND) { ... throw $E; }
                ...
            - pattern-inside: |
                if ($COND) return ...;
                ...
            - pattern-inside: |
                if ($COND) throw $E;
                ...
        - metavariable-pattern:
            metavariable: $COND
            pattern-either:
              - pattern: '!$RE.test($X)'
              - pattern: '!Number.isInteger($X)'
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:!?\s*[\w$.]+(?:\s*[!=]==?\s*(?:null|undefined))?\s*\|\|\s*)*!\s*(?:/\^(?:(?:\[(?:[A-Za-z0-9_]|\\[wd]|\\?-)+\]|\\[wd]|[A-Za-z0-9_])(?:[+*?]|\{\d+(?:,\d*)?\})?)+\$/[gimsuy]*\.test|Number\.isInteger)\(\s*[\w$.]+\s*\)(?:\s*\|\|\s*!?\s*[\w$.]+(?:\s*[!=]==?\s*(?:null|undefined))?)*$'
        - pattern-not-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $X = $V;
            ...
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $X += $V;
            ...
        - pattern: $X
    # (공통 4) 조건 안에서만 사용: if (ALLOWED.includes(x)) { use(x) } — else 없는 if, 조건은 검사 하나뿐 (&&·|| 로 묶으면 불인정)
    - patterns:
        - pattern-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S; else $S2;
        - pattern-inside: |
            const $ALLOW = $LIT;
            ...
        - metavariable-regex:
            metavariable: $LIT
            regex: '^(?:new\s+Set\(\s*)?\[\s*(?:(?:"[^"\\\n]*"|''[^''\\\n]*''|-?\d+)\s*(?:,\s*)?)*\](?:\s*\))?$'
        - metavariable-pattern:
            metavariable: $COND
            pattern-either:
              - pattern: $ALLOW.includes($X)
              - pattern: $ALLOW.has($X)
        - metavariable-regex:
            metavariable: $COND
            regex: '^[\w$]+\.(?:includes|has)\(\s*[\w$.]+\s*\)$'
        - pattern-not-inside: |
            if ($COND) { ... $X = $V; ... }
        - pattern-not-inside: |
            if ($COND) { ... $X += $V; ... }
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern: |
                      const $ALLOW = $LIT;
                      ...
                      $ALLOW.$MUT(...);
                      ...
                  - pattern: |
                      $ALLOW.$MUT(...);
                      ...
              - metavariable-regex:
                  metavariable: $MUT
                  regex: ^(push|unshift|splice|fill|copyWithin|add|delete|clear|pop|shift)$
        - pattern-not-inside: |
            const $ALLOW = $LIT;
            ...
            $ALLOW[$I] = $V;
            ...
        - pattern-not-inside: |
            $ALLOW[$I] = $V;
            ...
        - pattern: $X
    # (공통 5) 조건 안에서만 사용: if (/^[a-z0-9_-]+$/.test(x)) · if (Number.isInteger(x)) · if (x === "리터럴")
    - patterns:
        - pattern-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S; else $S2;
        - metavariable-pattern:
            metavariable: $COND
            pattern-either:
              - pattern: $RE.test($X)
              - pattern: Number.isInteger($X)
              - pattern: $X === $L
        - metavariable-regex:
            metavariable: $COND
            regex: '^(?:(?:/\^(?:(?:\[(?:[A-Za-z0-9_]|\\[wd]|\\?-)+\]|\\[wd]|[A-Za-z0-9_])(?:[+*?]|\{\d+(?:,\d*)?\})?)+\$/[gimsuy]*\.test|Number\.isInteger)\(\s*[\w$.]+\s*\)|[\w$.]+\s*===\s*(?:"[^"\\\n]*"|''[^''\\\n]*''|-?\d+))$'
        - pattern-not-inside: |
            if ($COND) { ... $X = $V; ... }
        - pattern-not-inside: |
            if ($COND) { ... $X += $V; ... }
        - pattern: $X
    # DB 드라이버의 값 이스케이프: pg escapeLiteral · escapeIdentifier, mysql escapeId · mysql/mysql2/sqlstring 모듈의 escape
    - patterns:
        - pattern: $C.$FN(...)
        - metavariable-regex:
            metavariable: $FN
            regex: ^(escapeLiteral|escapeIdentifier|escapeId)$
    - patterns:
        - pattern-either:
            - pattern-inside: |
                $SQ = require("$M");
                ...
            - pattern-inside: |
                import * as $SQ from "$M";
                ...
            - pattern-inside: |
                import $SQ from "$M";
                ...
        - metavariable-regex:
            metavariable: $M
            regex: ^(mysql|mysql2|mysql2/promise|sqlstring)$
        - pattern: $SQ.escape(...)
  pattern-sinks:
    # 문장 문자열을 받는 실행 함수: mysql·mysql2 query·execute, pg query, Sequelize query, TypeORM query, mssql query, better-sqlite3 prepare, postgres.js unsafe, Knex raw·whereRaw 류, Prisma $queryRawUnsafe·$executeRawUnsafe
    #   첫 인자(문장)만 본다 — 값 배열(db.query("… ?", [x]))·replacements·bind 는 안전하므로 보지 않는다.
    #   객체로 넘기는 형태는 문장 항목(sql·text)만 본다: db.query({ sql, values })
    - patterns:
        - pattern: $DB.$FN($Q, ...)
        - metavariable-regex:
            metavariable: $FN
            regex: ^(query|execute|prepare|raw|unsafe|\$queryRawUnsafe|\$executeRawUnsafe|whereRaw|orWhereRaw|andWhereRaw|havingRaw|orHavingRaw|orderByRaw|groupByRaw|joinRaw|fromRaw|selectRaw)$
        - pattern-not: '$DB.$FN({...}, ...)'
        - focus-metavariable: $Q
    - patterns:
        - pattern-either:
            - pattern: '$DB.$FN({..., sql: $Q, ...}, ...)'
            - pattern: '$DB.$FN({..., text: $Q, ...}, ...)'
        - metavariable-regex:
            metavariable: $FN
            regex: ^(query|execute)$
        - focus-metavariable: $Q
    # Sequelize.literal · sequelize.literal · import { literal } from "sequelize", Prisma.raw (원문 그대로 SQL 에 들어간다)
    - patterns:
        - pattern-either:
            - pattern: $S.literal($Q)
            - pattern: Prisma.raw($Q)
            - patterns:
                - pattern-inside: |
                    import { literal } from "sequelize";
                    ...
                - pattern: literal($Q)
        - focus-metavariable: $Q
    # TypeORM QueryBuilder 의 조건·정렬 문자열: createQueryBuilder(…).where(문자열) — 같은 식 또는 같은 함수의 변수로 확인되는 것만
    - patterns:
        - pattern-either:
            - patterns:
                - pattern: $QB.$FN($Q, ...)
                - metavariable-pattern:
                    metavariable: $QB
                    pattern: $R.createQueryBuilder(...)
            - patterns:
                - pattern-inside: |
                    $V = $R.createQueryBuilder(...);
                    ...
                - pattern: $QB.$FN($Q, ...)
                - metavariable-pattern:
                    metavariable: $QB
                    pattern: $V
        - metavariable-regex:
            metavariable: $FN
            regex: ^(where|andWhere|orWhere|having|andHaving|orHaving|orderBy|addOrderBy|groupBy|addGroupBy|select|addSelect)$
        - pattern-not: '$QB.$FN({...}, ...)'
        - focus-metavariable: $Q
