rules:
- id: mois-1-04-xss-js
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] 크로스사이트 스크립트: 외부 입력이 HTML 이스케이프 없이 응답 본문(res.send·write·end, Koa ctx.body)이나 HTML 을 해석하는 화면 API(innerHTML·outerHTML·insertAdjacentHTML·document.write·jQuery html()·dangerouslySetInnerHTML·bypassSecurityTrustHtml)에 들어감 — 화면에는 textContent·JSX 텍스트로 출력하고, HTML 로 넣어야 하면 escape-html·he.encode 로 이스케이프하거나 DOMPurify.sanitize 로 정화할 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-4"
    mois-item: "크로스사이트 스크립트"
    cwe: "CWE-79"
    gate: block
  # 참고: semgrep-rules javascript/express/security/audit/xss/direct-response-write.yaml, javascript/browser/security/insecure-document-method.yaml,
  #       javascript/jquery/security/audit/jquery-insecure-method.yaml
  pattern-sources:
    # (A) 서버 요청 값 (정규식은 가지마다 따로 건다 — 한 묶음에서 일부 가지에만 있는 메타변수에 걸면 나머지 가지가 무효가 된다)
    - patterns:
        - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|params|cookies|signedCookies|headers|originalUrl|url|path|hostname|files|file)$
    - patterns:
        - pattern: $REQ.$GET(...)
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $GET
            regex: ^(get|header|param)$
    - pattern: ctx.query
    - pattern: ctx.params
    - pattern: ctx.headers
    - pattern: ctx.cookies.get(...)
    - patterns:
        - pattern: ctx.request.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|headers|files|url|path)$
    # (A-2) 요청 객체를 구조분해한 핸들러 매개변수: ({ params, query, body }: Request, res) => …  (두 번째 매개변수가 res·response·reply 일 때만)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                ({..., $K, ...}, $RES, ...) => { ... }
            - pattern-inside: |
                ({..., $K, ...}: $T, $RES, ...) => { ... }
            - pattern-inside: |
                function ({..., $K, ...}, $RES, ...) { ... }
            - pattern-inside: |
                function $FN({..., $K, ...}, $RES, ...) { ... }
        - metavariable-regex:
            metavariable: $K
            regex: ^(query|body|params|cookies|headers|files|file)$
        - metavariable-regex:
            metavariable: $RES
            regex: ^(res|response|reply)$
        - pattern: $K
    # (B) NestJS 컨트롤러 매개변수 (숫자 변환 파이프 ParseIntPipe·ParseFloatPipe·ParseBoolPipe·ParseUUIDPipe 를 준 것은 제외)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                $M(..., @$D(...) $P: $T, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P: $T, ...) { ... }
        - metavariable-regex:
            metavariable: $D
            regex: ^(Query|Body|Param|Headers|Req|Request)$
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern-inside: |
                      $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
              - metavariable-regex:
                  metavariable: $PIPE
                  regex: ^Parse(Int|Float|Bool|UUID|Enum)Pipe$
        - focus-metavariable: $P
    # (C) 브라우저 입력
    - patterns:
        - pattern-either:
            - pattern: location.$LOC
            - pattern: window.location.$LOC
            - pattern: document.location.$LOC
        - metavariable-regex:
            metavariable: $LOC
            regex: ^(href|search|hash|pathname)$
    - pattern: document.URL
    - pattern: document.documentURI
    - pattern: document.referrer
    - pattern: window.name
    - patterns:
        - pattern-inside: |
            $W.addEventListener("message", ($E) => { ... })
        - pattern: $E.data
    # Angular ActivatedRoute: this.route.snapshot.queryParams.q · .params · .paramMap.get(...) · .fragment
    - patterns:
        - pattern: $R.snapshot.$P
        - metavariable-regex:
            metavariable: $P
            regex: ^(queryParams|params|queryParamMap|paramMap|fragment)$
    - pattern: useParams()
    - pattern: useSearchParams()
    - pattern: useLocation()
    - pattern: useRouter().query
    - patterns:
        - pattern-inside: |
            $R = useRouter();
            ...
        - pattern: $R.query
  pattern-sanitizers:
    # 이스케이프 · 정화 함수는 "출력 위치"를 증명할 수 있을 때만 인정한다 (xss-py 와 같은 생각).
    #  - 인정하는 함수: escape-html, he.encode·he.escape, lodash escape, validator.escape (& < > " ' 를 바꾼다),
    #    DOMPurify.sanitize·sanitize-html 의 인자 하나짜리 호출(기본 설정. 옵션을 주면 script·on…= 를 허용할 수 있어 인정하지 않는다),
    #    encodeURIComponent (< > 를 남기지 않는다), Number·parseInt·parseFloat (숫자만 남는다).
    #    이름만 보지 않고 import · require 로 그 패키지에서 온 이름인지 확인한다 (DOMPurify 는 브라우저 전역 이름도 인정).
    #  - 출력 위치: 결과를 태그 안(속성 값 · 이벤트 핸들러 · href·src)이나 닫히지 않은 <script 안에 끼워 넣으면 인정하지 않는다.
    #    이스케이프는 javascript: URL·이벤트 핸들러를 막지 못하고, DOMPurify·encodeURIComponent 는 따옴표를 바꾸지 않는다.
    #    보는 모양: "…" + 호출, `…${호출}…`, 결과를 변수에 받았다가 "…" + 변수 로 쓰는 것.
    #    결과를 변수에 받았다가 템플릿(`…${변수}…`)에 넣으면 위치와 무관하게 인정하지 않는다.
    #    (속성 값 전체를 막으므로 따옴표 안 일반 속성 값에 이스케이프한 값도 탐지된다 — 오탐 쪽)
    #  - 한계 (탐지 못 함): 이스케이프 결과를 다른 변수로 복사하거나 += · join · 배열로 조립한 뒤 위험한 위치에 넣는 경우, <style>·style= 안.
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    - pattern-inside: |
                        import $E from "escape-html";
                        ...
                    - pattern-inside: |
                        $E = require("escape-html");
                        ...
                    - pattern-inside: |
                        import $E from "lodash/escape";
                        ...
                    - pattern-inside: |
                        $E = require("lodash/escape");
                        ...
                    - pattern-inside: |
                        import { escape as $E } from "lodash";
                        ...
                    - pattern-inside: |
                        import $E from "sanitize-html";
                        ...
                    - pattern-inside: |
                        $E = require("sanitize-html");
                        ...
                - pattern: $E($X)
            - patterns:
                - pattern-either:
                    - pattern-inside: |
                        import $M from "$PKG";
                        ...
                    - pattern-inside: |
                        import * as $M from "$PKG";
                        ...
                    - pattern-inside: |
                        $M = require("$PKG");
                        ...
                - pattern-either:
                    - pattern: $M.$FN($X)
                - metavariable-regex:
                    metavariable: $PKG
                    regex: ^(he|lodash|underscore|validator|dompurify|isomorphic-dompurify)$
                - metavariable-regex:
                    metavariable: $FN
                    regex: ^(encode|escape|sanitize)$
            - pattern: DOMPurify.sanitize($X)
            - pattern: _.escape($X)
            - pattern: encodeURIComponent($X)
            - pattern: Number($X)
            - pattern: parseInt($X, ...)
            - pattern: parseFloat($X)
        # 태그 안 · <script 안에 이어 붙임: "<a title='" + esc(x)
        - pattern-not-inside:
            patterns:
              - pattern: $L + <... $SAN($X, ...) ...>
              - metavariable-regex:
                  metavariable: $L
                  regex: (?is)^.*(?:<[^<>]*|<script\b(?:(?!</script).)*)["'`]$
        # 태그 안 · <script 안의 템플릿 자리: `<a href="${esc(x)}">`
        - pattern-not-inside:
            patterns:
              - pattern: $T
              - metavariable-regex:
                  metavariable: $T
                  regex: (?is)^`.*(?:<[^<>]*|<script\b(?:(?!</script).)*)\$\{
        # 결과를 변수에 받았다가 위험한 위치에 넣는 경우: e = esc(x); "<a href='" + e  /  `<a href="${e}">`
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  $S = $SAN($X, ...);
                  ...
                  <... $L + $S ...>;
              - pattern: $SAN($X, ...)
              - metavariable-regex:
                  metavariable: $L
                  regex: (?is)^.*(?:<[^<>]*|<script\b(?:(?!</script).)*)["'`]$
        # 템플릿에 넣은 경우는 위치를 가리지 않고 인정하지 않는다: e = esc(x); `…${e}…` (오탐 쪽)
        # (템플릿을 메타변수로 묶어 위치를 정규식으로 보면 큰 파일에서 시간 초과가 난다)
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  $S = $SAN($X, ...);
                  ...
                  <... `...${$S}...` ...>;
              - pattern: $SAN($X, ...)
  pattern-sinks:
    # (1) 서버 응답 본문: Express·Next.js API·Node http 의 res.send·write·end (체인 res.status(…).send 포함).
    #     Express 는 문자열을 Content-Type 없이 보내면 text/html 로 응답한다. Node http 는 형식을 안 붙여 브라우저가 내용을 보고 정한다.
    #     제외: JSON 으로 응답되는 객체·배열 리터럴과 요청 객체 통째(req.query 등), 같은 체인이나 앞 문장에서
    #     HTML 이 아닌 형식(text/plain·application/json 등)을 리터럴로 지정한 응답. res.json·jsonp 는 sink 가 아니다.
    #     한계: 형식 지정이 if 안에 있거나 다른 함수(미들웨어)에 있으면 보지 못한다 (탐지된다 — 오탐 쪽)
    - patterns:
        - pattern-either:
            - pattern: $RES. ... .send($B)
            - pattern: $RES. ... .write($B, ...)
            - pattern: $RES. ... .end($B, ...)
        - metavariable-regex:
            metavariable: $RES
            regex: ^(res|resp|response)$
        - pattern-not: $RES. ... .send({...})
        - pattern-not: $RES. ... .send([...])
        - pattern-not:
            patterns:
              - pattern: $RES. ... .send($REQ.$OBJ)
              - metavariable-regex:
                  metavariable: $OBJ
                  regex: ^(query|params|headers|cookies|signedCookies)$
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern: $RES. ... .type("$CT"). ... .$OUT(...)
                  - pattern: $RES. ... .contentType("$CT"). ... .$OUT(...)
                  - pattern-inside: |
                      $RES. ... .type("$CT");
                      ...
                  - pattern-inside: |
                      $RES. ... .contentType("$CT");
                      ...
              - pattern: $RES. ... .$OUT(...)
              - metavariable-regex:
                  metavariable: $CT
                  regex: (?i)^(text/plain|text/csv|text/event-stream|application/json|application/octet-stream|application/pdf|txt|json|csv|bin|pdf)\s*(;.*)?$
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern: $RES. ... .$SETH("$H", "$CT"). ... .$OUT(...)
                  - pattern-inside: |
                      $RES. ... .$SETH("$H", "$CT");
                      ...
                  - pattern-inside: |
                      $RES.writeHead($ST, {..., "$H": "$CT", ...});
                      ...
                  - pattern-inside: |
                      $RES.writeHead($ST, $MSG, {..., "$H": "$CT", ...});
                      ...
              - pattern: $RES. ... .$OUT(...)
              - metavariable-regex:
                  metavariable: $H
                  regex: (?i)^content-type$
              - metavariable-regex:
                  metavariable: $CT
                  regex: (?i)^(text/plain|text/csv|text/event-stream|application/json|application/octet-stream|application/pdf)\s*(;.*)?$
        - focus-metavariable: $B
    # (2) HTML 형식을 직접 지정한 응답 (Fastify reply 등 기본 형식이 text/plain 인 프레임워크도): reply.type("text/html").send(x)
    - patterns:
        - pattern-either:
            - pattern: $R. ... .type("$CT"). ... .send($B)
            - pattern: $R. ... .header("$H", "$CT"). ... .send($B)
            - pattern: |
                $R.type("$CT");
                ...
                $R.send($B);
        - metavariable-regex:
            metavariable: $CT
            regex: (?i)^(text/html|html|application/xhtml\+xml|image/svg\+xml)
        - focus-metavariable: $B
    # (3) Koa ctx.body: 문자열이 < 로 시작하면 text/html 로 응답한다. 객체·배열 리터럴과 ctx.query 등 객체 통째는 JSON 이라 제외,
    #     앞 문장에서 ctx.type 을 HTML 이 아닌 형식으로 정했으면 제외
    - patterns:
        - pattern-either:
            - pattern: ctx.body = $B
            - pattern: ctx.response.body = $B
        - pattern-not: ctx.body = {...}
        - pattern-not: ctx.body = [...]
        - pattern-not:
            patterns:
              - pattern: ctx.body = ctx.$OBJ
              - metavariable-regex:
                  metavariable: $OBJ
                  regex: ^(query|params|headers)$
        - pattern-not-inside:
            patterns:
              - pattern-inside: |
                  ctx.type = "$CT";
                  ...
              - pattern: ctx.body = $B
              - metavariable-regex:
                  metavariable: $CT
                  regex: (?i)^(text/plain|text/csv|text/event-stream|application/json|application/octet-stream|application/pdf|txt|json|csv|bin|pdf)\s*(;.*)?$
        - focus-metavariable: $B
    # (4) 브라우저에서 HTML 로 해석하는 API, 이스케이프를 끄는 표시
    - patterns:
        - pattern-either:
            - pattern: $O.innerHTML = $B
            - pattern: $O.outerHTML = $B
            - pattern: $O.innerHTML += $B
            - pattern: $O.outerHTML += $B
            - pattern: $O.srcdoc = $B
            - pattern: $O.insertAdjacentHTML($P, $B)
            - pattern: $O.createContextualFragment($B)
            - pattern: document.write(..., $B, ...)
            - pattern: document.writeln(..., $B, ...)
            # React · Angular · Handlebars 가 이스케이프하지 않는 자리
            - pattern: <$EL dangerouslySetInnerHTML={$B} />
            - pattern: "{..., dangerouslySetInnerHTML: $B, ...}"
            - pattern: $S.bypassSecurityTrustHtml($B)
            - pattern: $S.bypassSecurityTrustScript($B)
            - pattern: $S.bypassSecurityTrustStyle($B)
            - pattern: new $HB.SafeString($B)
        - focus-metavariable: $B
    # (5) jQuery: 값을 HTML 로 해석하는 메서드와 $(값) (값이 < 로 시작하면 요소를 만든다)
    - patterns:
        - pattern-either:
            - pattern: $(...). ... .$JQ(..., $B, ...)
            - pattern: jQuery(...). ... .$JQ(..., $B, ...)
            - pattern: |
                $V = $(...);
                ...
                $V.$JQ(..., $B, ...);
            - pattern: |
                $V = jQuery(...);
                ...
                $V.$JQ(..., $B, ...);
        - metavariable-regex:
            metavariable: $JQ
            regex: ^(html|append|prepend|after|before|replaceWith|wrap|wrapAll|wrapInner)$
        - focus-metavariable: $B
    - patterns:
        - pattern-either:
            - pattern: $($B)
            - pattern: jQuery($B)
        - focus-metavariable: $B
    # (6) NestJS 컨트롤러가 문자열을 반환하면 text/html 로 응답한다. 문자열 리터럴 · 템플릿으로 시작하는 반환값만 본다
    #     (객체·서비스 호출 결과는 JSON 일 수 있어 보지 않는다 — 한계: 변수에 담은 HTML 문자열 반환은 탐지 못 함)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                @$HTTP(...)
                $F(...) { ... }
            - pattern-inside: |
                @$HTTP(...)
                async $F(...) { ... }
        - metavariable-regex:
            metavariable: $HTTP
            regex: ^(Get|Post|Put|Patch|Delete|All)$
        - pattern: return $B
        - metavariable-regex:
            metavariable: $B
            regex: ^["'`]
        - focus-metavariable: $B
