rules:
- id: mois-1-10-ldap-injection-js
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] LDAP 삽입: 외부 입력이 이스케이프 없이 LDAP 검색 필터·기준 DN 에 사용됨 — 필터는 ldap-escape 의 ldapEscape.filter`…` 로 만들거나 EqualityFilter 등 필터 객체로 값을 넘기고, 기준 DN 은 상수로 둘 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-10"
    mois-item: "LDAP 삽입"
    cwe: "CWE-90"
    gate: block
  # 대상: ldapjs · ldapts 의 search(기준 DN, { filter }) — 두 번째 인자가 filter 키를 가진 객체(리터럴 또는 같은 함수에서 만든 변수)인
  #       search 호출은 LDAP 클라이언트 전용 모양이다. ldapjs.parseFilter(문자열).
  # 정화: ldap-escape 의 filter 태그 템플릿, 필터 객체(new EqualityFilter({ attribute, value }) 등 — 직렬화할 때 값을 이스케이프한다),
  #       Number · parseInt. ldapEscape.dn 은 필터에 쓰면 ( ) * 를 막지 못해 정화로 보지 않는다 (DN 자리도 탐지된다 — 오탐 쪽).
  # 한계: bind DN · modify · del 의 DN 은 보지 않는다 (Python 규칙과 같다). 옵션 객체를 다른 함수에서 만들거나 opts.filter = 로 나중에 넣으면 놓친다. 함수 안 taint 만.
  pattern-sources:
    # (A) 서버 요청 값 (정규식은 가지마다 따로 건다 — 한 묶음에서 일부 가지에만 있는 메타변수에 걸면 나머지 가지가 무효가 된다)
    - patterns:
        - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|params|cookies|signedCookies|headers|originalUrl|url|path|hostname|files|file)$
    - patterns:
        - pattern: $REQ.$GET(...)
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $GET
            regex: ^(get|header|param)$
    - pattern: ctx.query
    - pattern: ctx.params
    - pattern: ctx.headers
    - pattern: ctx.cookies.get(...)
    - patterns:
        - pattern: ctx.request.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|headers|files|url|path)$
    # (A-2) 요청 객체를 구조분해한 핸들러 매개변수: ({ params, query, body }: Request, res) => …  (두 번째 매개변수가 res·response·reply 일 때만)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                ({..., $K, ...}, $RES, ...) => { ... }
            - pattern-inside: |
                ({..., $K, ...}: $T, $RES, ...) => { ... }
            - pattern-inside: |
                function ({..., $K, ...}, $RES, ...) { ... }
            - pattern-inside: |
                function $FN({..., $K, ...}, $RES, ...) { ... }
        - metavariable-regex:
            metavariable: $K
            regex: ^(query|body|params|cookies|headers|files|file)$
        - metavariable-regex:
            metavariable: $RES
            regex: ^(res|response|reply)$
        - pattern: $K
    # (B) NestJS 컨트롤러 매개변수 (숫자 변환 파이프 ParseIntPipe·ParseFloatPipe·ParseBoolPipe·ParseUUIDPipe 를 준 것은 제외)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                $M(..., @$D(...) $P: $T, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P: $T, ...) { ... }
        - metavariable-regex:
            metavariable: $D
            regex: ^(Query|Body|Param|Headers|Req|Request)$
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern-inside: |
                      $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
              - metavariable-regex:
                  metavariable: $PIPE
                  regex: ^Parse(Int|Float|Bool|UUID|Enum)Pipe$
        - focus-metavariable: $P
    # (C) 브라우저 입력
    - patterns:
        - pattern-either:
            - pattern: location.$LOC
            - pattern: window.location.$LOC
            - pattern: document.location.$LOC
        - metavariable-regex:
            metavariable: $LOC
            regex: ^(href|search|hash|pathname)$
    - pattern: document.URL
    - pattern: document.documentURI
    - pattern: document.referrer
    - pattern: window.name
    - patterns:
        - pattern-inside: |
            $W.addEventListener("message", ($E) => { ... })
        - pattern: $E.data
    # Angular ActivatedRoute: this.route.snapshot.queryParams.q · .params · .paramMap.get(...) · .fragment
    - patterns:
        - pattern: $R.snapshot.$P
        - metavariable-regex:
            metavariable: $P
            regex: ^(queryParams|params|queryParamMap|paramMap|fragment)$
    - pattern: useParams()
    - pattern: useSearchParams()
    - pattern: useLocation()
    - pattern: useRouter().query
    - patterns:
        - pattern-inside: |
            $R = useRouter();
            ...
        - pattern: $R.query
  pattern-sanitizers:
    - pattern: $LE.filter`...`
    - patterns:
        - pattern-either:
            - pattern: new $FILTER(...)
            - pattern: new $NS.$FILTER(...)
        - metavariable-regex:
            metavariable: $FILTER
            regex: ^(Equality|Substring|Approximate|GreaterThanEquals|LessThanEquals|Presence|Extensible)Filter$
    - pattern: Number($X)
    - pattern: parseInt($X, ...)
  pattern-sinks:
    - patterns:
        - pattern-either:
            - pattern: '$C.search($BASE, {..., filter: $F, ...}, ...)'
            - pattern: |
                $OPTS = {..., filter: $F, ...};
                ...
                $C.search($BASE, $OPTS, ...);
        - focus-metavariable: $F
    # 기준 DN (같은 모양의 search 호출일 때만)
    - patterns:
        - pattern-either:
            - pattern: '$C.search($BASE, {..., filter: $F, ...}, ...)'
            - patterns:
                - pattern-inside: |
                    $OPTS = {..., filter: $F, ...};
                    ...
                - pattern: $C.search($BASE, $OPTS, ...)
        - focus-metavariable: $BASE
    - patterns:
        - pattern: ldapjs.parseFilter($F)
        - focus-metavariable: $F
