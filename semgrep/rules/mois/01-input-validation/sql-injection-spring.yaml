rules:
- id: mois-1-01-sql-injection-spring
  mode: taint
  languages: [java]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] SQL 삽입: 외부 입력이 검증 없이 JdbcTemplate·JPA·Hibernate 질의문에 사용됨"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-1"
    mois-item: "SQL 삽입"
    cwe: "CWE-89"
    gate: block
  pattern-sources:
    - patterns:
        - pattern-either:
            - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GET(...)
            - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GET(...)
        - metavariable-regex:
            metavariable: $GET
            regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getRequestURI|getRequestURL|getPathInfo|getCookies|getInputStream|getReader|getPart|getParts)$
    - pattern: (javax.servlet.http.Cookie $CK).getValue()
    - pattern: (jakarta.servlet.http.Cookie $CK).getValue()
    # 요청을 감싼 표준 객체: Spring 멀티파트·WebRequest, cos MultipartRequest, 업로드 파일의 원본 이름
    - patterns:
        - pattern-either:
            - pattern: (org.springframework.web.multipart.MultipartHttpServletRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.multipart.MultipartRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.context.request.WebRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.context.request.NativeWebRequest $REQ).$GET(...)
            - pattern: (com.oreilly.servlet.MultipartRequest $REQ).$GET(...)
            - pattern: (javax.servlet.ServletRequest $REQ).$GET(...)
            - pattern: (jakarta.servlet.ServletRequest $REQ).$GET(...)
        - metavariable-regex:
            metavariable: $GET
            regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaderValues|getHeaderNames|getFilesystemName|getOriginalFileName|getFileNames|getInputStream|getReader)$
    - pattern: (org.springframework.web.multipart.MultipartFile $MF).getOriginalFilename()
    - patterns:
        - pattern-either:
            - pattern: $RET $M(..., @$A(...) $T $P, ...) { ... }
            - pattern: $RET $M(..., @$A $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $A
            regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|ModelAttribute|MatrixVariable)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|Integer|Long|Short|Byte|Double|Float|Boolean|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime)$).*
        - focus-metavariable: $P
    # Spring MVC 는 애너테이션이 없는 핸들러 매개변수도 요청 값으로 채운다 (단순형은 요청 파라미터, 객체는 폼 바인딩).
    # 숫자·날짜형과 프레임워크가 넣어 주는 객체(요청·응답·세션·모델 등), 요청과 무관한 애너테이션은 제외
    - patterns:
        - pattern-either:
            - pattern: |
                @$MAP(...)
                $RET $M(..., $T $P, ...) { ... }
            - pattern: |
                @$MAP
                $RET $M(..., $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $MAP
            regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|ModelAndView|Map|BindingResult|Errors|Locale|TimeZone|Principal|Authentication|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort|WebRequest|NativeWebRequest|InputStream|OutputStream|Reader|Writer|HttpMethod)\b).*
        # 애너테이션이 붙은 매개변수는 여기서 보지 않는다. 요청 바인딩 애너테이션은 위 항목, 검증 애너테이션은 아래 항목이 본다.
        # 그 밖의 애너테이션(@AuthenticationPrincipal, 직접 만든 @CurrentUser 등)은 요청 값이 아니라 프레임워크·리졸버가 넣는 값이다
        - pattern-not: $RET $M(..., @$ANN(...) $T $P, ...) { ... }
        - focus-metavariable: $P
    # 검증 애너테이션만 붙은 핸들러 매개변수(@Valid MemberForm form)도 요청 값으로 채워진다
    - patterns:
        - pattern: |
            @$MAP(...)
            $RET $M(..., @$VA(...) $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $MAP
            regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
        - metavariable-regex:
            metavariable: $VA
            regex: ^(Valid|Validated|NotNull|NotBlank|NotEmpty|Size|Pattern|Length|Email|Nullable|NonNull)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|ModelAndView|Map|BindingResult|Errors|Locale|TimeZone|Principal|Authentication|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort|WebRequest|NativeWebRequest|InputStream|OutputStream|Reader|Writer|HttpMethod)\b).*
        - focus-metavariable: $P
  pattern-sanitizers:
    # 숫자로 변환한 "결과"만 질의문을 바꿀 수 없다 (변환한 반환값을 써야 한다).
    # exact: 변환 식의 결과만 안전하고, 인자 안에서 일어나는 일은 그대로 본다 —
    #   Integer.parseInt(conn.prepareStatement("… " + 입력).executeQuery().getString(1)) 의 안쪽 질의문,
    #   Integer.parseInt(id = 입력) 처럼 인자 안에서 대입된 변수 (exact 가 없으면 변환 식 범위 전체가 지워져 미탐).
    # exact 는 변수에 받는 문장(int id = Integer.parseInt(…);)에는 식 패턴만으로 맞지 않아 문장 형태를 따로 적는다
    - pattern: Integer.parseInt(...)
      exact: true
    - pattern: $NUM = Integer.parseInt(...);
      exact: true
    - pattern: Long.parseLong(...)
      exact: true
    - pattern: $NUM = Long.parseLong(...);
      exact: true
  pattern-propagators:
    - pattern: $SB.append($X)
      from: $X
      to: $SB
    # 컬렉션에 넣은 값은 컬렉션 전체를 오염시킨다 (요소 단위로는 구분하지 못한다)
    - pattern: $COL.add($X)
      from: $X
      to: $COL
    - pattern: $COL.add($IDX, $X)
      from: $X
      to: $COL
    - pattern: $COL.put($KEY, $X)
      from: $X
      to: $COL
    - pattern: $COL.addAll($X)
      from: $X
      to: $COL
  pattern-sinks:
    # JdbcTemplate 계열: 수신 객체를 타입으로 알아보거나, 타입을 알 수 없으면 이름으로 알아본다. 메서드 이름 목록은 하나만 둔다
    - patterns:
        - pattern-either:
            - pattern: (org.springframework.jdbc.core.JdbcTemplate $J).$M($SQL, ...)
            - pattern: (org.springframework.jdbc.core.JdbcOperations $J).$M($SQL, ...)
            - pattern: (org.springframework.jdbc.core.namedparam.NamedParameterJdbcTemplate $J).$M($SQL, ...)
            - pattern: (org.springframework.jdbc.core.namedparam.NamedParameterJdbcOperations $J).$M($SQL, ...)
            # 타입을 알 수 없는 수신 객체: getJdbcTemplate().query(sql), Dao.jdbcTemplate.update(sql) — 이름에 jdbcTemplate·jdbcOperations 가 있을 때만
            - patterns:
                - pattern: $J.$M($SQL, ...)
                - metavariable-regex:
                    metavariable: $J
                    regex: (?i).*jdbc\w*(template|operations).*
        - metavariable-regex:
            metavariable: $M
            regex: ^(query|queryForList|queryForObject|queryForMap|queryForRowSet|queryForStream|queryForLong|queryForInt|update|execute|batchUpdate)$
        - focus-metavariable: $SQL
    # batchUpdate(String... sql) 은 두 번째부터의 인자도 질의문이다 (첫 인자만 보면 batchUpdate("SET …", "TRUNCATE TABLE " + 입력) 미탐).
    # 두 번째 인자가 바인딩 값 묶음으로 "확인되는" 호출 batchUpdate(sql, 값 묶음, ...) 만 뺀다:
    # List·Collection·SqlParameterSource[]·Map[] 로 선언된 변수, SqlParameterSourceUtils.createBatch(...).
    # 타입을 알 수 없는 인자(메서드 호출 결과 등)는 질의문일 수 있으므로 탐지한다
    - patterns:
        - pattern-either:
            - pattern: (org.springframework.jdbc.core.JdbcTemplate $J).batchUpdate($FIRST, ..., $SQL, ...)
            - pattern: (org.springframework.jdbc.core.JdbcOperations $J).batchUpdate($FIRST, ..., $SQL, ...)
            - patterns:
                - pattern: $J.batchUpdate($FIRST, ..., $SQL, ...)
                - metavariable-regex:
                    metavariable: $J
                    regex: (?i).*jdbc\w*(template|operations).*
        - pattern-not: $J.batchUpdate($FIRST, (java.util.List<$T> $ROWS), ...)
        - pattern-not: $J.batchUpdate($FIRST, (java.util.Collection<$T> $ROWS), ...)
        - pattern-not: $J.batchUpdate($FIRST, (org.springframework.jdbc.core.namedparam.SqlParameterSource[] $ROWS), ...)
        - pattern-not: $J.batchUpdate($FIRST, (java.util.Map<$K, $V>[] $ROWS), ...)
        - pattern-not: $J.batchUpdate($FIRST, SqlParameterSourceUtils.createBatch(...), ...)
        - focus-metavariable: $SQL
    - patterns:
        - pattern-either:
            - pattern: (javax.persistence.EntityManager $EM).$M($SQL, ...)
            - pattern: (jakarta.persistence.EntityManager $EM).$M($SQL, ...)
        - metavariable-regex:
            metavariable: $M
            regex: ^(createQuery|createNativeQuery)$
        - focus-metavariable: $SQL
    - patterns:
        - pattern-either:
            - pattern: (org.hibernate.Session $S).$M($SQL, ...)
            - pattern: (org.hibernate.StatelessSession $S).$M($SQL, ...)
        - metavariable-regex:
            metavariable: $M
            regex: ^(createQuery|createSQLQuery|createNativeQuery|createSelectionQuery|createMutationQuery|createNativeMutationQuery)$
        - focus-metavariable: $SQL
