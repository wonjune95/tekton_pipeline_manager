  # 목록에 나중에 넣은 값도 목록 전체를 오염시킨다 (Semgrep 은 Python 의 append · extend · insert 를 따라가지 않는다):
  # cmd = ["sh", "-c"]; cmd.append(x); subprocess.run(cmd)
  pattern-propagators:
    - pattern: $LIST.append($ITEM)
      from: $ITEM
      to: $LIST
    - pattern: $LIST.extend($ITEM)
      from: $ITEM
      to: $LIST
    - pattern: $LIST.insert($IDX, $ITEM)
      from: $ITEM
      to: $LIST
  pattern-sinks:
    # 셸이 해석하는 명령 문자열 (키워드 인자로 넘겨도 호출 전체를 본다)
    - pattern: os.system(...)
    - pattern: os.popen(...)
    - pattern: subprocess.getoutput(...)
    - pattern: subprocess.getstatusoutput(...)
    - pattern: asyncio.create_subprocess_shell(...)
    # subprocess 의 명령 인자(첫 위치 인자 또는 args=) 전체. shell 여부와 무관하다: 문자열 · 변수에 담은 목록 · x.split() ·
    # shlex.split(x) · 튜플 · 목록 연결은 실행 파일까지 입력이 정할 수 있다.
    # "문자열 리터럴로 시작하는 리스트 리터럴"(["ping", "-c", "1", host])만 뺀다 — 실행 파일이 고정이고 나머지는 인자일 뿐이다.
    # 그 모양이어도 위험한 경우는 아래 sink 들이 따로 본다.
    - patterns:
        - pattern-either:
            - pattern: subprocess.$FN($CMD, ...)
            - pattern: subprocess.$FN(..., args=$CMD, ...)
        - metavariable-regex:
            metavariable: $FN
            regex: ^(run|call|check_call|check_output|Popen)$
        - pattern-not: subprocess.$FN(["...", ...], ...)
        - focus-metavariable: $CMD
    # shell= 을 켠 호출은 리스트 리터럴이어도 본다 (Windows 는 목록을 이어 붙여 cmd.exe 에 넘긴다). shell=False 만 뺀다
    - patterns:
        - pattern: subprocess.$FN($CMD, ..., shell=$SHELL, ...)
        - pattern-not: subprocess.$FN($CMD, ..., shell=False, ...)
        - focus-metavariable: $CMD
    # executable= 은 첫 인자와 무관하게 실제로 실행할 프로그램을 정한다
    - patterns:
        - pattern: subprocess.$FN(..., executable=$CMD, ...)
        - focus-metavariable: $CMD
    # 실행 파일이 고정이어도 "인자를 다시 명령 · 코드로 실행하는 프로그램"이면 모든 인자가 sink:
    # ["sh", "-c", x], ["bash", "-lc", x], ["sudo", x], ["ssh", "host", x], ["env", x], ["python3", "-c", x] …
    - patterns:
        - pattern-either:
            - pattern: subprocess.$FN(["$EXE", ..., $ARG, ...], ...)
            - pattern: asyncio.create_subprocess_exec("$EXE", ..., $ARG, ...)
        - metavariable-regex:
            metavariable: $EXE
            regex: '(?i)^(?:.*[/\\])?(?:sh|bash|dash|zsh|ksh|csh|tcsh|fish|ash|busybox|cmd|powershell|pwsh|env|sudo|su|doas|runuser|nohup|nice|timeout|time|xargs|watch|setsid|chroot|flock|stdbuf|strace|ssh|sshpass|docker|podman|kubectl|nsenter|python[\d.]*|perl|ruby|node|php|lua|awk|gawk|sed|find|parallel|osascript)(?:\.exe)?$'
        - focus-metavariable: $ARG
    # 그 밖의 프로그램도 -c 류 옵션 바로 뒤의 값은 명령 · 스크립트로 해석된다 (["psql", "-c", x])
    - patterns:
        - pattern-either:
            - pattern: subprocess.$FN([..., "$FLAG", $ARG, ...], ...)
            - pattern: asyncio.create_subprocess_exec(..., "$FLAG", $ARG, ...)
        - metavariable-regex:
            metavariable: $FLAG
            regex: ^-[A-Za-z]*c$
        - focus-metavariable: $ARG
    # asyncio.create_subprocess_exec(program, *args): program 이 문자열 리터럴이 아니면 인자 어디든
    - patterns:
        - pattern: asyncio.create_subprocess_exec(...)
        - pattern-not: asyncio.create_subprocess_exec("...", ...)
    # os.exec* · os.spawn* · os.posix_spawn* · os.startfile: 인자 어디든 (실행 파일 · 인자 목록 · 키워드 인자)
    - patterns:
        - pattern: os.$X(...)
        - metavariable-regex:
            metavariable: $X
            regex: ^(exec[lv]p?e?|spawn[lv]p?e?|posix_spawnp?|startfile)$
    - pattern: pty.spawn(...)
