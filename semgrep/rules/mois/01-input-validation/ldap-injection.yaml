rules:
- id: mois-1-10-ldap-injection
  mode: taint
  languages: [java]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] LDAP 삽입: 외부 입력이 검증 없이 LDAP 검색 필터에 사용됨"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-10"
    mois-item: "LDAP 삽입"
    cwe: "CWE-90"
    gate: block
  # guard 판정을 엄격하게: "{ ... return/throw }" 가 실패 분기의 마지막 문장일 때만 맞도록 한다.
  # (기본값이면 분기 안쪽 깊숙한 곳의 조건부 return 까지 "중단"으로 맞아 버린다)
  options:
    go_deeper_stmt: false
  pattern-sources:
    - patterns:
        - pattern-either:
            - pattern: (javax.servlet.http.HttpServletRequest $REQ).$GET(...)
            - pattern: (jakarta.servlet.http.HttpServletRequest $REQ).$GET(...)
        - metavariable-regex:
            metavariable: $GET
            regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaders|getHeaderNames|getQueryString|getRequestURI|getRequestURL|getPathInfo|getCookies|getInputStream|getReader|getPart|getParts)$
    - pattern: (javax.servlet.http.Cookie $CK).getValue()
    - pattern: (jakarta.servlet.http.Cookie $CK).getValue()
    # 요청을 감싼 표준 객체: Spring 멀티파트·WebRequest, cos MultipartRequest, 업로드 파일의 원본 이름
    - patterns:
        - pattern-either:
            - pattern: (org.springframework.web.multipart.MultipartHttpServletRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.multipart.MultipartRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.context.request.WebRequest $REQ).$GET(...)
            - pattern: (org.springframework.web.context.request.NativeWebRequest $REQ).$GET(...)
            - pattern: (com.oreilly.servlet.MultipartRequest $REQ).$GET(...)
            - pattern: (javax.servlet.ServletRequest $REQ).$GET(...)
            - pattern: (jakarta.servlet.ServletRequest $REQ).$GET(...)
        - metavariable-regex:
            metavariable: $GET
            regex: ^(getParameter|getParameterValues|getParameterMap|getParameterNames|getHeader|getHeaderValues|getHeaderNames|getFilesystemName|getOriginalFileName|getFileNames|getInputStream|getReader)$
    - pattern: (org.springframework.web.multipart.MultipartFile $MF).getOriginalFilename()
    - patterns:
        - pattern-either:
            - pattern: $RET $M(..., @$A(...) $T $P, ...) { ... }
            - pattern: $RET $M(..., @$A $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $A
            regex: ^(RequestParam|PathVariable|RequestHeader|CookieValue|RequestBody|ModelAttribute|MatrixVariable)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|Integer|Long|Short|Byte|Double|Float|Boolean|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime)$).*
        - focus-metavariable: $P
    # Spring MVC 는 애너테이션이 없는 핸들러 매개변수도 요청 값으로 채운다 (단순형은 요청 파라미터, 객체는 폼 바인딩).
    # 숫자·날짜형과 프레임워크가 넣어 주는 객체(요청·응답·세션·모델 등), 요청과 무관한 애너테이션은 제외
    - patterns:
        - pattern-either:
            - pattern: |
                @$MAP(...)
                $RET $M(..., $T $P, ...) { ... }
            - pattern: |
                @$MAP
                $RET $M(..., $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $MAP
            regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|ModelAndView|Map|BindingResult|Errors|Locale|TimeZone|Principal|Authentication|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort|WebRequest|NativeWebRequest|InputStream|OutputStream|Reader|Writer|HttpMethod)\b).*
        # 애너테이션이 붙은 매개변수는 여기서 보지 않는다. 요청 바인딩 애너테이션은 위 항목, 검증 애너테이션은 아래 항목이 본다.
        # 그 밖의 애너테이션(@AuthenticationPrincipal, 직접 만든 @CurrentUser 등)은 요청 값이 아니라 프레임워크·리졸버가 넣는 값이다
        - pattern-not: $RET $M(..., @$ANN(...) $T $P, ...) { ... }
        - focus-metavariable: $P
    # 검증 애너테이션만 붙은 핸들러 매개변수(@Valid MemberForm form)도 요청 값으로 채워진다
    - patterns:
        - pattern: |
            @$MAP(...)
            $RET $M(..., @$VA(...) $T $P, ...) { ... }
        - metavariable-regex:
            metavariable: $MAP
            regex: ^(RequestMapping|GetMapping|PostMapping|PutMapping|PatchMapping|DeleteMapping)$
        - metavariable-regex:
            metavariable: $VA
            regex: ^(Valid|Validated|NotNull|NotBlank|NotEmpty|Size|Pattern|Length|Email|Nullable|NonNull)$
        - metavariable-regex:
            metavariable: $T
            regex: ^(?!(int|long|short|byte|double|float|boolean|char|Integer|Long|Short|Byte|Double|Float|Boolean|Character|BigDecimal|BigInteger|UUID|LocalDate|LocalDateTime|Date|HttpServletRequest|HttpServletResponse|ServletRequest|ServletResponse|HttpSession|Model|ModelMap|ModelAndView|Map|BindingResult|Errors|Locale|TimeZone|Principal|Authentication|RedirectAttributes|SessionStatus|UriComponentsBuilder|Pageable|Sort|WebRequest|NativeWebRequest|InputStream|OutputStream|Reader|Writer|HttpMethod)\b).*
        - focus-metavariable: $P
  pattern-sanitizers:
    # 전체 일치 정규식 검사(String.matches)는 guard 일 때만 인정한다 (docs/rule-conventions.md 1절).
    # 결과를 버리거나, 실패해도 계속 진행하거나, 반대 분기에서 쓰면 탐지된다.
    # (1) 실패 시 중단: if (!x.matches(..)) { ... return/throw } "뒤"에 오는 x 만 인정한다 (docs/rule-conventions.md 1절 v2).
    #     null 검사와 || 로 묶여도 된다. 실패 분기 안에서의 사용, 검사 뒤 재대입, || 가 아닌 식(&&·&·?: 등)에 묶인 검사는 탐지된다.
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if ($COND) { ... return ...; }
                ...
            - pattern-inside: |
                if ($COND) { ... throw $E; }
                ...
            - pattern-inside: |
                if ($COND) return ...;
                ...
            - pattern-inside: |
                if ($COND) throw $E;
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: '!$X.matches(...)'
                  - pattern: $X.matches(...) == false
              # 검사식을 감싸는 식은 || 뿐이어야 한다 (x == null || 검사). &&·&·^·?:·!(…)·== false·호출 인자처럼
              # 다른 식 안에 들어 있으면 "검사 실패 = 중단" 이 아니다. $WRAP 은 검사식을 품은 모든 식(검사식 자신 포함)에 맞는다
              - pattern-not-inside:
                  patterns:
                    - pattern: $WRAP
                    - pattern-not: $OR1 || $OR2
                    - pattern-not: '!$X.matches(...)'
                    - pattern-not: $X.matches(...) == false
        - pattern-not-inside: |
            if ($COND) $S;
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $X = $V;
            ...
        - pattern-not-inside: |
            if ($COND) $S;
            ...
            $X += $V;
            ...
        - pattern: $X
    # (2) 조건 안에서만 사용: if (x != null && x.matches(..)) { use(x) }
    #     검사식을 감싸는 식은 && 뿐이어야 한다 (||·|·^·?:·!(…)·== false 등은 검사가 거짓이어도 본문에 들어온다).
    #     else 가 있거나, 조건식 안에서 쓰거나(검사보다 먼저 실행될 수 있다), 본문에서 다시 대입하면 인정하지 않는다
    - patterns:
        - pattern-inside: |
            if ($COND) $S;
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern: $X.matches(...)
              - pattern-not-inside:
                  patterns:
                    - pattern: $WRAP
                    - pattern-not: $AND1 && $AND2
                    - pattern-not: $X.matches(...)
        - pattern-not-inside: $COND
        - pattern-not-inside: |
            if ($C) $S1; else $S2;
        - pattern-not-inside: |
            if ($COND) { ... $X = $V; ... }
        - pattern-not-inside: |
            if ($COND) { ... $X += $V; ... }
        - pattern: $X
    # LDAP 필터용 인코더 (값을 이스케이프한다).
    # ESAPI encodeForLDAP(값) 은 encodeForLDAP(값, true) 와 같다. (값, false) 는 * 를 그대로 두므로 인정하지 않는다
    - pattern: org.springframework.ldap.support.LdapEncoder.filterEncode(...)
    - pattern: org.owasp.esapi.ESAPI.encoder().encodeForLDAP($V)
    - pattern: org.owasp.esapi.ESAPI.encoder().encodeForLDAP($V, true)
    # Spring LDAP 필터 객체는 "값"만 이스케이프한다. 속성 이름(첫 인자)이 문자열 리터럴일 때만 인정한다.
    # LikeFilter 는 값의 * 를 그대로 두고 WhitespaceWildcardsFilter 는 공백을 * 로 바꾸므로(빈 값이면 모든 항목에 맞는다) 인정하지 않는다
    - patterns:
        - pattern: new org.springframework.ldap.filter.$FILTERCLASS("...", ...)
        - metavariable-regex:
            metavariable: $FILTERCLASS
            regex: ^(EqualsFilter|GreaterThanOrEqualsFilter|LessThanOrEqualsFilter)$
  pattern-propagators:
    - pattern: $SB.append($X)
      from: $X
      to: $SB
    # 컬렉션에 넣은 값은 컬렉션 전체를 오염시킨다 (요소 단위로는 구분하지 못한다)
    - pattern: $COL.add($X)
      from: $X
      to: $COL
    - pattern: $COL.add($IDX, $X)
      from: $X
      to: $COL
    - pattern: $COL.put($KEY, $X)
      from: $X
      to: $COL
    - pattern: $COL.addAll($X)
      from: $X
      to: $COL
  pattern-sinks:
    # search(이름, 필터, ...) 의 필터 인자. 필터 인자 배열({0})을 쓰는 4인자 형식은 필터가 상수라 탐지되지 않는다
    - patterns:
        - pattern-either:
            - pattern: (javax.naming.directory.DirContext $C).search($NAME, $FILTER, ...)
            - pattern: (javax.naming.directory.InitialDirContext $C).search($NAME, $FILTER, ...)
            - pattern: (javax.naming.ldap.LdapContext $C).search($NAME, $FILTER, ...)
            - pattern: (javax.naming.ldap.InitialLdapContext $C).search($NAME, $FILTER, ...)
            - pattern: (org.springframework.ldap.core.LdapTemplate $T).search($NAME, $FILTER, ...)
            - pattern: (org.springframework.ldap.core.LdapTemplate $T).searchForObject($NAME, $FILTER, ...)
            - pattern: (org.springframework.ldap.core.LdapTemplate $T).authenticate($NAME, $FILTER, ...)
            - pattern: (org.springframework.ldap.core.LdapOperations $T).search($NAME, $FILTER, ...)
        - focus-metavariable: $FILTER
