rules:
- id: mois-1-03-path-traversal-py
  mode: taint
  languages: [python]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] 경로 조작 및 자원 삽입: 외부 입력이 검증 없이 파일 경로에 사용됨 — os.path.basename·secure_filename 으로 파일명만 남기거나, resolve() 한 경로가 기준 디렉터리 안인지(is_relative_to·startswith(기준 + os.sep)) 확인해 벗어나면 중단할 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-3"
    mois-item: "경로 조작 및 자원 삽입"
    cwe: "CWE-22"
    gate: block
  # guard sanitizer(규약 §1 v2)가 '분기의 마지막 문장이 return·raise' 일 때만 중단으로 보게 한다
  options:
    go_deeper_stmt: false
  pattern-sources:
    # (A) 요청 객체의 값. 이름이 request·req 인 객체, flask.request(별칭 import 포함), 타입이 Request·WebSocket 으로 적힌 매개변수
    - patterns:
        - pattern-either:
            - patterns:
                - pattern: $REQ.$ATTR
                - metavariable-regex:
                    metavariable: $REQ
                    regex: ^(request|req|self\.request)$
            - pattern: flask.request.$ATTR
            - patterns:
                - pattern-inside: |
                    def $F(..., $REQ: $RT, ...):
                      ...
                - metavariable-regex:
                    metavariable: $RT
                    regex: ^(\w+\.)*(Request|HttpRequest|WebSocket|HTTPConnection)$
                - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(GET|POST|COOKIES|META|FILES|body|headers|data|query_params|path_params|cookies|args|form|values|json|files|view_args|get_json|get_data|query_string|stream|url|path|full_path|get_full_path|read|readline|readlines|referrer|environ|user_agent|authorization|content_type|mimetype|resolver_match|receive_text|receive_json|receive_bytes|receive|iter_text|iter_json|iter_bytes)$
    # Django 클래스 뷰의 URL 인자
    - pattern: self.kwargs
    # (B) 라우트 함수 매개변수 — 타입 표기 없음. 의존성(= Depends(...)·Security(...))만 제외한다
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - pattern-not-inside: |
          def $F(..., $P: $T, ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P=fastapi.Security(...), ...):
            ...
      - focus-metavariable: $P
    # (B) 라우트 함수 매개변수 — 타입 표기 있음. 문자열을 실을 수 없는 타입(끝까지 일치), 프레임워크 타입, 의존성만 제외한다.
    #     의존성은 Depends·Security 가 보이거나, FastAPI 문서의 별칭 이름(…Dep·Current…User)이거나, 같은 파일에서 별칭으로 정의한 타입일 때만 인정한다.
    #     타입 이름이 …Config·…Client·…Settings 라는 것만으로는 제외하지 않는다 (요청 본문 모델일 수 있다)
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)(?!((\w+\.)*(Request|HttpRequest|Response|WebSocket|BackgroundTasks|Session|AsyncSession|HTTPConnection|SecurityScopes))$)(?!\w*(Dep|Deps|Dependency)$)(?!Current\w*(User|Account|Member|Principal|Admin)\w*$)(?!Annotated\[.*\b(Depends|Security)\()'
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Depends(...), ...):
            ...
      - pattern-not-inside: |
          def $F(..., $P: $T = fastapi.Security(...), ...):
            ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Depends(...)]
          ...
      - pattern-not-inside: |
          $T = typing.Annotated[$X, fastapi.Security(...)]
          ...
      - focus-metavariable: $P
    # 의존성으로 주입돼도 요청 값인 것: 문자열·바이트(토큰·헤더 값)와 fastapi.security 의 폼·자격증명 객체
    - patterns:
      - pattern-inside: |
          @$APP.$METHOD(...)
          def $F(..., $P: $T, ...):
            ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
      - metavariable-regex:
          metavariable: $T
          regex: '^(Annotated\[\s*)?(str|bytes|OAuth2PasswordRequestForm|OAuth2PasswordRequestFormStrict|HTTPBasicCredentials|HTTPAuthorizationCredentials)\s*(\|\s*None\s*)?(,.*\])?$'
      - focus-metavariable: $P
    # 인자 없는 Depends(): 그 타입을 요청 값으로 만들어 넣는다 (쿼리·폼 모델). 서비스·저장소로 보이는 이름만 제외
    - patterns:
        - pattern-either:
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: $T = fastapi.Depends(), ...):
                  ...
            - pattern-inside: |
                @$APP.$METHOD(...)
                def $F(..., $P: typing.Annotated[$T, fastapi.Depends()], ...):
                  ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|head|options|route|api_route|websocket)$
        - metavariable-regex:
            metavariable: $T
            regex: '^(?!(Annotated\[\s*)?(\w+\.)*\w*(Service|Repository|Repo|Client|Manager|Session|UseCase|Handler|Factory|Provider|Settings|Config)\s*(,.*\])?$)'
        - focus-metavariable: $P
    # Flask 는 함수의 타입 표기를 검사하지 않는다: 경로에 변환기 없는 자리(<name>, <string:…>, <path:…>)가 있으면 숫자 표기여도 문자열이다
    - patterns:
        - pattern-inside: |
            @$APP.$METHOD("$PATH", ...)
            def $F(..., $P: $T, ...):
              ...
        - metavariable-regex:
            metavariable: $METHOD
            regex: ^(get|post|put|patch|delete|route)$
        - metavariable-regex:
            metavariable: $PATH
            regex: .*<((string|path|any)[^:>]*:)?\w+>
        - metavariable-regex:
            metavariable: $T
            regex: '^((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$'
        - focus-metavariable: $P
    # 요청 값이라고 선언한 매개변수는 라우트 함수가 아니어도(의존성 함수) 입력이다: x: str = Header(), x = Query(None), Annotated[str, Form()]
    - patterns:
        - pattern-either:
            - patterns:
                - pattern-either:
                    # 타입 표기가 없는 것만 (def f(x=Query())). 표기가 있으면 아래 가지가 숫자형을 거른다
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P=$Q(...), ...):
                              ...
                        - pattern-not-inside: |
                            def $F(..., $P: $T2 = $Q(...), ...):
                              ...
                    - patterns:
                        - pattern-inside: |
                            def $F(..., $P: $T = $Q(...), ...):
                              ...
                        - metavariable-regex:
                            metavariable: $T
                            regex: '^(?!((int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?|Optional\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\s*\]|Annotated\[\s*(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)(\s*\|\s*None)?\s*,.*\])$)'
                - metavariable-regex:
                    metavariable: $Q
                    regex: ^(fastapi\.)?(Query|Header|Cookie|Form|Body|File|Path)$
            - patterns:
                - pattern-inside: |
                    def $F(..., $P: $T, ...):
                      ...
                - metavariable-regex:
                    metavariable: $T
                    regex: '^Annotated\[\s*(?!(int|float|bool|complex|Decimal|UUID|uuid\.UUID|date|datetime|datetime\.date|datetime\.datetime|time|timedelta)\b)[^,]*,.*\b(Query|Header|Cookie|Form|Body|File|Path)\('
        - focus-metavariable: $P
    # Django 뷰의 URL 인자: 첫 매개변수가 request 인 함수·메서드의 나머지 매개변수 (URLconf 의 <str:…>·<path:…>·정규식 그룹).
    # 변환기는 urls.py 에 있어 볼 수 없으므로 숫자 타입 표기가 있는 것만 제외한다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                def $F(request, ..., $P, ...):
                  ...
            - pattern-inside: |
                def $F(self, request, ..., $P, ...):
                  ...
        - pattern-not-inside: |
            def $F(..., $P: $T, ...):
              ...
        - pattern-not-inside: |
            def $F(..., *$P, ...):
              ...
        - pattern-not-inside: |
            def $F(..., **$P, ...):
              ...
        - focus-metavariable: $P
  pattern-sanitizers:
    # 파일명만 남기는 함수 (디렉터리 부분을 버린다) · 정수로 바꾼 값
    - pattern: os.path.basename(...)
    - pattern: werkzeug.utils.secure_filename(...)
    - pattern: django.utils.text.get_valid_filename(...)
    - pattern: pathlib.Path(...).name
    - pattern: pathlib.PurePath(...).name
    - pattern: pathlib.PurePosixPath(...).name
    - pattern: int(...)
    # 안전 결합 함수 safe_join(기준, 입력, …) — 기준을 벗어나면 None·예외가 된다.
    #   정화되는 것은 "뒤쪽 인자"뿐이다. 첫 인자(기준 디렉터리)가 외부 입력이면 결과도 외부 입력이다: safe_join(request.args["dir"], name)
    - patterns:
        - pattern-either:
            - pattern: werkzeug.security.safe_join($BASE, ..., $ARG, ...)
            - pattern: werkzeug.utils.safe_join($BASE, ..., $ARG, ...)
            - pattern: flask.safe_join($BASE, ..., $ARG, ...)
            - pattern: django.utils._os.safe_join($BASE, ..., $ARG, ...)
        - focus-metavariable: $ARG
    # ---- 기준 디렉터리 검사 ----
    # 공통 조건: 검사하는 경로는 "정규화한 값을 담은 변수"여야 한다 — 바로 앞의 대입이 os.path.realpath·abspath·normpath(...) 또는 ….resolve() 이고,
    #   그 뒤 같은 블록에서(검사 전이든 후든) 다시 대입하거나 덧붙이지(=, +=, /=) 않아야 한다. 아래 검사들은 모두 글자 비교라 정규화하지 않은 경로는
    #   "/srv/media/../../etc/passwd" 처럼 기준으로 시작하면서 기준 밖을 가리킬 수 있다 (pathlib 의 relative_to·is_relative_to 도 ".." 을 풀지 않는다)
    #
    # relative_to(기준) — 기준 밖이면 ValueError 를 낸다. 그 예외로 실제로 멈추는 자리만 인정한다 (호출이 있다는 것만으로는 인정하지 않는다):
    #   (가) 호출 "뒤, 같은 블록"의 그 변수 — 예외가 나면 그 블록의 나머지는 실행되지 않는다 (try 안이면 try 본문의 나머지까지만).
    #        try/except 로 삼킨 뒤(try 문 뒤)에 쓰는 것, 조건부로만 호출하는 것은 여기에 들지 않아 탐지된다
    #        반환값을 변수에 담는 문장(rel = p.relative_to(기준)) 안에서는 정화하지 않는다 — 예외를 삼키면 그 변수에 예전 값(입력)이 남는다.
    #        그래서 반환값으로 다시 만든 경로(기준 / rel)는 탐지된다 (검사한 변수 p 를 그대로 쓰면 된다)
    - patterns:
        - pattern-inside: |
            $X.relative_to(...)
            ...
        - pattern-not-inside: $R = <... $X.relative_to(...) ...>
        - pattern-inside: |
            $X = $P.resolve(...)
            ...
        - pattern-not-inside: |
            $X = $P.resolve(...)
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            $X = $P.resolve(...)
            ...
            $X /= $V
            ...
        - pattern-not-inside: |
            $X.relative_to(...)
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            $X.relative_to(...)
            ...
            $X /= $V
            ...
        - pattern: $X
    #   (나) try 본문의 마지막 문장이 호출이고, 하나뿐인 except 가 빠져나갈 때(마지막 문장이 raise·return·flask.abort — `raise … from …` 은 Semgrep 이 `raise ...` 와 다른 모양으로 보아 따로 적는다) try 문 "뒤"의 그 변수.
    #        except 안에서 쓰는 것, except 가 둘 이상인 것(하나만 빠져나갈 수 있다), 삼키는 것(pass·로그만)은 탐지된다.
    #        else·finally 가 붙은 try 와 resolve() 를 try 안에서 하는 형태는 인정하지 않는다 (탐지됨 — is_relative_to guard 로 바꾸면 된다)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                try:
                    ...
                    $X.relative_to(...)
                except ...:
                    ...
                    raise ...
                ...
            - pattern-inside: |
                try:
                    ...
                    $X.relative_to(...)
                except ...:
                    ...
                    raise
                ...
            - pattern-inside: |
                try:
                    ...
                    $X.relative_to(...)
                except ...:
                    ...
                    raise $E from $CAUSE
                ...
            - pattern-inside: |
                try:
                    ...
                    $X.relative_to(...)
                except ...:
                    ...
                    return ...
                ...
            - pattern-inside: |
                try:
                    ...
                    $X.relative_to(...)
                except ...:
                    ...
                    flask.abort(...)
                ...
        - pattern-not-inside: |
            try:
                ...
                $X.relative_to(...)
            except ...:
                ...
            except ...:
                ...
            ...
        - pattern-not-inside: |
            try:
                ...
                $X.relative_to(...)
            except ...:
                ...
        - pattern-inside: |
            $X = $P.resolve(...)
            ...
        - pattern-not-inside: |
            $X = $P.resolve(...)
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            $X = $P.resolve(...)
            ...
            $X /= $V
            ...
        - pattern-not-inside: |
            try:
                ...
                $X.relative_to(...)
            except ...:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            try:
                ...
                $X.relative_to(...)
            except ...:
                ...
            ...
            $X /= $V
            ...
        - pattern: $X
    # 기준 디렉터리 안인지 확인하는 검사는 아래 식만 인정한다:
    #   Path.is_relative_to(기준) · startswith(기준 + 구분자) · os.path.commonpath([기준, 경로]) == 기준
    #   구분자 없는 startswith(기준) 과 commonprefix 는 "/srv/data-evil" 이 "/srv/data" 로 통과하므로 인정하지 않는다
    # 기준 디렉터리 검사 — 실패 시 중단: 검사에 실패하면 빠져나가는(return·raise·continue·flask.abort·sys.exit) if 문 **뒤**의 그 변수만 검증된 것으로 본다 (규약 §1 v2).
    #   결과를 버림 · 실패해도 계속 진행 · 실패 분기 안에서 사용 · 안쪽 조건부 return · 검사 뒤 재대입(=, +=, /=) · and · & 로 묶인 검사 ·
    #   else 가 붙은 guard(else 에서 값을 바꿀 수 있다) · 정규화하지 않은 경로 · 정규화와 검사 사이에 바꾼 경로는 인정하지 않는다
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if $COND:
                    ...
                    return ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    raise ...
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    continue
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    flask.abort(...)
                ...
            - pattern-inside: |
                if $COND:
                    ...
                    sys.exit(...)
                ...
        - metavariable-pattern:
            metavariable: $COND
            patterns:
              - pattern-either:
                  - pattern: not $X.is_relative_to(...)
                  - pattern: not $X.startswith($B + os.sep)
                  - pattern: not $X.startswith($B + os.path.sep)
                  - pattern: not $X.startswith($B + "/")
                  - pattern: not $X.startswith(os.path.join($B, ""))
                  - patterns:
                      - pattern: not $X.startswith("$DIR")
                      - metavariable-regex:
                          metavariable: $DIR
                          regex: ^/.+/$
                  - pattern: os.path.commonpath([$B, $X]) != $B
                  - pattern: os.path.commonpath([$X, $B]) != $B
              - pattern-not-inside: $P and $Q
              - pattern-not-inside: $P & $Q
        - pattern-inside: |
            $X = $NORM(...)
            ...
        - metavariable-regex:
            metavariable: $NORM
            regex: ^((os\.path\.)?(realpath|abspath|normpath)|.+\.resolve)$
        - pattern-not-inside: |
            $X = $NORM(...)
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            $X = $NORM(...)
            ...
            $X += $V
            ...
        - pattern-not-inside: |
            $X = $NORM(...)
            ...
            $X /= $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
        - pattern-not-inside: |
            if $COND:
                ...
            else:
                ...
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X = $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X += $V
            ...
        - pattern-not-inside: |
            if $COND:
                ...
            ...
            $X /= $V
            ...
        - pattern: $X
    # 기준 디렉터리 검사 — 조건 안에서만 사용: 검사를 통과한 if 안 (else·부정·or·| 가 있거나, 그 안에서 다시 대입·덧붙이면 인정하지 않는다)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                if <... $X.is_relative_to(...) ...>:
                    ...
            - pattern-inside: |
                if <... $X.startswith($B + os.sep) ...>:
                    ...
            - pattern-inside: |
                if <... $X.startswith($B + os.path.sep) ...>:
                    ...
            - pattern-inside: |
                if <... $X.startswith($B + "/") ...>:
                    ...
            - pattern-inside: |
                if <... $X.startswith(os.path.join($B, "")) ...>:
                    ...
            - patterns:
                - pattern-inside: |
                    if <... $X.startswith("$DIR") ...>:
                        ...
                - metavariable-regex:
                    metavariable: $DIR
                    regex: ^/.+/$
            - pattern-inside: |
                if <... os.path.commonpath([$B, $X]) == $B ...>:
                    ...
            - pattern-inside: |
                if <... os.path.commonpath([$X, $B]) == $B ...>:
                    ...
        - pattern-inside: |
