rules:
- id: mois-1-09-xpath-injection-js
  mode: taint
  languages: [javascript, typescript]
  severity: ERROR
  message: "[행안부 입력데이터 검증 및 표현] XML 삽입: 외부 입력이 XPath 질의문에 이어 붙여 사용됨 — 질의문은 상수로 두고 값은 XPath 변수(xpath.parse(식).select({ variables }), fontoxpath 의 variables 인자)로 넘기거나, 정규식 허용 목록으로 검증한 뒤 쓸 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "입력데이터 검증 및 표현"
    mois-item-no: "1-9"
    mois-item: "XML 삽입"
    cwe: "CWE-643"
    gate: block
  # 대상: npm xpath(select · select1 · evaluate · parse, useNamespaces(...) 로 만든 함수), fontoxpath evaluateXPath*,
  #       브라우저 document.evaluate(인자 5개짜리 DOM 형태 포함), libxmljs 문서(같은 함수에서 parseXml 로 만든 것)의 get · find.
  #       질의문(첫 인자)만 본다 — XPath 변수 · 문맥 노드로 넘긴 값은 탐지하지 않는다.
  # 한계: 허용 목록 · 정규식 검사(guard)는 인정하지 않는다 (탐지된다 — 오탐 쪽). 함수 안 taint 만.
  pattern-sources:
    # (A) 서버 요청 값 (정규식은 가지마다 따로 건다 — 한 묶음에서 일부 가지에만 있는 메타변수에 걸면 나머지 가지가 무효가 된다)
    - patterns:
        - pattern: $REQ.$ATTR
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|params|cookies|signedCookies|headers|originalUrl|url|path|hostname|files|file)$
    - patterns:
        - pattern: $REQ.$GET(...)
        - metavariable-regex:
            metavariable: $REQ
            regex: ^(req|request)$
        - metavariable-regex:
            metavariable: $GET
            regex: ^(get|header|param)$
    - pattern: ctx.query
    - pattern: ctx.params
    - pattern: ctx.headers
    - pattern: ctx.cookies.get(...)
    - patterns:
        - pattern: ctx.request.$ATTR
        - metavariable-regex:
            metavariable: $ATTR
            regex: ^(query|body|headers|files|url|path)$
    # (A-2) 요청 객체를 구조분해한 핸들러 매개변수: ({ params, query, body }: Request, res) => …  (두 번째 매개변수가 res·response·reply 일 때만)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                ({..., $K, ...}, $RES, ...) => { ... }
            - pattern-inside: |
                ({..., $K, ...}: $T, $RES, ...) => { ... }
            - pattern-inside: |
                function ({..., $K, ...}, $RES, ...) { ... }
            - pattern-inside: |
                function $FN({..., $K, ...}, $RES, ...) { ... }
        - metavariable-regex:
            metavariable: $K
            regex: ^(query|body|params|cookies|headers|files|file)$
        - metavariable-regex:
            metavariable: $RES
            regex: ^(res|response|reply)$
        - pattern: $K
    # (B) NestJS 컨트롤러 매개변수 (숫자 변환 파이프 ParseIntPipe·ParseFloatPipe·ParseBoolPipe·ParseUUIDPipe 를 준 것은 제외)
    - patterns:
        - pattern-either:
            - pattern-inside: |
                $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                $M(..., @$D(...) $P: $T, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P, ...) { ... }
            - pattern-inside: |
                async $M(..., @$D(...) $P: $T, ...) { ... }
        - metavariable-regex:
            metavariable: $D
            regex: ^(Query|Body|Param|Headers|Req|Request)$
        - pattern-not-inside:
            patterns:
              - pattern-either:
                  - pattern-inside: |
                      $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., $PIPE, ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
                  - pattern-inside: |
                      async $M(..., @$D(..., new $PIPE(...), ...) $P: $T, ...) { ... }
              - metavariable-regex:
                  metavariable: $PIPE
                  regex: ^Parse(Int|Float|Bool|UUID|Enum)Pipe$
        - focus-metavariable: $P
    # (C) 브라우저 입력
    - patterns:
        - pattern-either:
            - pattern: location.$LOC
            - pattern: window.location.$LOC
            - pattern: document.location.$LOC
        - metavariable-regex:
            metavariable: $LOC
            regex: ^(href|search|hash|pathname)$
    - pattern: document.URL
    - pattern: document.documentURI
    - pattern: document.referrer
    - pattern: window.name
    - patterns:
        - pattern-inside: |
            $W.addEventListener("message", ($E) => { ... })
        - pattern: $E.data
    # Angular ActivatedRoute: this.route.snapshot.queryParams.q · .params · .paramMap.get(...) · .fragment
    - patterns:
        - pattern: $R.snapshot.$P
        - metavariable-regex:
            metavariable: $P
            regex: ^(queryParams|params|queryParamMap|paramMap|fragment)$
    - pattern: useParams()
    - pattern: useSearchParams()
    - pattern: useLocation()
    - pattern: useRouter().query
    - patterns:
        - pattern-inside: |
            $R = useRouter();
            ...
        - pattern: $R.query
  pattern-sanitizers:
    - pattern: Number($X)
    - pattern: parseInt($X, ...)
  pattern-sinks:
    - patterns:
        - pattern-either:
            - patterns:
                - pattern: xpath.$F($E, ...)
                - metavariable-regex:
                    metavariable: $F
                    regex: ^(select|select1|evaluate|parse)$
            - pattern: xpath.useNamespaces(...)($E, ...)
            - patterns:
                - pattern-inside: |
                    $SEL = xpath.useNamespaces(...);
                    ...
                - pattern: $SEL($E, ...)
            - patterns:
                - pattern: fontoxpath.$F($E, ...)
                - metavariable-regex:
                    metavariable: $F
                    regex: ^evaluateXPath\w*$
            - pattern: document.evaluate($E, ...)
            - pattern: $DOC.evaluate($E, $CTX, $NSR, $TYPE, $RESULT)
            - patterns:
                - pattern-either:
                    - pattern-inside: |
                        $DOC = libxmljs.$PARSE(...);
                        ...
                    - pattern-inside: |
                        $DOC = libxmljs2.$PARSE(...);
                        ...
                - pattern-either:
                    - pattern: $DOC.get($E, ...)
                    - pattern: $DOC.find($E, ...)
                    - pattern: $DOC.root().get($E, ...)
                    - pattern: $DOC.root().find($E, ...)
        - focus-metavariable: $E
