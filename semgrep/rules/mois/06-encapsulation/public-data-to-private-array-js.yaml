rules:
- id: mois-6-04-public-data-to-private-array-js
  languages: [javascript, typescript]
  severity: WARNING
  message: "[행안부 캡슐화] Private 배열에 Public 데이터 할당: 공개 메서드·생성자가 받은 인자를 비공개 필드(TS private·JS #필드)의 배열·Map·Set 에 그대로 저장함 — 호출한 쪽이 같은 객체를 계속 바꿀 수 있으니 복사본([...items]·new Map(map))을 저장할 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "캡슐화"
    mois-item-no: "6-4"
    mois-item: "Private 배열에 Public 데이터 할당"
    cwe: "CWE-496"
    gate: warn
  patterns:
    # 비공개 필드(TS private, JS #필드)가 배열·Map·Set 으로 선언된 클래스
    - pattern-either:
        - patterns:
            - pattern-either:
                - pattern-inside: |
                    class $C { ... private $F: $T = $INIT; ... }
                - pattern-inside: |
                    class $C { ... private $F = $INIT; ... }
                - patterns:
                    - pattern-inside: |
                        class $C { ... $F = $INIT; ... }
                    - metavariable-regex:
                        metavariable: $F
                        regex: ^#
            - metavariable-pattern:
                metavariable: $INIT
                pattern-either:
                  - pattern: "[...]"
                  - pattern: new Array(...)
                  - pattern: Array(...)
                  - pattern: Array.from(...)
                  - pattern: Array.of(...)
                  - pattern: new Map(...)
                  - pattern: new Set(...)
        # 초기값 없이 배열 타입으로만 선언: private items: string[]; (생성자에서 채움)
        - patterns:
            - pattern-either:
                - pattern-inside: |
                    class $C { ... private $F: $T; ... }
                - patterns:
                    - pattern-inside: |
                        class $C { ... $F: $T; ... }
                    - metavariable-regex:
                        metavariable: $F
                        regex: ^#
            - metavariable-regex:
                metavariable: $T
                regex: ^(.*\[\]|Array<.*>|Map<.*>|Set<.*>)$
    # 공개 메서드(private·protected·#메서드가 아닌 것, getter 포함)
    - pattern-inside: |
        $M(...) { ... }
    - pattern-not-inside: |
        private $M(...) { ... }
    - pattern-not-inside: |
        protected $M(...) { ... }
    - metavariable-regex:
        metavariable: $M
        regex: ^[^#]
    # 그 메서드가 받은 인자를 그대로 저장
    - pattern-inside: |
        $M(..., $P, ...) { ... }
    - pattern: this.$F = $P
