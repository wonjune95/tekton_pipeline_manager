rules:
- id: mois-6-01-shared-field-in-singleton
  languages: [java]
  severity: WARNING
  message: "[행안부 캡슐화] 잘못된 세션에 의한 데이터 정보 노출: 서블릿·Spring 빈(싱글톤)의 멤버 변수를 요청 처리 메서드에서 바꿈 — 멤버 변수는 모든 사용자·스레드가 공유하므로 요청별 데이터는 지역 변수나 세션에 둘 것"
  metadata:
    rule-type: mois
    mois-guide: "2021 소프트웨어 보안약점 진단가이드"
    mois-category: "캡슐화"
    mois-item-no: "6-1"
    mois-item: "잘못된 세션에 의한 데이터 정보 노출"
    cwe: "CWE-488; CWE-543"
    gate: warn
  # 요청마다 실행되는 메서드에서 멤버 변수에 값을 쓰는 줄을 표시한다.
  # (서블릿의 모든 멤버 변수를 표시하던 v0.5.0 과 달리, init() 에서 한 번 정하는 설정값이나 쓰지 않는 필드는 표시하지 않는다.
  #  대입하는 값이 요청에서 왔는지까지는 따지지 않는다 — 세션·인증 정보처럼 요청 객체를 거치지 않는 사용자별 값도 같은 약점이기 때문)
  patterns:
    # (가) 인스턴스 하나를 모든 요청이 공유하는 클래스: 서블릿, Spring 스테레오타입 빈
    - pattern-either:
        - pattern-inside: |
            class $C extends javax.servlet.http.HttpServlet { ... }
        - pattern-inside: |
            class $C extends jakarta.servlet.http.HttpServlet { ... }
        - pattern-inside: |
            class $C extends javax.servlet.GenericServlet { ... }
        - pattern-inside: |
            class $C extends jakarta.servlet.GenericServlet { ... }
        - patterns:
            # 인자 없는 애너테이션(@Service)도 이 형태에 맞는다
            - pattern-inside: |
                @$STEREO(...)
                class $C { ... }
            - metavariable-regex:
                metavariable: $STEREO
                regex: ^(Controller|RestController|Service|Component|Repository)$
    # 싱글톤이 아닌 빈(@Scope("prototype"·"request"·"session"), @RequestScope, @SessionScope)은 제외
    - pattern-not-inside:
        patterns:
          - pattern: |
              @Scope(...)
              class $C { ... }
          - pattern-not: |
              @Scope("singleton")
              class $C { ... }
    - pattern-not-inside: |
        @RequestScope
        class $C { ... }
    - pattern-not-inside: |
        @SessionScope
        class $C { ... }
    # (나) 그 클래스의 멤버 변수 $F
    - pattern-either:
        - pattern-inside: |
            class $C { ... $FT $F; ... }
        - pattern-inside: |
            class $C { ... $FT $F = $FI; ... }
    # (다) 요청 처리 메서드 안: 생성자는 이 형태에 맞지 않고, 초기화·주입용 메서드는 이름·애너테이션으로 뺀다
    - pattern-inside: |
        $RET $M(...) { ... }
    - metavariable-regex:
        metavariable: $M
        regex: ^(?!(set[A-Z].*|init|destroy|afterPropertiesSet)$).*
    - pattern-not-inside: |
        @PostConstruct
        $RET $M(...) { ... }
    - pattern-not-inside: |
        @Autowired
        $RET $M(...) { ... }
    # (라) 멤버 변수에 쓰기. 이름이 같은 인자·지역 변수는 Semgrep 이 다른 변수로 구분하므로 따로 빼지 않아도 된다
    - pattern-either:
        - pattern: this.$F = $V
        - pattern: this.$F += $V
        - pattern: this.$F++
        - pattern: ++this.$F
        - pattern: this.$F--
        - pattern: --this.$F
        - pattern: $F = $V
        - pattern: $F += $V
        - pattern: $F++
        - pattern: ++$F
        - pattern: $F--
        - pattern: --$F
