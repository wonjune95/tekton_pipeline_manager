# 주의: 이 ConfigMap 은 기본적으로 어떤 워크로드에도 마운트되지 않는다.
# 쓰려면 base/manifest.yaml 의 volumes / volumeMounts 에
# /app/config/application.yaml 로 연결할 것 (Spring Boot 기본 탐색 경로).
# 마운트하면 jar 내장 설정을 덮어쓰니 datasource 값을 먼저 확인할 것.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{application_name}}-cm
data:
  application.yaml: |
    deployed:
      NODE_NAME: ${NODE_NAME:}
      NODE_IP: ${NODE_IP:}
      NAMESPACE: ${NAMESPACE:}
      POD_NAME: ${POD_NAME:}
      POD_IP: ${POD_IP:}
      JAVA_OPTS: ${JAVA_OPTS:}
    server:
      port: 8080
      servlet:
        context-path: /api
    spring:
      datasource:
        driver-class-name: org.h2.Driver
        url: jdbc:h2:mem:test
        username: backend
        password: backend
      jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        hibernate:
          ddl-auto: create-drop